/* ============================================================
   A CIDADE QUE ESQUECEU — identidade visual
   Papel quente + contorno de tinta + pixel art
   ============================================================ */
:root {
  --ink: #2b2233; --ink2: #4a4058; --paper: #fbf3e4; --paper2: #f3e6cf; --paper3: #e9d8b9;
  --gold: #f4c542; --gold2: #c99a2a; --glow: #fff1a8; --night: #27305a; --night2: #1b2142;
  --ok: #3d7f4c; --okbg: #dff2d8; --soft: #a8452f; --softbg: #fde3d6;
  --accent: #e0705a; --fog: #b9b6c6;
  --r: 10px; --bw: 3px; --shadow: 4px 4px 0 var(--ink);
  --fs: 18px;
  --title: 'Pixelify Sans', 'Courier New', monospace;
  --body: 'Nunito', 'Trebuchet MS', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: var(--fs); }
html.bt { --fs: 21px; }
html.sala { --fs: 24px; }
html.sala #app, html.sala .footbar .in { max-width: 1560px; }
html.sala.bt { --fs: 25px; }
body {
  margin: 0; min-height: 100vh; font-family: var(--body); color: var(--ink); line-height: 1.45;
  background: var(--night2);
  background-image: radial-gradient(circle at 20% 10%, #33407a 0, transparent 40%), radial-gradient(circle at 85% 90%, #3b2f5c 0, transparent 45%);
  -webkit-tap-highlight-color: transparent;
  overflow-x: clip;
}
img.px, canvas.px { image-rendering: pixelated; image-rendering: crisp-edges; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 4px solid var(--gold); outline-offset: 3px; border-radius: 6px; }
[tabindex="-1"]:focus { outline: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3 { font-family: var(--title); font-weight: 600; line-height: 1.1; margin: 0 0 .4em; letter-spacing: .01em; }

#app { max-width: 1180px; margin: 0 auto; padding: 14px 14px 110px; min-height: 100vh; }
.screen { animation: enter .35s ease both; }
@keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- caixas e botões ---------- */
.panel { background: var(--paper); border: var(--bw) solid var(--ink); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; }
.panel.dark { background: var(--night); color: #fff; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5em;
  min-height: 54px; padding: .55em 1.1em; border: var(--bw) solid var(--ink); border-radius: var(--r);
  background: var(--paper); box-shadow: var(--shadow); font-weight: 800; font-size: 1rem; text-align: center;
  transition: transform .08s, box-shadow .08s, background .15s;
}
.btn:hover:not(:disabled) { background: #fff; }
.btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.btn.primary { background: var(--gold); }
.btn.primary:hover:not(:disabled) { background: #ffd65e; }
.btn.ghost { background: transparent; box-shadow: none; border-color: transparent; color: inherit; text-decoration: underline; min-height: 44px; }
.btn.small { min-height: 44px; padding: .3em .8em; font-size: .9rem; }
.btn.big { min-height: 66px; font-size: 1.15rem; padding: .6em 1.5em; }
.btn:disabled { opacity: .45; box-shadow: 2px 2px 0 var(--ink); }
.ico { width: 22px; height: 22px; flex: none; }
.btn img.px { width: 32px; height: 32px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.row.center { justify-content: center; }
.row.end { justify-content: flex-end; }
.grow { flex: 1; }
.muted { opacity: .75; }
.tag { display: inline-block; font-size: .78rem; font-weight: 800; padding: .1em .6em; border: 2px solid var(--ink); border-radius: 99px; background: var(--paper2); }

/* ---------- HUD ---------- */
.hud { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; color: #fff; flex-wrap: wrap; }
.hud .btn { color: var(--ink); }
.hud .lights { flex: 1; min-width: 180px; display: flex; align-items: center; gap: 10px; }
.bar { flex: 1; height: 22px; border: var(--bw) solid var(--ink); border-radius: 99px; background: #3a3f5c; overflow: hidden; position: relative; box-shadow: 0 0 0 2px #ffffff22; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: repeating-linear-gradient(90deg, var(--gold) 0 10px, #ffd65e 10px 20px); transition: width 1.2s cubic-bezier(.2, .8, .2, 1); box-shadow: 0 0 12px var(--glow); }
.hud .pct { font-family: var(--title); font-size: 1.1rem; min-width: 3.2em; }
.hud .lbl { font-weight: 800; font-size: .85rem; white-space: nowrap; }
.turn { display: inline-flex; align-items: center; gap: 8px; background: var(--paper); color: var(--ink); border: var(--bw) solid var(--ink); border-radius: 99px; padding: 4px 14px 4px 6px; font-weight: 800; box-shadow: 3px 3px 0 var(--ink); }
.turn .dot, .pdot { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--ink); display: inline-grid; place-items: center; font-size: .75rem; font-weight: 900; color: var(--ink); }
.turn.flash { animation: pop .5s ease; }
@keyframes pop { 40% { transform: scale(1.12); } }

/* ---------- TÍTULO ---------- */
.title-wrap { display: grid; gap: 18px; justify-items: center; padding-top: 2vh; }
.title-art { position: relative; width: 100%; max-width: 960px; border: var(--bw) solid var(--ink); border-radius: 14px; overflow: hidden; box-shadow: 6px 6px 0 #0008; }
.title-art img.bg { display: block; width: 100%; filter: grayscale(.85) brightness(.9); }
.title-art .fog { position: absolute; inset: 0; background: linear-gradient(180deg, #b9b6c6cc, #b9b6c633 60%, transparent); pointer-events: none; }
.title-art .nevoa { position: absolute; width: 22%; top: 6%; left: 58%; animation: drift 9s ease-in-out infinite; }
.title-art .faisca { position: absolute; width: 8%; left: 20%; top: 46%; animation: fly 5s ease-in-out infinite; filter: drop-shadow(0 0 10px #fff1a8) drop-shadow(0 0 20px #f4c542); }
@keyframes drift { 50% { transform: translateX(-30px); } }
@keyframes fly { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(30px, -18px); } 50% { transform: translate(60px, 4px); } 75% { transform: translate(20px, 14px); } }
.logo { text-align: center; color: #fff; }
.logo h1 { font-size: clamp(2.2rem, 6vw, 4.2rem); color: var(--glow); text-shadow: 4px 4px 0 var(--ink), 0 0 26px #f4c54288; margin: 0; }
.logo p { margin: .3em 0 0; font-size: 1.1rem; opacity: .9; }
.title-btns { display: grid; gap: 12px; width: min(420px, 100%); }
.title-foot { color: #fff; opacity: .7; font-size: .85rem; text-align: center; }

/* ---------- SETUP ---------- */
.setup { max-width: 980px; margin: 0 auto; }
.setup h2 { color: #fff; text-align: center; font-size: 2rem; }
.setup .sub { color: #fff; text-align: center; opacity: .85; margin: -.2em 0 1em; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
.choice-card { text-align: left; display: grid; gap: 8px; align-content: start; padding: 16px; min-height: 180px; position: relative; }
.choice-card[aria-pressed="true"] { background: var(--glow); outline: 4px solid var(--gold); outline-offset: 2px; }
.choice-card[aria-pressed="true"]::after { content: '✓'; position: absolute; top: 8px; right: 12px; font-size: 1.6rem; font-weight: 900; }
.choice-card h3 { font-size: 1.35rem; margin: 0; }
.choice-card p { margin: 0; font-weight: 500; font-size: .95rem; }
.choice-card .art { display: flex; gap: 4px; height: 64px; align-items: flex-end; }
.choice-card .art img { height: 64px; }
.steps-dots { display: flex; justify-content: center; gap: 8px; margin: 14px 0; }
.steps-dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; }
.steps-dots i.on { background: var(--gold); border-color: var(--gold); }
.players { display: grid; gap: 10px; }
.player-row { display: flex; gap: 10px; align-items: center; }
.player-row input { flex: 1; min-height: 52px; font: inherit; font-weight: 700; padding: 0 14px; border: var(--bw) solid var(--ink); border-radius: var(--r); background: #fff; }
.count-pick { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 16px; }
.count-pick .btn { width: 66px; font-size: 1.4rem; }
.count-pick .btn[aria-pressed="true"] { background: var(--gold); }

/* ---------- CENAS ---------- */
.scene { position: relative; width: 100%; aspect-ratio: 16 / 9; border: var(--bw) solid var(--ink); border-radius: var(--r); overflow: hidden; background: var(--night); box-shadow: var(--shadow); }
.scene.cap { max-width: min(100%, calc(56vh * 16 / 9)); margin-inline: auto; }
.scene > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; transition: filter 1.6s ease; }
.scene.faded > img.bg { filter: grayscale(.85) brightness(1.04) contrast(.9); }
.scene .fogl { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 20% 0%, #d8d4e2aa, transparent 55%), radial-gradient(ellipse at 90% 10%, #d8d4e299, transparent 50%); transition: opacity 1.6s; }
.scene:not(.faded) .fogl { opacity: 0; }
.hot { position: absolute; border: 0; background: transparent; padding: 0; border-radius: 8px; }
.hot::after { content: ''; position: absolute; inset: -4px; border-radius: 10px; border: 3px dashed transparent; transition: border-color .15s; }
.hot:hover::after, .hot:focus-visible::after { border-color: #fff; box-shadow: 0 0 0 2px var(--ink); }
.hot.checked::after { border: 3px solid #fff8; }
.hot.found::after { border: 4px solid var(--gold); box-shadow: 0 0 0 2px var(--ink), 0 0 16px var(--glow); }
.hot .colorize { position: absolute; left: 9.09%; top: 9.09%; width: 81.82%; height: 81.82%; animation: colorin .8s ease both; }
@keyframes colorin { from { filter: grayscale(1); opacity: .3; } }
html.easy .hot::after { border-color: #ffffff55; }
.hot .badge { position: absolute; top: -12px; right: -12px; width: 30px; height: 30px; border-radius: 50%; background: var(--gold); border: 3px solid var(--ink); display: grid; place-items: center; font-weight: 900; font-size: .9rem; z-index: 2; }
.hint-pulse { animation: hint 1.1s ease-in-out infinite; }
.hint-pulse::after { border: 4px solid var(--gold) !important; box-shadow: 0 0 0 3px var(--ink), 0 0 24px var(--glow) !important; }
@keyframes hint { 50% { transform: scale(1.1); } }
.sparkle { position: absolute; width: 8px; height: 8px; background: var(--glow); box-shadow: 0 0 8px var(--gold); pointer-events: none; animation: spark .8s ease-out forwards; }
@keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }

/* ---------- MISSÃO ---------- */
.mhead { display: flex; align-items: center; gap: 12px; color: #fff; margin-bottom: 12px; flex-wrap: wrap; }
.mhead .where { font-size: .82rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; opacity: .85; }
.mhead h2 { margin: 0; font-size: 1.6rem; color: var(--glow); text-shadow: 3px 3px 0 var(--ink); }
.dots { display: flex; gap: 6px; margin-left: auto; }
.dots i { width: 16px; height: 16px; border: 3px solid var(--ink); background: #3a3f5c; border-radius: 4px; transform: rotate(45deg); }
.dots i.done { background: var(--gold); }
.dots i.now { background: #fff; box-shadow: 0 0 10px var(--glow); }
.stage { display: grid; gap: 14px; }
.two { display: grid; grid-template-columns: 1.6fr 1fr; gap: 14px; align-items: start; }
.prompt { display: flex; gap: 12px; align-items: center; background: var(--paper); border: var(--bw) solid var(--ink); border-radius: var(--r); padding: 10px 14px; box-shadow: var(--shadow); }
.prompt img.px { width: 48px; height: 48px; flex: none; animation: bob 2.4s ease-in-out infinite; }
.prompt p { margin: 0; font-weight: 800; font-size: 1.08rem; flex: 1; min-width: 0; overflow-wrap: anywhere; }
@keyframes bob { 50% { transform: translateY(-4px); } }
.ibtn { width: 48px; height: 48px; flex: none; border: var(--bw) solid var(--ink); border-radius: 50%; background: var(--paper2); display: grid; place-items: center; box-shadow: 2px 2px 0 var(--ink); }
.ibtn svg { width: 24px; height: 24px; }
.ibtn:active { transform: translate(2px, 2px); box-shadow: none; }

.bubble { display: flex; gap: 14px; align-items: flex-start; }
.bubble .who { flex: none; width: 92px; text-align: center; }
.bubble .who .face { width: 92px; height: 92px; border: var(--bw) solid var(--ink); border-radius: var(--r); background: var(--paper2); display: grid; place-items: center; overflow: hidden; }
.bubble .who .face img { width: 64px; }
.bubble .who b { display: block; font-size: .85rem; margin-top: 4px; color: #fff; }
.bubble .text { flex: 1; position: relative; background: #fff; border: var(--bw) solid var(--ink); border-radius: 14px; padding: 14px 18px; box-shadow: var(--shadow); font-size: 1.15rem; font-weight: 700; min-height: 92px; }
.bubble .text::before { content: ''; position: absolute; left: -14px; top: 26px; border: 10px solid transparent; border-right: 12px solid var(--ink); }
.bubble .text p { margin: 0 0 .6em; animation: enter .3s ease both; }

.feedback { border: var(--bw) solid var(--ink); border-radius: var(--r); padding: 12px 16px; font-weight: 700; box-shadow: var(--shadow); display: flex; gap: 12px; align-items: center; animation: enter .25s ease both; }
.feedback img.px { width: 40px; flex: none; }
.feedback.ok { background: var(--okbg); }
.feedback.soft { background: var(--softbg); }
.feedback.info { background: #fff; }
.feedback b.kind { display: block; font-family: var(--title); font-size: 1.1rem; }

/* caderno de pistas */
.notebook { background: #fffdf6; background-image: repeating-linear-gradient(transparent 0 31px, #cfe0f0 31px 32px); border: var(--bw) solid var(--ink); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow); }
.notebook h3 { font-size: 1.2rem; }
.notebook ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.notebook li { display: flex; gap: 8px; align-items: center; font-weight: 700; min-height: 40px; }
.notebook li img.px { width: 36px; }
.notebook li.empty { opacity: .45; }
.notebook li.empty span { border-bottom: 2px dashed var(--ink2); width: 60%; height: 1em; }

/* associação */
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.match .col { display: grid; gap: 10px; align-content: start; }
.match .col > b { color: #fff; font-family: var(--title); font-size: 1.1rem; }
.mcard { display: flex; align-items: center; gap: 10px; text-align: left; padding: 8px 12px; min-height: 64px; background: var(--paper); border: var(--bw) solid var(--ink); border-radius: var(--r); box-shadow: 3px 3px 0 var(--ink); font-weight: 700; transition: transform .1s, background .15s; }
.mcard img.px { width: 44px; height: 44px; flex: none; }
.mcard[aria-pressed="true"] { background: var(--glow); transform: translateX(6px); outline: 3px solid var(--gold); }
.mcard.done { background: var(--okbg); opacity: .9; }
.mcard.done .num { background: var(--ok); color: #fff; }
.mcard .num { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--ink); display: grid; place-items: center; font-weight: 900; font-size: .85rem; background: #fff; }
.mcard.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

/* sequência */
.slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.slot { min-height: 150px; border: var(--bw) dashed #ffffff88; border-radius: var(--r); display: grid; place-items: center; position: relative; color: #fff; background: #ffffff10; padding: 0; }
.slot > .n { position: absolute; top: 6px; left: 8px; font-family: var(--title); font-size: 1.4rem; color: var(--glow); text-shadow: 2px 2px 0 var(--ink); z-index: 2; }
.slot.filled { border-style: solid; border-color: var(--ink); background: transparent; }
.slot .scard { width: 100%; height: 100%; }
.slot.right .scard { background: var(--okbg); }
.slot.right::after { content: '✓'; position: absolute; top: 4px; right: 10px; font-weight: 900; font-size: 1.4rem; color: var(--ok); }
.pool { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; min-height: 80px; }
.scard { display: grid; justify-items: center; gap: 6px; padding: 26px 8px 10px; width: 150px; min-height: 140px; background: var(--paper); border: var(--bw) solid var(--ink); border-radius: var(--r); box-shadow: 3px 3px 0 var(--ink); font-weight: 800; font-size: .92rem; line-height: 1.2; text-align: center; }
.pool .scard { padding-top: 10px; }
.scard img.px { width: 56px; height: 56px; }

/* separação */
.sortbox { display: grid; gap: 14px; justify-items: center; }
.sort-item { display: grid; justify-items: center; gap: 6px; background: var(--paper); border: var(--bw) solid var(--ink); border-radius: 16px; padding: 16px 28px; box-shadow: var(--shadow); min-width: 240px; animation: drop .4s ease both; }
.sort-item img.px { width: 112px; height: 112px; }
.sort-item b { font-size: 1.25rem; }
.sort-item .count { font-size: .85rem; font-weight: 800; opacity: .7; }
@keyframes drop { from { transform: translateY(-30px) scale(.9); opacity: 0; } }
.bins { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; width: 100%; }
.bin { display: grid; justify-items: center; gap: 4px; padding: 12px 8px; min-height: 120px; background: var(--paper); border: var(--bw) solid var(--ink); border-radius: var(--r); box-shadow: 3px 3px 0 var(--ink); font-weight: 900; position: relative; overflow: hidden; }
.bin::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 14px; background: var(--binc, var(--paper3)); border-bottom: 3px solid var(--ink); }
.bin img.px { width: 52px; height: 52px; margin-top: 10px; }
.bin .cnt { font-size: .8rem; font-weight: 800; opacity: .7; }

/* rota */
.route-wrap { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: start; }
.grid { display: grid; gap: 4px; background: #5d6573; padding: 8px; border: var(--bw) solid var(--ink); border-radius: var(--r); box-shadow: var(--shadow); width: fit-content; max-width: 100%; }
.cell { width: min(72px, max(30px, calc((100vw - 64px) / var(--gw, 7)))); aspect-ratio: 1; border: 2px solid #4b5160; background: #7b8392; border-radius: 6px; position: relative; padding: 0; display: grid; place-items: center; }
.cell::before { content: ''; position: absolute; left: 50%; top: 50%; width: 30%; height: 4px; background: #fff6; transform: translate(-50%, -50%); }
.cell.trail { background: #9aa3ad; }
.cell.trail::after { content: ''; position: absolute; width: 22%; height: 22%; border-radius: 50%; background: var(--gold); border: 2px solid var(--ink); }
.cell.block { background: #3f4552; }
.cell.block::before { display: none; }
.cell.start { background: #c8a27a; }
.cell img.px { width: 82%; height: 82%; position: relative; z-index: 1; }
.cell.drop.done { background: var(--okbg); }
.cell.drop.done::after { content: '✓'; position: absolute; top: -4px; right: 0; font-weight: 900; color: var(--ok); font-size: 1.2rem; z-index: 2; background: none; border: 0; width: auto; height: auto; }
.cell.here { outline: 4px solid var(--gold); z-index: 3; }
.cell.near { box-shadow: inset 0 0 0 3px #fff; }
.cell .bikeimg { position: absolute; inset: 6%; width: 88%; height: 88%; z-index: 2; filter: drop-shadow(0 0 6px var(--glow)); }
.route-side { display: grid; gap: 10px; }
.drop-list { display: grid; gap: 8px; }
.drop-list div { display: flex; gap: 8px; align-items: center; font-weight: 800; background: var(--paper); border: var(--bw) solid var(--ink); border-radius: var(--r); padding: 6px 10px; }
.drop-list div.done { background: var(--okbg); text-decoration: line-through; }
.drop-list img.px { width: 34px; }
.arrows { display: grid; grid-template-columns: repeat(3, 56px); gap: 6px; justify-content: start; }
.arrows .btn { min-height: 52px; padding: 0; }

/* quem sou eu */
.who-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 16px; align-items: start; }
.clues { display: grid; gap: 10px; }
.clue { background: #fff; border: var(--bw) solid var(--ink); border-radius: var(--r); padding: 12px 14px; font-weight: 800; box-shadow: 3px 3px 0 var(--ink); display: flex; gap: 10px; align-items: flex-start; animation: enter .3s ease both; }
.clue .n { flex: none; width: 32px; height: 32px; border-radius: 6px; background: var(--gold); border: 3px solid var(--ink); display: grid; place-items: center; font-family: var(--title); }
.clue.locked { background: #ffffff22; color: #fff; border-style: dashed; border-color: #ffffff88; box-shadow: none; font-weight: 700; }
.sils { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.sil { display: grid; justify-items: center; gap: 4px; padding: 10px 6px; background: linear-gradient(#cfc9e0, #a9a3c0); border: var(--bw) solid var(--ink); border-radius: var(--r); box-shadow: 3px 3px 0 var(--ink); font-weight: 900; }
.sil img.px { width: 72px; height: 108px; }
.sil.out { opacity: .35; filter: grayscale(1); }
.sil.out::after { content: 'Não é'; font-size: .8rem; }
.pass { text-align: center; display: grid; gap: 14px; justify-items: center; padding: 28px; }
.pass .bigt { font-family: var(--title); font-size: 2rem; }
.secret { font-size: 1.5rem; font-weight: 900; background: #fff; border: var(--bw) solid var(--ink); border-radius: var(--r); padding: 22px; max-width: 640px; box-shadow: var(--shadow); }

/* revelação / ficha */
.reveal { display: grid; grid-template-columns: 300px 1fr; gap: 18px; align-items: start; }
.cardbig { perspective: 900px; }
.cardbig .inner { color: var(--ink); position: relative; background: linear-gradient(180deg, var(--rc, #e0705a) 0 248px, var(--paper) 248px); border: var(--bw) solid var(--ink); border-radius: 16px; box-shadow: 6px 6px 0 var(--ink); padding: 16px; text-align: center; animation: flip .9s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes flip { 0% { transform: rotateY(90deg) scale(.8); filter: grayscale(1); } 60% { filter: grayscale(.5); } 100% { transform: none; filter: none; } }
.cardbig .portrait { position: relative; display: grid; place-items: center; height: 230px; }
.cardbig .portrait img.char { width: 128px; height: 192px; position: relative; z-index: 1; }
.cardbig .portrait img.prop { position: absolute; width: 64px; right: 18px; bottom: 10px; z-index: 2; }
.cardbig .portrait::before { content: ''; position: absolute; width: 190px; height: 190px; border-radius: 50%; background: radial-gradient(#fff9, transparent 70%); }
.cardbig h3 { font-size: 1.7rem; margin: 6px 0 2px; }
.cardbig .job { font-weight: 800; }
.cardbig .quote { font-style: italic; font-weight: 700; margin-top: 10px; font-size: .95rem; }
.facts { display: grid; gap: 10px; }
.fact { background: var(--paper); border: var(--bw) solid var(--ink); border-radius: var(--r); padding: 12px 14px; box-shadow: 3px 3px 0 var(--ink); }
.fact h4 { margin: 0 0 4px; font-family: var(--title); font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
.fact h4 img.px { width: 26px; }
.fact p, .fact ul { margin: 0; font-weight: 600; }
.fact ul { padding-left: 1.2em; }
.fact.curio { background: var(--glow); }

/* escolha */
.options { display: grid; gap: 12px; }
.opt { display: flex; gap: 12px; align-items: center; text-align: left; padding: 12px 16px; min-height: 68px; background: var(--paper); border: var(--bw) solid var(--ink); border-radius: var(--r); box-shadow: 3px 3px 0 var(--ink); font-weight: 800; font-size: 1.05rem; }
.opt .l { flex: none; width: 40px; height: 40px; border-radius: 8px; background: var(--paper3); border: 3px solid var(--ink); display: grid; place-items: center; font-family: var(--title); font-size: 1.2rem; }
.opt.chosen { background: var(--glow); }
.opt.tried { opacity: .7; }

/* reflexão */
.reflect { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.rcard { background: var(--paper); border: var(--bw) solid var(--ink); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); display: grid; gap: 10px; align-content: start; }
.rcard h3 { font-size: 1.25rem; display: flex; gap: 8px; align-items: center; }
.rcard h3 img.px { width: 34px; }
.rcard p { margin: 0; font-weight: 700; }
.rcard.q { background: #e6f1ff; }
.rcard.c { background: var(--glow); }

/* ---------- MAPA ---------- */
.mapwrap { position: relative; width: 100%; aspect-ratio: 200 / 120; border: var(--bw) solid var(--ink); border-radius: 14px; overflow: hidden; box-shadow: 6px 6px 0 #0008; background: #5f6b4f; }
.mapwrap > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; }
.marker { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 2px; border: 0; background: none; padding: 0; z-index: 3; }
.marker .pin { min-width: 150px; max-width: 30vw; padding: 6px 12px; background: var(--paper); border: var(--bw) solid var(--ink); border-radius: 12px; box-shadow: 3px 3px 0 var(--ink); font-weight: 900; font-size: .9rem; line-height: 1.15; text-align: center; }
.marker .st { font-size: .72rem; font-weight: 800; display: block; opacity: .85; margin-top: 2px; }
.marker.open .pin { background: var(--glow); animation: glowp 1.6s ease-in-out infinite; }
.marker.done .pin { background: var(--okbg); }
.marker.locked .pin { background: #d8d4e2; color: #4b4760; }
@keyframes glowp { 50% { box-shadow: 3px 3px 0 var(--ink), 0 0 22px var(--gold); } }
.map-faisca { position: absolute; width: 6%; z-index: 4; transform: translate(-50%, -120%); filter: drop-shadow(0 0 8px #fff1a8) drop-shadow(0 0 16px #f4c542); animation: bob 1.6s ease-in-out infinite; pointer-events: none; transition: left 1s, top 1s; }
.map-nevoa { position: absolute; width: 16%; z-index: 2; opacity: .9; animation: drift 10s ease-in-out infinite; pointer-events: none; }
.map-foot { display: flex; gap: 12px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
.map-foot .say { flex: 1; min-width: 260px; }

/* região */
.region-intro { display: grid; grid-template-columns: 1.5fr 1fr; gap: 16px; align-items: start; }
.mission-list { display: grid; gap: 12px; }
.mitem { display: flex; gap: 12px; align-items: center; text-align: left; padding: 10px 14px; background: var(--paper); border: var(--bw) solid var(--ink); border-radius: var(--r); box-shadow: 3px 3px 0 var(--ink); min-height: 84px; }
.mitem img.px { width: 44px; height: 66px; flex: none; }
.mitem b { display: block; font-size: 1.08rem; }
.mitem small { font-weight: 700; opacity: .75; }
.mitem.done { background: var(--okbg); }

/* recompensa */
.reward { display: grid; gap: 16px; justify-items: center; text-align: center; color: #fff; }
.reward h2 { font-size: 2.2rem; color: var(--glow); text-shadow: 3px 3px 0 var(--ink); margin: 0; }
.windows { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; padding: 18px; background: #3a3f66; border: var(--bw) solid var(--ink); border-radius: 12px; box-shadow: var(--shadow); }
.win { width: 44px; height: 54px; border: 3px solid var(--ink); background: #1b2142; position: relative; }
.win::before, .win::after { content: ''; position: absolute; background: var(--ink); }
.win::before { left: 50%; top: 0; bottom: 0; width: 3px; transform: translateX(-50%); }
.win::after { top: 50%; left: 0; right: 0; height: 3px; transform: translateY(-50%); }
.win.on { background: var(--glow); box-shadow: 0 0 18px var(--gold); animation: lighton .5s ease both; animation-delay: var(--d, 0s); }
@keyframes lighton { from { background: #1b2142; box-shadow: none; } }
.medal-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.medal { display: grid; justify-items: center; gap: 4px; width: 128px; padding: 10px; background: var(--paper); color: var(--ink); border: var(--bw) solid var(--ink); border-radius: 12px; box-shadow: 3px 3px 0 var(--ink); font-weight: 800; font-size: .85rem; }
.medal .disc { width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--ink); background: #d6d1c4; display: grid; place-items: center; }
.medal.on .disc { background: radial-gradient(circle at 35% 30%, #fff6c4, var(--gold) 60%, var(--gold2)); box-shadow: 0 0 14px var(--gold); }
.medal .disc img.px { width: 38px; }
.medal:not(.on) .disc img.px { filter: grayscale(1); opacity: .5; }
.medal .meter { width: 100%; height: 10px; border: 2px solid var(--ink); border-radius: 99px; overflow: hidden; background: #fff; }
.medal .meter i { display: block; height: 100%; background: var(--gold); }

/* álbum */
.album { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
.acard { display: grid; justify-items: center; gap: 4px; padding: 12px 8px; background: linear-gradient(180deg, var(--rc, #ccc) 0 55%, var(--paper) 55%); border: var(--bw) solid var(--ink); border-radius: 14px; box-shadow: 4px 4px 0 var(--ink); text-align: center; min-height: 220px; }
.acard img.px { width: 80px; height: 120px; }
.acard b { font-size: 1.05rem; }
.acard small { font-weight: 700; }
.acard.locked { background: #4b4760; color: #d8d4e2; box-shadow: 4px 4px 0 #0006; }
.acard.special { --rc: #f4c542; }

/* modal */
.modal-bg { position: fixed; inset: 0; background: #1b2142cc; display: grid; place-items: center; z-index: 50; padding: 14px; animation: fadein .2s ease; }
@keyframes fadein { from { opacity: 0; } }
.modal { width: min(760px, 100%); max-height: 92vh; overflow: auto; position: relative; }
.modal .x { position: absolute; top: 10px; right: 10px; }
.set-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 2px dashed var(--paper3); flex-wrap: wrap; }
.set-row label { flex: 1; font-weight: 800; min-width: 180px; }
.set-row input[type=range] { width: 200px; accent-color: var(--gold2); height: 30px; }
.switch { position: relative; width: 66px; height: 36px; border: var(--bw) solid var(--ink); border-radius: 99px; background: #cfc9bd; padding: 0; flex: none; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 3px solid var(--ink); transition: left .15s; }
.switch[aria-checked="true"] { background: var(--gold); }
.switch[aria-checked="true"]::after { left: 33px; }
select.sel { min-height: 46px; font: inherit; font-weight: 700; border: var(--bw) solid var(--ink); border-radius: var(--r); padding: 0 10px; background: #fff; }

/* toast */
#toasts { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 60; display: grid; gap: 8px; pointer-events: none; width: min(560px, 92vw); }
.toast { background: var(--paper); border: var(--bw) solid var(--ink); border-radius: 12px; box-shadow: var(--shadow); padding: 10px 16px; font-weight: 800; display: flex; gap: 10px; align-items: center; animation: toast 3.4s ease both; }
.toast img.px { width: 36px; }
@keyframes toast { 0% { transform: translateY(-20px); opacity: 0; } 8%, 85% { transform: none; opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }

/* barra inferior (controles) */
.footbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: #1b2142ee; border-top: var(--bw) solid var(--ink); padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); }
.footbar .in { max-width: 1180px; margin: 0 auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.footbar .teacher { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.footbar .teacher > span { color: var(--glow); font-weight: 900; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; }
.pause { position: fixed; inset: 0; z-index: 45; background: #1b2142f2; color: #fff; display: grid; place-items: center; text-align: center; }
.pause h2 { font-size: 3rem; color: var(--glow); }

/* final */
.thanks-wall { position: relative; min-height: 200px; display: flex; flex-wrap: wrap; gap: 10px; padding: 14px; background: #ffffff14; border: var(--bw) dashed #ffffff66; border-radius: 14px; }
.note { background: var(--glow); border: 3px solid var(--ink); border-radius: 8px; padding: 8px 12px; font-weight: 800; box-shadow: 3px 3px 0 var(--ink); animation: drop .5s ease both; transform: rotate(var(--rot, -2deg)); max-width: 280px; }
.note small { display: block; font-size: .78rem; opacity: .8; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 8px 14px; min-height: 46px; background: var(--paper); border: var(--bw) solid var(--ink); border-radius: 99px; font-weight: 800; box-shadow: 2px 2px 0 var(--ink); }
.chip[aria-pressed="true"] { background: var(--gold); }
.txt { width: 100%; min-height: 52px; font: inherit; font-weight: 700; padding: 10px 14px; border: var(--bw) solid var(--ink); border-radius: var(--r); background: #fff; }
.nevoa-big { width: 260px; transition: transform 1s ease, filter 1s; filter: drop-shadow(0 6px 0 #0004); }
.cert { background: #fffdf6; border: 6px double var(--ink); border-radius: 16px; padding: 24px; text-align: center; box-shadow: 6px 6px 0 #0008; }
.cert h2 { font-size: 2rem; }
.cert .names { font-family: var(--title); font-size: 1.5rem; color: var(--accent); }
.confetti { position: fixed; top: -10px; width: 10px; height: 10px; z-index: 70; pointer-events: none; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(105vh) rotate(720deg); } }

/* ---------- acessibilidade ---------- */
html.hc { --paper: #ffffff; --paper2: #f2f2f2; --paper3: #d0d0d0; --ink: #000; --okbg: #c9f2bf; --softbg: #ffd9c7; }
html.hc body { background: #000; }
html.hc .scene.faded > img.bg { filter: grayscale(.6); }
html.hc .clue.locked, html.hc .slot { color: #fff; border-color: #fff; }
html.rm *, html.rm *::before, html.rm *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
@media (prefers-reduced-motion: reduce) { .title-art .faisca, .title-art .nevoa, .map-nevoa { animation: none; } }

/* ---------- responsivo ---------- */
@media (max-width: 860px) {
  .two, .who-grid, .reveal, .region-intro, .route-wrap { grid-template-columns: 1fr; }
  .reflect { grid-template-columns: 1fr; }
  .reveal .cardbig { max-width: 320px; margin: 0 auto; }
  .marker .pin { min-width: 0; font-size: .72rem; padding: 4px 6px; }
  .marker .st { display: none; }
  .mhead h2 { font-size: 1.25rem; }
}
@media (max-width: 560px) {
  html { --fs: 16px; }
  #app { padding: 10px 8px 130px; }
  .match { grid-template-columns: 1fr; }
  .bubble .who { width: 64px; } .bubble .who .face { width: 64px; height: 64px; } .bubble .who .face img { width: 44px; }
  .bubble .text { font-size: 1rem; }
  .scard { width: 130px; }
  .slots { grid-template-columns: repeat(2, 1fr); }
  .hud .lbl { display: none; }
  .footbar .btn { min-height: 48px; padding: .3em .7em; }
  .footbar .lbl { display: none; }
  .footbar .in { flex-wrap: nowrap; gap: 6px; }
  .footbar .btn.big { min-height: 52px; font-size: 1rem; padding: .3em .9em; }
  .footbar .teacher { flex-wrap: nowrap; }
  .footbar .teacher > span { display: none; }
}

/* ===== v2: avatar, estrelas, memória, lógica, celular ===== */
.scene .avatar { position: absolute; z-index: 3; height: auto; transition-property: left, top; transition-timing-function: linear; pointer-events: none; filter: drop-shadow(0 2px 0 #0005); }
.flip { transform: scaleX(-1); }
.av-tip { display: none; position: absolute; z-index: 4; transform: translate(-50%, -100%); background: var(--ink); color: #fff; font-weight: 800; font-size: .72rem; padding: 2px 8px; border-radius: 6px; pointer-events: none; white-space: nowrap; }
.hot.near::after { border: 3px solid #fff !important; box-shadow: 0 0 0 2px var(--ink); }
.walk-help { color: #fff; font-weight: 700; font-size: .85rem; margin: 8px 0 0; opacity: .85; }
.turn .dot { overflow: hidden; background: #fff; }
.turn .dot img { width: 16px; height: 24px; margin-top: 6px; }
.stars { display: inline-flex; gap: 2px; letter-spacing: 0; }
.stars i { font-style: normal; color: #b9b6c6; text-shadow: 1px 1px 0 var(--ink); }
.stars i.on { color: var(--gold); }
.star-big .stars { font-size: 3rem; gap: 10px; }
.star-big .stars i.on { animation: pop .6s ease both; }
.star-big .stars i:nth-child(2) { animation-delay: .25s; } .star-big .stars i:nth-child(3) { animation-delay: .5s; }
.urg { background: var(--soft); color: #fff; font-size: .7rem; padding: 1px 6px; border-radius: 4px; }
.code { font-family: var(--title); font-size: 1.6rem; letter-spacing: .15em; background: var(--glow); color: var(--ink); border: 3px solid var(--ink); border-radius: 8px; padding: 0 10px; }
.code.big { font-size: 3.2rem; padding: 6px 22px; box-shadow: var(--shadow); }
.code-in { font-family: var(--title); font-size: 2rem; letter-spacing: .3em; text-align: center; }
.mitem.bonus { background: #e6f1ff; }
.mitem .rdot { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--ink); flex: none; }
.mitem small .stars { font-size: 1rem; }
.map-avatar { position: absolute; z-index: 5; width: 4%; transform: translate(-50%, -100%); transition: left .75s linear, top .75s linear; filter: drop-shadow(0 2px 0 #0006); pointer-events: none; }
.map-avatar.flip { transform: translate(-50%, -100%) scaleX(-1); }
.map-list { display: none; gap: 10px; margin-top: 12px; }

/* memória */
.memo { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 10px; max-width: 860px; margin: 0 auto; width: 100%; }
.mem { position: relative; aspect-ratio: 3 / 4; border: var(--bw) solid var(--ink); border-radius: var(--r); background: var(--night); box-shadow: 3px 3px 0 var(--ink); padding: 0; overflow: hidden; transition: transform .25s; }
.mem .back, .mem .front { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 4px; transition: opacity .2s; }
.mem .back { background: repeating-linear-gradient(45deg, #3a3f66 0 8px, #33385c 8px 16px); }
.mem .back img { width: 40%; opacity: .9; }
.mem .front { background: var(--paper); opacity: 0; }
.mem .front img { width: 50%; max-height: 62%; object-fit: contain; }
.mem .front small { font-weight: 800; font-size: .75rem; line-height: 1.1; padding: 0 4px; }
.mem.up .front { opacity: 1; } .mem.up .back { opacity: 0; }
.mem.up { transform: rotateY(0) scale(1.02); }
.mem.done .front { background: var(--okbg); }
.mem.done { box-shadow: 0 0 0 3px var(--ok), 3px 3px 0 var(--ink); }

/* lógica */
.logic { display: grid; grid-template-columns: minmax(90px, auto) repeat(var(--cols), minmax(56px, 1fr)); gap: 6px; background: var(--paper); border: var(--bw) solid var(--ink); border-radius: var(--r); padding: 10px; box-shadow: var(--shadow); }
.logic .lh { font-size: .8rem; text-align: center; align-self: end; line-height: 1.15; }
.logic .lr { align-self: center; font-size: .95rem; }
.lc { min-height: 52px; border: 3px solid var(--ink); border-radius: 8px; background: #fff; font-size: 1.5rem; font-weight: 900; }
.lc.yes { background: var(--okbg); color: var(--ok); }
.lc.no { background: #f1e6e3; color: var(--soft); }

/* criador de personagem */
.av-maker { display: grid; grid-template-columns: 200px 1fr; gap: 18px; align-items: start; }
.av-preview { display: grid; gap: 10px; justify-items: center; background: linear-gradient(#a8dcf2, #a8dcf2 70%, #c9a46a 70%); border: var(--bw) solid var(--ink); border-radius: var(--r); padding: 14px; }
.av-preview img { width: 128px; height: 192px; }
.av-form { display: grid; gap: 10px; }
.av-row b { display: block; margin-bottom: 4px; }
.av-opts { display: flex; flex-wrap: wrap; gap: 6px; }
.av-opt { border: 3px solid var(--ink); border-radius: 8px; background: #fff; min-width: 44px; min-height: 44px; padding: 2px 8px; font-weight: 800; }
.av-opt[aria-pressed="true"] { outline: 4px solid var(--gold); outline-offset: 1px; background: var(--glow); }
.av-opt.pic { padding: 2px; width: 46px; height: 58px; }
.av-opt.pic img { width: 32px; height: 48px; }
.av-opt.sw { width: 44px; }

@media (max-width: 860px) {
  .map-list { display: grid; }
  .marker .pin { font-size: .62rem; padding: 3px 5px; border-width: 2px; box-shadow: 2px 2px 0 var(--ink); }
  .map-foot .say .bubble .who { display: none; }
  .av-maker { grid-template-columns: 1fr; }
  .av-preview img { width: 96px; height: 144px; }
  .logic { grid-template-columns: minmax(70px, auto) repeat(var(--cols), minmax(44px, 1fr)); padding: 6px; gap: 4px; }
  .logic .lh { font-size: .66rem; }
  .code.big { font-size: 2.4rem; }
}
@media (max-width: 560px) {
  .hud { gap: 6px; }
  .hud .btn.small { min-height: 42px; padding: 0 10px; }
  .hud .lights { order: 5; flex-basis: 100%; }
  .hud .turn { order: 6; }
  .mem .front small { font-size: .62rem; }
  .memo { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .walk-help { display: none; }
  .two[style] { grid-template-columns: 1fr !important; }
}

.star-why { font-weight: 700; margin: 0; max-width: 640px; }
.star-why .stars { font-size: 1.2rem; vertical-align: -2px; }

/* direcional */
.dpad { display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(3, 50px); gap: 5px; justify-content: center; margin: 10px auto 0; user-select: none; -webkit-user-select: none; touch-action: none; }
.dp { border: var(--bw) solid var(--ink); border-radius: 10px; background: var(--paper); box-shadow: 2px 2px 0 var(--ink); font-size: 1.2rem; font-weight: 900; padding: 0; touch-action: none; }
.dp:active { transform: translate(2px, 2px); box-shadow: none; background: var(--glow); }
.dp.up { grid-column: 2; grid-row: 1; } .dp.left { grid-column: 1; grid-row: 2; } .dp.right { grid-column: 3; grid-row: 2; } .dp.down { grid-column: 2; grid-row: 3; }
.dp.act { grid-column: 2; grid-row: 2; background: var(--gold); font-size: .72rem; line-height: 1; }
.dp.act:disabled { background: #d8d4e2; opacity: .7; }
.map-ctrl { display: flex; gap: 16px; align-items: center; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
.map-ctrl .dpad { margin: 0; }
.near-msg { color: #fff; font-weight: 800; max-width: 340px; margin: 0; }
@media (min-width: 861px) { .two .dpad { grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 42px); } }
@media (max-width: 860px) { .map-avatar { width: 7%; } }
.dp.act { font-size: .8rem; }

/* ===== v4: cinema e passagem dos dias ===== */
.scene .layer { position: absolute; inset: 0; pointer-events: none; }
.scene .sprite { position: absolute; height: auto; transition-property: left, top, opacity, transform, width; transition-timing-function: ease-in-out; filter: drop-shadow(0 2px 0 #0004); }
.scene .sprite.flip { transform: scaleX(-1); }
.scene .sprite.glow { filter: drop-shadow(0 0 8px #fff1a8) drop-shadow(0 0 18px #f4c542); animation: bob 1.8s ease-in-out infinite; }
.scene .tint { position: absolute; inset: 0; background: #0b0f26; opacity: 0; transition: opacity 1.2s ease; pointer-events: none; mix-blend-mode: multiply; }
.scene.cut .tint { mix-blend-mode: normal; }
.scene.cut .fogl { opacity: 0; transition: opacity 1.4s; }
.scene.cut > img.bg { transition: filter 1.6s ease; }
.scene .night { position: absolute; inset: 0; background: #0b0f26; opacity: 0; pointer-events: none; }
.scene .night.go { animation: nightpass .8s ease; }
@keyframes nightpass { 40%, 60% { opacity: .85; } }
.daycount { position: absolute; left: 3%; top: 5%; background: var(--paper); border: var(--bw) solid var(--ink); border-radius: 10px; padding: 2px 12px; font-family: var(--title); font-size: clamp(1rem, 3.5vw, 1.8rem); box-shadow: 3px 3px 0 var(--ink); }
.daycount.pop { animation: pop .5s ease; }
.meter { display: flex; gap: 10px; align-items: center; color: #fff; font-weight: 900; margin-top: 10px; }
.meter .bar i { background: repeating-linear-gradient(90deg, #c0607f 0 10px, #d9534f 10px 20px); box-shadow: none; }
.cons { background: var(--paper); border: var(--bw) solid var(--ink); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow); }
.cons ul { margin: 0; padding-left: 1.1em; display: grid; gap: 8px; font-weight: 700; }
.cons li { animation: enter .4s ease both; }
.popin { animation: popin .45s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes popin { from { transform: scale(0) translateY(10px); opacity: 0; } }
.buzz { animation: popin .45s ease both, buzz 1.2s ease-in-out .5s infinite; }
@keyframes buzz { 25% { transform: translate(3px, -2px); } 50% { transform: translate(-2px, 2px); } 75% { transform: translate(2px, 1px); } }
.poof { transition: opacity .35s, transform .35s !important; opacity: 0 !important; transform: scale(.3) translateY(-10px) !important; }

.fact.big1 p { font-size: 1.1rem; font-weight: 800; }
.routine { margin: 0; padding-left: 1.4em; display: grid; gap: 4px; font-weight: 700; }
.routine li::marker { font-family: var(--title); color: var(--accent); }
.scene.shift { cursor: pointer; }
.scene.shift .sprite { transition: none; }
.scene.shift .sprite.poof { transition: opacity .35s, transform .35s !important; }
.smsg { position: absolute; left: 50%; bottom: 4%; transform: translate(-50%, 10px); max-width: 86%; background: var(--paper); border: 3px solid var(--ink); border-radius: 10px; padding: 4px 10px; font-weight: 800; font-size: .85rem; box-shadow: 3px 3px 0 var(--ink); opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; text-align: center; }
.smsg.on { opacity: 1; transform: translate(-50%, 0); }
.smsg.soft { background: var(--softbg); } .smsg.ok { background: var(--okbg); }

/* ===== v6: vida na cidade ===== */
.amb-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.amb { position: absolute; left: -12%; }
.amb img { display: block; width: 100%; height: auto; }
.amb .f2 { position: absolute; inset: 0; opacity: 0; animation: frame2 .32s steps(1) infinite; }
.amb .f1 { animation: frame1 .32s steps(1) infinite; }
@keyframes frame1 { 50% { opacity: 0; } }
@keyframes frame2 { 50% { opacity: 1; } }
.amb.patrol { animation: patrol var(--dur) linear infinite; animation-delay: var(--del); }
@keyframes patrol { 0% { left: -12%; transform: none; } 48% { left: 104%; transform: none; } 50% { left: 104%; transform: scaleX(-1); } 98% { left: -12%; transform: scaleX(-1); } 100% { left: -12%; transform: none; } }
.amb.cross { animation: cross var(--dur) linear infinite; animation-delay: var(--del); }
.amb.cross.back { animation-name: crossback; transform: scaleX(-1); }
@keyframes cross { from { left: -14%; } to { left: 110%; } }

/* ===== cores fluidas: fundo vivo que esquenta conforme a cidade acende ===== */
body::before { content: ''; position: fixed; inset: -20%; z-index: -1; pointer-events: none;
  background:
    radial-gradient(40% 35% at 20% 15%, hsl(calc(230 - var(--lit, 0) * 40) 60% 38% / .9), transparent 70%),
    radial-gradient(35% 40% at 85% 85%, hsl(calc(275 - var(--lit, 0) * 60) 45% 36% / .85), transparent 70%),
    radial-gradient(30% 30% at 70% 20%, hsl(calc(185 + var(--lit, 0) * 0) 55% 34% / calc(.35 + var(--lit, 0) * .3)), transparent 70%),
    radial-gradient(30% 30% at 15% 80%, hsl(40 90% 55% / calc(var(--lit, 0) * .35)), transparent 70%);
  animation: skyflow 28s ease-in-out infinite alternate; transition: filter 1.5s; }
@keyframes skyflow { 0% { transform: translate(0, 0) rotate(0); } 50% { transform: translate(3%, -2%) rotate(3deg); } 100% { transform: translate(-3%, 2%) rotate(-2deg); } }
@keyframes enter { from { opacity: 0; transform: translateY(10px) scale(.985); filter: saturate(.5) brightness(.9); } to { opacity: 1; transform: none; filter: none; } }
.screen { animation: enter .45s cubic-bezier(.2, .8, .2, 1) both; }
.btn, .opt, .mcard, .ing, .tbin, .bin, .sil, .chip, .acard { transition: transform .12s ease, box-shadow .12s ease, background-color .25s ease, filter .2s; }
.btn:not(:disabled):active, .opt:active, .ing:active, .tbin:active, .bin:active, .sil:not(:disabled):active { transform: translate(2px, 2px) scale(.98); box-shadow: 1px 1px 0 var(--ink); }
@media (hover: hover) { .btn:not(:disabled):hover, .opt:hover, .ing:hover, .tbin:hover { filter: brightness(1.06); transform: translateY(-1px); } }
.btn.primary:not(:disabled) { background-image: linear-gradient(180deg, #ffe17a, var(--gold) 55%, #e8b42e); }
.lights .bar i, .hud .bar i { background-image: linear-gradient(90deg, #f4c542, #fff1a8, #f4c542); background-size: 200% 100%; animation: shimmer 3s linear infinite; transition: width .8s cubic-bezier(.2, .8, .2, 1); }
@keyframes shimmer { to { background-position: -200% 0; } }
.prompt, .panel, .fact, .mghead, .bubble .text { background-image: linear-gradient(180deg, #fffaf0, var(--paper)); }
.scene img.bg { transition: filter 1.2s ease; }

.jobscene { position: relative; }

.flame { position: absolute; z-index: 4; padding: 0; border: 0; background: none; cursor: pointer; transform-origin: 50% 100%; transition: transform .2s; animation: popin .3s both; }

@keyframes flick { 50% { transform: scaleY(1.12) translateY(-4%); } }

.spray { position: absolute; z-index: 5; width: 4%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(#e8f7ff, #5fb8ff 60%, transparent 70%); animation: spray .5s ease-out forwards; pointer-events: none; }

/* compõe um cenário com objetos e elenco, devolve canvas */
function composeScene(key, items = [], cast = []) {
  const c = mkCanvas(SW, SH), ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  (SCENES[key] || SCENES.cidade)(ctx);
  for (const it of items) if (!it.hidden && it.prop) put(ctx, it.prop, it.x, it.y, it.mode, it.flip);
  for (const m of cast) put(ctx, m.id, m.x, m.y, m.mode, m.flip);
  return c;
}

    if (kind === 'bike') return `<div class="amb cross" style="${d};width:${pct(16, SW)}"><img class="px rider" src="${SPR.url(who || 'davi')}" alt=""><img class="px" src="${SPR.url('bike')}" alt=""></div>`;
    if (kind === 'carro' || kind === 'bus') { const v = kind === 'bus' ? 'onibus' : (who || ['carro', 'carro2', 'carro3', 'taxi'][Math.round(y + dur) % 4]); return `<div class="amb cross back" style="${d};width:${pct(v === 'onibus' ? 48 : 32, SW)}"><img class="px" src="${SPR.url(v)}" alt=""></div>`; }
    return `<div class="amb fly" style="${d};width:${pct(8, SW)}"><img class="px f1" src="${SPR.url('passaro')}" alt=""><img class="px f2" src="${SPR.url('passaro2')}" alt=""></div>`;
  }).join('') + '</div>';
}
function sceneHTML(key, { items = [], cast = [], faded = true, alt = '', extra = '', cap = false } = {}) {
  const url = composeScene(key, items, []).toDataURL();
  const people = cast.map(m => { const c = SPR.canvas(m.id, m.mode); return `<img class="px sprite" src="${SPR.url(m.id, m.mode)}" alt="" style="left:${pct(m.x, SW)};top:${pct(m.y, SH)};width:${pct(c.width, SW)}${m.flip ? ';transform:scaleX(-1)' : ''}">`; }).join('');
  return `<div class="scene ${faded ? 'faded' : ''} ${cap ? 'cap' : ''}"><img class="bg px" src="${url}" alt="${esc(alt)}">${ambientHTML(key)}<div class="layer castl">${people}</div><div class="fogl"></div>${extra}</div>`;
}
const pct = (v, total) => (v / total * 100).toFixed(3) + '%';
function hotStyle(it) {
  const w = it.w || 18, h = it.h || 18, pad = 2;
  return `left:${pct(it.x - pad, SW)};top:${pct(it.y - pad, SH)};width:${pct(w + pad * 2, SW)};height:${pct(h + pad * 2, SH)}`;
}

   MECÂNICAS — cada tipo de etapa de missão

function promptHTML(text) {
  return `<div class="prompt"><img class="px" src="${SPR.url('faisca')}" alt=""><p>${esc(text)}</p><button class="ibtn" data-say data-local aria-label="Ouvir em voz alta">${ICON.voice}</button></div>`;
}
function feedback(box, kind, html, prop) {
  box.innerHTML = `<div class="feedback ${kind}" role="status">${prop ? SPR.img(prop) : ''}<div>${html}</div></div>`;
  if (window.innerWidth < 860 && box.scrollIntoView) { try { box.scrollIntoView({ behavior: S.reduceMotion ? 'auto' : 'smooth', block: 'nearest' }); } catch (e) {} }
}
function wireSay(root, fn) { $$('[data-say]', root).forEach(b => b.onclick = () => { Audio8.init(); Voice.enabled = S.voice && !S.mute; if (!S.voice) toast('A leitura em voz alta está desligada nas configurações.'); Voice.speak(fn()); }); }

/* personagem do jogador andando pela cena */
const AV_FLOOR = { sala: [40, 64], cozinha: [40, 64], quarto: [40, 64], parque: [30, 64], salaaula: [38, 64], rua: [28, 40] };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function makeWalker(ctx, sceneKey, items, onExamine) {
  const sc = $('.scene', ctx.stage); if (!sc) return null;
  const [y0, y1] = AV_FLOOR[sceneKey] || [40, 64];
  const st = { x: 2, y: y1 - 2, busy: false, flip: false, frame: 0, timer: null };
  sc.insertAdjacentHTML('beforeend', `<img class="px avatar" alt="Seu personagem" src="${SPR.url(avatarOf())}"><span class="av-tip" aria-hidden="true">Examinar</span>`);
  const img = $('.avatar', sc), tip = $('.av-tip', sc);
  const place = dur => { img.style.transitionDuration = dur + 's'; img.style.left = pct(st.x, SW); img.style.top = pct(st.y, SH); img.style.width = pct(16, SW); img.classList.toggle('flip', st.flip); };
  const anim = on => { clearInterval(st.timer); if (on) st.timer = setInterval(() => { st.frame ^= 1; img.src = SPR.url(avatarOf(), st.frame ? 'walk' : null); }, 130); else { st.frame = 0; img.src = SPR.url(avatarOf()); } };
  const nearest = () => {
    let best = null, bd = 1e9; const cx = st.x + 8, cy = st.y + 14;
    items.forEach((it, k) => { const d = Math.hypot(it.x + (it.w || 18) / 2 - cx, it.y + (it.h || 18) / 2 - cy); if (d < bd) { bd = d; best = k; } });
    return bd < 30 ? best : null;
  };
  const highlight = () => {
    $$('.hot.near', sc).forEach(h => h.classList.remove('near'));
    const k = nearest(); if (k === null) { tip.style.display = 'none'; return; }
    const it = items[k], h = $(`.hot[data-k="${k}"]`, sc); if (h) h.classList.add('near');
    tip.style.display = 'block'; tip.style.left = pct(it.x + (it.w || 18) / 2, SW); tip.style.top = pct(Math.max(0, it.y - 7), SH);
  };
  const walkTo = (x, y, cb) => {
    x = clamp(Math.round(x), 0, SW - 16); y = clamp(Math.round(y), y0, y1);
    const d = Math.hypot(x - st.x, y - st.y); if (x !== st.x) st.flip = x < st.x; st.x = x; st.y = y;
    const dur = S.reduceMotion ? 0 : Math.min(1.1, d / 95);
    anim(dur > .05); place(dur); st.busy = true;
    clearTimeout(st.to); st.to = setTimeout(() => { anim(false); st.busy = false; st.target = null; highlight(); if (cb) cb(); }, dur * 1000 + 40);
  };
  const goItem = (it, cb) => {
    if (st.busy && st.target === it) return;
    st.target = it;
    const left = it.x - 14 > 0 && (it.x - 14 >= st.x - 40 || it.x + (it.w || 18) + 2 > SW - 16);
    walkTo(left ? it.x - 14 : it.x + (it.w || 18) - 2, it.y + (it.h || 18) - 22, cb);
  };
  sc.addEventListener('click', e => {
    if (e.target.closest(".hot")) return; st.target = null;
    const r = sc.getBoundingClientRect();
    walkTo((e.clientX - r.left) / r.width * SW - 8, (e.clientY - r.top) / r.height * SH - 20);
  });
  const onKey = e => {
    if ($('#modal') || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
    const m = { ArrowUp: [0, -5], ArrowDown: [0, 5], ArrowLeft: [-6, 0], ArrowRight: [6, 0], w: [0, -5], s: [0, 5], a: [-6, 0], d: [6, 0] }[e.key];
    if (m) { e.preventDefault(); walkTo(st.x + m[0], st.y + m[1]); return; }
    if ((e.key === 'Enter' || e.key === ' ') && !document.activeElement.closest('button')) {
      const k = nearest(); if (k !== null) { e.preventDefault(); onExamine(k); }
    }
  };
  document.addEventListener('keydown', onKey);
  onCleanup(() => { document.removeEventListener('keydown', onKey); clearInterval(st.timer); clearTimeout(st.to); });
  place(0); setTimeout(highlight, 50);
  const step = (dx, dy) => { st.target = null; walkTo(st.x + dx * 5, st.y + dy * 4); };
  const act = () => { const k = nearest(); if (k !== null) onExamine(k); else toast('Chegue mais perto de um objeto para examinar.', 'faisca'); };
  const pad = document.createElement('div'); pad.innerHTML = dpadHTML('Ver'); sc.after(pad.firstElementChild);
  wireDpad(sc.parentElement, step, act);
  return { goItem, refresh: () => { img.src = SPR.url(avatarOf()); }, get busy() { return st.busy; } };
}

const STEPS = {
  /* ---------------- DIÁLOGO ---------------- */
  dialog(step, ctx) {
    let i = 0, cancelT = null;
    const lines = step.lines;
    ctx.stage.innerHTML = sceneHTML(step.scene, { items: step.items, faded: step.faded ?? !ctx.colored, alt: 'Cena da história', cap: true }) + `<div id="bub"></div>`;
    const sc = $('.scene', ctx.stage), lay = document.createElement('div'); lay.className = 'layer'; sc.appendChild(lay);
    /* tocar na cena ou no balão também avança (mais fluido) */
    ctx.stage.addEventListener('click', e => { if (e.target.closest('button, a, input')) return; const p = $('#prim'); if (p && !p.disabled) p.click(); else if (RUN.ctrl && RUN.ctrl.primary) { RUN.ctrl.primary(); } });
    const actors = (step.cast || []).map((m, k) => {
      const big = m.id.startsWith('nevoa'), fromX = big ? m.x : (m.x < 80 ? -20 : 170);
      const el = spriteEl(m.id, fromX, big ? m.y - 20 : m.y, { mode: m.mode }); el.dataset.who = m.id; lay.appendChild(el);
      if (m.x >= 80 && !big) el.classList.add('flip');
      setTimeout(() => { moveEl(el, m.x, m.y, S.reduceMotion ? 0 : 1100 + k * 150, true); setTimeout(() => el.classList.remove('flip'), 1300 + k * 150); }, 60);
      return el;
    });
    /* os capangas da vilã aprontam na cena e fogem quando o herói chega */
    const fumas = (ctx.id !== '_finale' && !ctx.colored) ? [[18, 10], [118, 16], [70, 6]].map(([x, y], k) => { const f = spriteEl('fumacinha', x, y, { w: 14, cls: 'fumafly' }); f.style.animationDelay = (k * .4) + 's'; lay.appendChild(f); return f; }) : [];
    if (fumas.length) setTimeout(() => { if (typeof floatText === 'function') floatText(sc, 'Hehehe!', 20, 18); Audio8.sfx('villain'); }, 700);
    const flee = () => fumas.forEach((f, k) => { f.classList.remove('fumafly'); moveEl(f, k % 2 ? 180 : -30, -20, 900); });
    const show = () => {
      const l = lines[i];
      const who = l.who.replace('?', '');
      if (i === lines.length - 1 && fumas.length) setTimeout(flee, 600);
      actors.forEach(a => a.classList.toggle('talk', a.dataset.who === who));
      $('#bub', ctx.stage).innerHTML = bubbleHTML(l.who, l.text);
      ctx.setPrimary(i < lines.length - 1 ? 'Continuar' : 'Vamos lá!');
      if (S.autoRead) Voice.speak(l.text);
      if (cancelT) { cancelT(); cancelT = null; }
    };
    show(); ctx.complete();
    ctx.stage.onclick = e => { if (e.isTrusted && !e.target.closest('button')) $('#prim').click(); };
    return {
      speak: () => lines[i].text,
      primary() { if (i < lines.length - 1) { i++; Audio8.sfx('page'); show(); return true; } return false; },
      back() { if (i > 0) { i--; show(); return true; } return false; }
    };
  },

  /* ---------------- INVESTIGAÇÃO ---------------- */
  investigate(step, ctx) {
    const items = step.items.filter(lvlOk);
    const clues = items.filter(i => i.clue);
    const goal = Math.min(clues.length, G.diff === 'exp' ? 2 : G.diff === 'inv' ? 3 : clues.length);
    const found = new Set(), checked = new Set();
    const hots = items.map((it, k) => `<button class="hot" data-k="${k}" style="${hotStyle(it)}" aria-label="Examinar: ${esc(it.label)}"></button>`).join('');
    ctx.stage.innerHTML = promptHTML(step.prompt) +
      `<div class="two"><div>${sceneHTML(step.scene, { items, cast: step.cast, faded: !ctx.colored, extra: hots, alt: 'Cena para investigar' })}<p class="nbmini">Pistas encontradas: <b id="cnt2">0</b> de ${goal}</p><p class="walk-help">Toque num objeto, use o controle ou as setas do teclado para andar. Perto de um objeto, toque em Examinar (ou Enter).</p><div id="fb" style="margin-top:12px"></div></div>
      <aside class="notebook"><h3>Caderno de pistas</h3><p class="muted" style="margin:0 0 8px;font-weight:700">Pistas: <b id="cnt">0</b> de ${goal}</p><ul id="nb">${Array.from({ length: goal }, () => '<li class="empty"><span></span></li>').join('')}</ul></aside></div>`;
    wireSay(ctx.stage, () => step.prompt);
    const fb = $('#fb', ctx.stage), nb = $('#nb', ctx.stage);
    const examine = k => {
      const b = $(`.hot[data-k="${k}"]`, ctx.stage), it = items[k];
      ctx.activity();
      if (it.clue) {
        if (found.has(it)) { feedback(fb, 'info', `<b>${esc(it.label)}</b> já está no caderno.`, it.prop); return; }
        found.add(it); b.classList.add('found'); b.classList.remove('hint-pulse');
        if (typeof floatText === 'function') floatText($('.scene', ctx.stage), esc(it.label) + '!', ((it.x + (it.w || 18) / 2) / SW) * 100, Math.max(8, (it.y / SH) * 100 - 6));
        if (it.prop && !ctx.colored) b.insertAdjacentHTML('afterbegin', `<img class="px colorize" src="${SPR.url(it.prop)}" alt="">`);
        b.insertAdjacentHTML('beforeend', `<span class="badge">${found.size}</span>`);
        Audio8.sfx('found'); sparkle(b);
        feedback(fb, 'ok', `<b class="kind">Pista encontrada!</b>${esc(it.text)}`, it.prop);
        const li = nb.children[found.size - 1]; if (li) li.className = ''; if (li) li.innerHTML = `${it.prop ? SPR.img(it.prop) : ''}<span>${esc(it.label)}</span>`;
        $('#cnt', ctx.stage).textContent = found.size; $('#cnt2', ctx.stage).textContent = found.size;
        if (S.autoRead) Voice.speak(it.text);
        if (found.size === goal) { ctx.complete(); Audio8.sfx('ok'); }
        else ctx.nextTurn();
      } else {
        b.classList.add('checked'); Audio8.sfx('select');
        feedback(fb, 'info', `<b>${esc(it.label)}</b>: ${esc(it.text)}`, it.prop);
        if (!checked.has(it)) { checked.add(it); addMedal('curiosidade', 1, 'cur:' + ctx.id + ':' + it.label); }
        if (S.autoRead) Voice.speak(it.text);

    };
    const W = makeWalker(ctx, step.scene, items, examine);
    ctx.onTurn(() => W && W.refresh());
    $$('.hot', ctx.stage).forEach(b => b.onclick = e => {
      e.stopPropagation(); const k = +b.dataset.k;
      if (W) W.goItem(items[k], () => examine(k)); else examine(k);
    });
    return {
      speak: () => step.prompt,
      hint() { ctx.usedHint(); const k = items.findIndex(i => i.clue && !found.has(i)); if (k >= 0) { const b = $(`.hot[data-k="${k}"]`, ctx.stage); b.classList.add('hint-pulse'); b.focus(); } }
    };
  },

  /* ---------------- ANTES E DEPOIS (diferenças) ---------------- */
  spot(step, ctx) {
    const diffs = step.diffs.filter(lvlOk), found = new Set();
    const before = diffs.map(d => ({ prop: d.prop, x: d.x, y: d.y }));
    const after = diffs.filter(d => d.after).map(d => ({ prop: d.after, x: d.x, y: d.y }));
    const hots = side => diffs.map((d, k) => `<button class="hot" data-k="${k}" style="${hotStyle(d)}" aria-label="${side}: ${esc(d.label)}"></button>`).join('');
    ctx.stage.innerHTML = promptHTML(step.prompt) +
      `<div class="two" style="grid-template-columns:1fr 1fr">
        <div><span class="tag">Às 5h da manhã</span>${sceneHTML(step.scene, { items: before, faded: !ctx.colored, extra: hots('Às 5h'), alt: 'Rua às 5h' })}</div>
        <div><span class="tag">Às 7h da manhã</span>${sceneHTML(step.scene, { items: after, faded: !ctx.colored, extra: hots('Às 7h'), alt: 'Rua às 7h' })}</div>
      </div><p style="color:#fff;font-weight:800;margin:0">Diferenças encontradas: <span id="cnt">0</span> de ${diffs.length}</p><div id="fb"></div>`;
    wireSay(ctx.stage, () => step.prompt);
    const fb = $('#fb', ctx.stage);
    $$('.hot', ctx.stage).forEach(b => b.onclick = () => {
      const k = +b.dataset.k, d = diffs[k]; ctx.activity();
      if (found.has(k)) { feedback(fb, 'info', `Essa você já achou: ${esc(d.label)}.`); return; }
      found.add(k);
      $$(`.hot[data-k="${k}"]`, ctx.stage).forEach(h => { h.classList.add('found'); h.classList.remove('hint-pulse'); h.insertAdjacentHTML('beforeend', `<span class="badge">${found.size}</span>`); });
      Audio8.sfx('found'); sparkle(b);
      feedback(fb, 'ok', `<b class="kind">${esc(d.label)}</b>${esc(d.text)}`, d.prop);
      $('#cnt', ctx.stage).textContent = found.size;
      if (S.autoRead) Voice.speak(d.text);
      if (found.size === diffs.length) ctx.complete(); else ctx.nextTurn();
    });
    return {
      speak: () => step.prompt,
      hint() { ctx.usedHint(); const k = diffs.findIndex((_, i) => !found.has(i)); if (k >= 0) $$(`.hot[data-k="${k}"]`, ctx.stage).forEach(h => h.classList.add('hint-pulse')); }
    };
  },

  /* ---------------- ASSOCIAÇÃO ---------------- */
  match(step, ctx) {
    const pairs = (step.pairsFn ? step.pairsFn() : step.pairs).filter(lvlOk);
    const decoys = (step.decoys || []).slice(0, DIFFS[G.diff].decoys);
    const order = shuffle(pairs.map((_, i) => i).concat(decoys.map((_, i) => 'd' + i)));
    let selA = null, selB = null, n = 0; const done = new Set();
    ctx.stage.innerHTML = promptHTML(step.prompt) + `<div class="match">
      <div class="col"><b>${esc(step.left || 'Item')}</b>${pairs.map((p, i) => `<button class="mcard" data-a="${i}" aria-pressed="false">${p.a.prop ? SPR.img(p.a.prop) : ''}${p.a.img || ''}<span class="grow">${esc(p.a.label)}</span><span class="num" aria-hidden="true">?</span></button>`).join('')}</div>
      <div class="col"><b>${esc(step.right || 'Combina com')}</b>${order.map(i => { const it = typeof i === 'string' ? decoys[+i.slice(1)] : pairs[i].b; return `<button class="mcard" data-b="${i}" aria-pressed="false">${it.prop ? SPR.img(it.prop) : ''}<span class="grow">${esc(it.label)}</span><span class="num" aria-hidden="true">?</span></button>`; }).join('')}</div>
    </div><div id="fb"></div>`;
    wireSay(ctx.stage, () => step.prompt);
    const fb = $('#fb', ctx.stage);
    const A = i => $(`[data-a="${i}"]`, ctx.stage), B = i => $(`[data-b="${i}"]`, ctx.stage);
    const one = window.innerWidth < 700; if (one) ctx.stage.classList.add('one');
    const clearSel = () => { $$('.mcard', ctx.stage).forEach(c => { if (!c.classList.contains('done')) c.setAttribute('aria-pressed', 'false'); }); if (one) autoA(); };
    const autoA = () => { const a = $$('[data-a]', ctx.stage).find(c => !c.classList.contains('done')); if (a) { selA = +a.dataset.a; a.setAttribute('aria-pressed', 'true'); } };
    const tryPair = () => {
      if (selA === null || selB === null) return;
      ctx.activity();
      if (typeof selB === 'string') {
        Audio8.sfx('soft'); ctx.mistake(); const c = B(selB); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
        feedback(fb, 'soft', `<b class="kind">Essa é uma pegadinha!</b>${esc(step.decoyWhy || 'Essa opção não combina com nenhum item da esquerda.')}`);
      } else if (selA === selB) {
        n++; done.add(selA);
        [A(selA), B(selB)].forEach(c => { c.classList.add('done'); c.disabled = true; c.setAttribute('aria-pressed', 'false'); c.classList.remove('hint-pulse'); c.querySelector('.num').textContent = n; });
        Audio8.sfx('ok'); sparkle(B(selB));
        feedback(fb, 'ok', `<b class="kind">Combinou!</b>${esc(pairs[selA].ok)}`, pairs[selA].a.prop);
        if (S.autoRead) Voice.speak(pairs[selA].ok);
        if (done.size === pairs.length) ctx.complete(); else ctx.nextTurn();
      } else {
        Audio8.sfx('soft'); ctx.mistake();
        [A(selA), B(selB)].forEach(c => { c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); });
        feedback(fb, 'soft', esc(step.wrong || 'Ainda não. Tente outra combinação!'));
      }
      selA = selB = null; clearSel();
    };
    if (one) setTimeout(autoA, 0);
    $$('[data-a]', ctx.stage).forEach(c => c.onclick = () => { $$('[data-a]', ctx.stage).forEach(x => { if (!x.classList.contains('done')) x.setAttribute('aria-pressed', 'false'); }); selA = +c.dataset.a; c.setAttribute('aria-pressed', 'true'); if (selB !== null) B(selB).setAttribute('aria-pressed', 'true'); Audio8.sfx('select'); tryPair(); });
    $$('[data-b]', ctx.stage).forEach(c => c.onclick = () => { $$('[data-b]', ctx.stage).forEach(x => { if (!x.classList.contains('done')) x.setAttribute('aria-pressed', 'false'); }); selB = c.dataset.b[0] === 'd' ? c.dataset.b : +c.dataset.b; c.setAttribute('aria-pressed', 'true'); Audio8.sfx('select'); tryPair(); });
    return {
      speak: () => step.prompt + ' ' + pairs.map(p => p.a.label).join('. '),
      hint() { ctx.usedHint(); const i = pairs.findIndex((_, k) => !done.has(k)); if (i >= 0) { A(i).classList.add('hint-pulse'); B(i).classList.add('hint-pulse'); } }
    };
  },

  /* ---------------- SEQUÊNCIA ---------------- */
  sequence(step, ctx) {
    const items = step.items.filter(lvlOk), N = items.length;
    let pool = shuffle(items.map((_, i) => i)); if (pool.every((v, i) => v === i)) pool.reverse();
    const slots = Array(N).fill(null), locked = new Set();
    ctx.stage.innerHTML = promptHTML(step.prompt) + `<div class="slots" id="slots"></div><p style="color:#fff;font-weight:800;margin:0;text-align:center">Toque num cartão para colocá-lo no próximo espaço. Toque de novo para tirar.</p><div class="pool" id="pool"></div><div class="row center" id="chk"></div><div id="fb"></div>`;
    wireSay(ctx.stage, () => step.prompt + ' ' + items.map(i => i.label).join('. '));
    const fb = $('#fb', ctx.stage);
    const card = i => `${SPR.img(items[i].prop)}<span>${esc(items[i].label)}</span>`;
    const draw = () => {
      $('#slots', ctx.stage).innerHTML = slots.map((v, s) => v === null
        ? `<div class="slot" aria-label="Espaço ${s + 1} vazio"><span class="n">${s + 1}</span></div>`
        : `<button class="slot filled ${locked.has(s) ? 'right' : ''}" data-s="${s}" ${locked.has(s) ? 'disabled' : ''} aria-label="Espaço ${s + 1}: ${esc(items[v].label)}${locked.has(s) ? ', correto' : ', tocar para tirar'}"><span class="n">${s + 1}</span><span class="scard">${card(v)}</span></button>`).join('');
      $('#pool', ctx.stage).innerHTML = pool.map(i => `<button class="scard" data-i="${i}">${card(i)}</button>`).join('');
      $('#chk', ctx.stage).innerHTML = slots.every(v => v !== null) && locked.size < N ? `<button class="btn primary big" id="check">Conferir a ordem</button>` : '';
      $$('[data-i]', ctx.stage).forEach(b => b.onclick = () => { ctx.activity(); const s = slots.indexOf(null); slots[s] = +b.dataset.i; pool = pool.filter(x => x !== +b.dataset.i); Audio8.sfx('select'); draw(); const nx = $('[data-i]', ctx.stage) || $('#check', ctx.stage); if (nx) nx.focus(); });
      $$('[data-s]', ctx.stage).forEach(b => b.onclick = () => { const s = +b.dataset.s; pool.push(slots[s]); slots[s] = null; Audio8.sfx('page'); draw(); });
      const ch = $('#check', ctx.stage); if (ch) ch.onclick = check;
    };
    const check = () => {
      ctx.activity();
      let right = 0;
      const det = G.diff === 'det';
      slots.forEach((v, s) => { if (v === s) { right++; if (!det) locked.add(s); } });
      if (right === N) { for (let s = 0; s < N; s++) locked.add(s); }
      if (det && right < N) {
        Audio8.sfx('soft'); ctx.mistake(); draw();
        feedback(fb, 'soft', `<b>${right} de ${N}</b> estão no lugar certo, mas o Detetive não sabe quais! Toque nos cartões para trocar de lugar e confira de novo.`);

      }

        Audio8.sfx('ok'); draw(); feedback(fb, 'ok', `<b class="kind">Ordem certinha!</b>${esc(step.ok)}`, 'estrela'); ctx.complete();
        if (S.autoRead) Voice.speak(step.ok);
      } else {
        slots.forEach((v, s) => { if (!locked.has(s) && v !== null) { pool.push(v); slots[s] = null; } });
        Audio8.sfx('soft'); ctx.mistake(); draw();

      speak: () => step.prompt,
      hint() {

        feedback(fb, 'info', `A Faísca colocou o passo ${s + 1}: <b>${esc(items[s].label)}</b>.`, 'faisca');
        if (locked.size === N) { ctx.complete(); feedback(fb, 'ok', `<b class="kind">Ordem certinha!</b>${esc(step.ok)}`, 'estrela'); }
      }
    };
  },

  /* ---------------- SEPARAÇÃO ---------------- */
  sort(step, ctx) {

    wireSay(ctx.stage, () => step.prompt + ' ' + (items[k] ? items[k].label : ''));
    const fb = $('#fb', ctx.stage); let locked = false;
    const showItem = () => {

        Audio8.sfx('ok'); sparkle(b, 6);
        feedback(fb, 'ok', `<b class="kind">Isso!</b>${esc(it.why)}<div class="row" style="margin-top:8px"><button class="btn small primary" id="nx">${k + 1 < items.length ? 'Próximo item' : 'Terminar'} ${ICON.next}</button></div>`, it.prop);
        if (S.autoRead) Voice.speak(it.why);

        const bl = bins.find(x => x.id === b.dataset.bin).label;

      hint() { ctx.usedHint(); if (items[k]) $(`.bin[data-bin="${items[k].bin}"]`, ctx.stage).classList.add('hint-pulse'); }
    };
  },

  /* ---------------- ROTA ---------------- */
  route(step, ctx) {
    const g = step.grids[G.diff] || step.grids.inv;
    const urgentIdx = G.diff !== 'exp' && step.urgent ? g.drops.findIndex(d => d.prop === step.urgent) : -1;
    let pos = g.start.slice(); const trail = [pos.slice()], delivered = new Set();
    const key = (x, y) => x + ',' + y;
    const blockAt = (x, y) => g.blocks.find(b => b.x === x && b.y === y);
    const dropAt = (x, y) => g.drops.findIndex(d => d.x === x && d.y === y);
    ctx.stage.innerHTML = promptHTML(step.prompt) + `<div class="route-wrap"><div class="grid" id="grid" style="grid-template-columns:repeat(${g.w},auto);--gw:${g.w};--gh:${g.h}" role="grid" aria-label="Mapa das entregas"></div>
      <div class="route-side"><div class="drop-list" id="dl"></div><div class="arrows" aria-label="Setas para mover">
        <span></span><button class="btn" data-mv="0,-1" aria-label="Para cima">▲</button><span></span>
        <button class="btn" data-mv="-1,0" aria-label="Para a esquerda">◀</button><button class="btn" id="undo" aria-label="Desfazer">${ICON.undo}</button><button class="btn" data-mv="1,0" aria-label="Para a direita">▶</button>
        <span></span><button class="btn" data-mv="0,1" aria-label="Para baixo">▼</button><span></span></div>
        <div id="fb"></div></div></div>`;
    wireSay(ctx.stage, () => step.prompt);
    const fb = $('#fb', ctx.stage);
    const draw = () => {
      const tr = new Set(trail.map(p => key(p[0], p[1])));
      let html = '';
      for (let y = 0; y < g.h; y++) for (let x = 0; x < g.w; x++) {
        const b = blockAt(x, y), d = dropAt(x, y), here = pos[0] === x && pos[1] === y;
        const near = Math.abs(pos[0] - x) + Math.abs(pos[1] - y) === 1;
        const st = x === g.start[0] && y === g.start[1];
        let cls = 'cell', inner = '', label = `Rua ${x + 1}, ${y + 1}`;
        if (b) { cls += ' block'; inner = SPR.img(b.prop); label = b.prop === 'agua' ? 'Rua alagada' : 'Rua em obra'; }
        else if (d >= 0) { cls += ' drop' + (delivered.has(d) ? ' done' : ''); inner = SPR.img(g.drops[d].prop); label = 'Entrega: ' + g.drops[d].label + (delivered.has(d) ? ' (entregue)' : ''); }
        else if (st) { cls += ' start'; inner = SPR.img('barraca'); label = 'Mercado (saída)'; }
        if (tr.has(key(x, y)) && !b && d < 0 && !st) cls += ' trail';
        if (here) { cls += ' here'; inner += `<img class="px bikeimg" src="${SPR.url('bike')}" alt="">`; label += ' (a bicicleta está aqui)'; }
        if (near && !b) cls += ' near';
        html += `<button class="${cls}" data-x="${x}" data-y="${y}" aria-label="${esc(label)}">${inner}</button>`;
      }
      $('#grid', ctx.stage).innerHTML = html;
      $('#dl', ctx.stage).innerHTML = g.drops.map((d, i) => `<div class="${delivered.has(i) ? 'done' : ''}">${SPR.img(d.prop)}<span>${esc(d.label)}${i === urgentIdx ? ' <b class="urg">URGENTE</b>' : ''}</span></div>`).join('') + `<small style="color:#fff;font-weight:700">Pedaladas: ${trail.length - 1}</small>`;
      $$('.cell', ctx.stage).forEach(c => c.onclick = () => move(+c.dataset.x, +c.dataset.y));
    };
    const move = (x, y) => {
      ctx.activity();
      if (x < 0 || y < 0 || x >= g.w || y >= g.h) return;
      if (Math.abs(pos[0] - x) + Math.abs(pos[1] - y) !== 1) {
        if (!(pos[0] === x && pos[1] === y)) feedback(fb, 'info', 'A bicicleta anda uma rua de cada vez. Toque num quadrado vizinho (com borda branca).');
        return;
      }
      const b = blockAt(x, y);
      if (b) { Audio8.sfx('soft'); ctx.mistake(); feedback(fb, 'soft', esc(step.blockText[b.prop]), b.prop); return; }
      pos = [x, y]; trail.push(pos.slice()); Audio8.sfx('click');
      const d = dropAt(x, y);
      if (d >= 0 && !delivered.has(d) && urgentIdx >= 0 && d !== urgentIdx && !delivered.has(urgentIdx)) {
        Audio8.sfx('soft'); ctx.mistake(); feedback(fb, 'soft', esc(step.urgentText), 'farmacia'); draw(); return;
      }
      if (d >= 0 && !delivered.has(d)) {
        delivered.add(d); Audio8.sfx('found');
        feedback(fb, 'ok', `<b class="kind">Entregue!</b>${esc(g.drops[d].label)}`, g.drops[d].prop);
        if (delivered.size === g.drops.length) { draw(); feedback(fb, 'ok', `<b class="kind">Tudo entregue!</b>${esc(step.ok)}`, 'bike'); Audio8.sfx('ok'); ctx.complete(); return; }
        ctx.nextTurn();
      }
      draw();
      const h = $('.cell.here', ctx.stage); if (h && document.activeElement && document.activeElement.classList.contains('cell')) h.focus();
    };
    $$('[data-mv]', ctx.stage).forEach(b => b.onclick = () => { const [dx, dy] = b.dataset.mv.split(',').map(Number); move(pos[0] + dx, pos[1] + dy); });
    $('#undo', ctx.stage).onclick = () => { if (trail.length > 1) { trail.pop(); pos = trail[trail.length - 1].slice(); Audio8.sfx('page'); draw(); } };
    const onKey = e => {
      const m = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[e.key];
      if (m && !$('#modal')) { e.preventDefault(); move(pos[0] + m[0], pos[1] + m[1]); }
    };
    document.addEventListener('keydown', onKey); onCleanup(() => document.removeEventListener('keydown', onKey));
    draw();
    return {
      speak: () => step.prompt + ' Entregas: ' + g.drops.map(d => d.label).join(', '),
      hint() {
        const seen = new Map([[key(...pos), null]]), q = [pos.slice()];
        ctx.usedHint();
        while (q.length) {
          const [x, y] = q.shift(); const d = dropAt(x, y);
          if (d >= 0 && !delivered.has(d) && (urgentIdx < 0 || delivered.has(urgentIdx) || d === urgentIdx)) {
            let c = key(x, y), prev = seen.get(c); while (prev && prev !== key(...pos)) { c = prev; prev = seen.get(c); }
            const [hx, hy] = c.split(',').map(Number); const cell = $(`.cell[data-x="${hx}"][data-y="${hy}"]`, ctx.stage);
            if (cell) { cell.classList.add('hint-pulse'); cell.focus(); }
            feedback(fb, 'info', 'A Faísca mostrou o próximo quadrado do caminho.', 'faisca'); return;
          }
          for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
            const nx = x + dx, ny = y + dy, k2 = key(nx, ny);
            if (nx < 0 || ny < 0 || nx >= g.w || ny >= g.h || seen.has(k2) || blockAt(nx, ny)) continue;
            seen.set(k2, key(x, y)); q.push([nx, ny]);
          }
        }
      }
    };
  },

  /* ---------------- QUEM SOU EU? ---------------- */
  whoami(step, ctx) {
    const D = DIFFS[G.diff], clues = step.clues.slice(0, D.clues);
    const others = shuffle(Object.keys(CHARACTERS).filter(c => c !== step.char)).slice(0, D.options - 1);
    const opts = shuffle([step.char, ...others]); const out = new Set();
    const team = isJuntos(), phone = team && G.clueMode === 'phone', online = team && G.clueMode === 'online';

      };
      ctx.stage.innerHTML = promptHTML(team ? 'Cada um conta a sua pista com as próprias palavras, sem mostrar! Depois, decidam juntos: quem é?' : teacher ? 'Professor(a): revele as pistas uma a uma. A turma conversa e vota em quem é.' : 'Quem sou eu? Leia as pistas e escolha a silhueta certa. Quanto menos pistas usar, mais estrelas!')
        + `<div class="who-grid"><div class="clues" aria-live="polite">${clues.map(clueBox).join('')}
        ${!team && shown < clues.length ? `<button class="btn" id="more">${ICON.hint} Revelar a próxima pista</button>` : ''}
