/* ============================================================
   A CIDADE QUE ESQUECEU — identidade visual
   Papel quente + contorno de tinta + pixel art
   ============================================================ */
:root {
  --ink: #2b2233; --ink2: #4a4058; --paper: #fbf3e4; --paper2: #f3e6cf; --paper3: #e9d8b9;
  --gold: #f4c542; --gold2: #c99a2a; --glow: #fff1a8; --night: #27305a; --night2: #1b2142;
  --ok: #3d7f4c; --okbg: #dff2d8; --soft: #a8452f; --softbg: #fde3d6;
  --accent: #e0705a; --fog: #b9b6c6;
  --r: 10px; --bw: 3px; --shadow: 4px 4px 0 var(--ink);
  --fs: 18px;
  --title: 'Pixelify Sans', 'Courier New', monospace;
  --body: 'Nunito', 'Trebuchet MS', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: var(--fs); }
html.bt { --fs: 21px; }
html.sala { --fs: 24px; }
html.sala #app, html.sala .footbar .in { max-width: 1560px; }
html.sala.bt { --fs: 25px; }
body {
  margin: 0; min-height: 100vh; font-family: var(--body); color: var(--ink); line-height: 1.45;
  background: var(--night2);
  background-image: radial-gradient(circle at 20% 10%, #33407a 0, transparent 40%), radial-gradient(circle at 85% 90%, #3b2f5c 0, transparent 45%);
  -webkit-tap-highlight-color: transparent;
  overflow-x: clip;
}
img.px, canvas.px { image-rendering: pixelated; image-rendering: crisp-edges; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 4px solid var(--gold); outline-offset: 3px; border-radius: 6px; }
[tabindex="-1"]:focus { outline: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3 { font-family: var(--title); font-weight: 600; line-height: 1.1; margin: 0 0 .4em; letter-spacing: .01em; }

#app { max-width: 1180px; margin: 0 auto; padding: 14px 14px 110px; min-height: 100vh; }
.screen { animation: enter .35s ease both; }
@keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- caixas e botões ---------- */
.panel { background: var(--paper); border: var(--bw) solid var(--ink); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; }
.panel.dark { background: var(--night); color: #fff; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5em;
  min-height: 54px; padding: .55em 1.1em; border: var(--bw) solid var(--ink); border-radius: var(--r);
  background: var(--paper); box-shadow: var(--shadow); font-weight: 800; font-size: 1rem; text-align: center;
  transition: transform .08s, box-shadow .08s, background .15s;
}
.btn:hover:not(:disabled) { background: #fff; }
.btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.btn.primary { background: var(--gold); }
.btn.primary:hover:not(:disabled) { background: #ffd65e; }
.btn.ghost { background: transparent; box-shadow: none; border-color: transparent; color: inherit; text-decoration: underline; min-height: 44px; }
.btn.small { min-height: 44px; padding: .3em .8em; font-size: .9rem; }
.btn.big { min-height: 66px; font-size: 1.15rem; padding: .6em 1.5em; }
.btn:disabled { opacity: .45; box-shadow: 2px 2px 0 var(--ink); }
.ico { width: 22px; height: 22px; flex: none; }
.btn img.px { width: 32px; height: 32px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.row.center { justify-content: center; }
.row.end { justify-content: flex-end; }
.grow { flex: 1; }
.muted { opacity: .75; }
.tag { display: inline-block; font-size: .78rem; font-weight: 800; padding: .1em .6em; border: 2px solid var(--ink); border-radius: 99px; background: var(--paper2); }

/* ---------- HUD ---------- */
.hud { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; color: #fff; flex-wrap: wrap; }
.hud .btn { color: var(--ink); }
.hud .lights { flex: 1; min-width: 180px; display: flex; align-items: center; gap: 10px; }
.bar { flex: 1; height: 22px; border: var(--bw) solid var(--ink); border-radius: 99px; background: #3a3f5c; overflow: hidden; position: relative; box-shadow: 0 0 0 2px #ffffff22; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: repeating-linear-gradient(90deg, var(--gold) 0 10px, #ffd65e 10px 20px); transition: width 1.2s cubic-bezier(.2, .8, .2, 1); box-shadow: 0 0 12px var(--glow); }
.hud .pct { font-family: var(--title); font-size: 1.1rem; min-width: 3.2em; }
.hud .lbl { font-weight: 800; font-size: .85rem; white-space: nowrap; }
.turn { display: inline-flex; align-items: center; gap: 8px; background: var(--paper); color: var(--ink); border: var(--bw) solid var(--ink); border-radius: 99px; padding: 4px 14px 4px 6px; font-weight: 800; box-shadow: 3px 3px 0 var(--ink); }
.turn .dot, .pdot { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--ink); display: inline-grid; place-items: center; font-size: .75rem; font-weight: 900; color: var(--ink); }
.turn.flash { animation: pop .5s ease; }
@keyframes pop { 40% { transform: scale(1.12); } }

/* ---------- TÍTULO ---------- */
.title-wrap { display: grid; gap: 18px; justify-items: center; padding-top: 2vh; }
.title-art { position: relative; width: 100%; max-width: 960px; border: var(--bw) solid var(--ink); border-radius: 14px; overflow: hidden; box-shadow: 6px 6px 0 #0008; }
.title-art img.bg { display: block; width: 100%; filter: grayscale(.85) brightness(.9); }
.title-art .fog { position: absolute; inset: 0; background: linear-gradient(180deg, #b9b6c6cc, #b9b6c633 60%, transparent); pointer-events: none; }
.title-art .nevoa { position: absolute; width: 22%; top: 6%; left: 58%; animation: drift 9s ease-in-out infinite; }
.title-art .faisca { position: absolute; width: 8%; left: 20%; top: 46%; animation: fly 5s ease-in-out infinite; filter: drop-shadow(0 0 10px #fff1a8) drop-shadow(0 0 20px #f4c542); }
@keyframes drift { 50% { transform: translateX(-30px); } }
@keyframes fly { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(30px, -18px); } 50% { transform: translate(60px, 4px); } 75% { transform: translate(20px, 14px); } }
.logo { text-align: center; color: #fff; }
.logo h1 { font-size: clamp(2.2rem, 6vw, 4.2rem); color: var(--glow); text-shadow: 4px 4px 0 var(--ink), 0 0 26px #f4c54288; margin: 0; }
.logo p { margin: .3em 0 0; font-size: 1.1rem; opacity: .9; }
.title-btns { display: grid; gap: 12px; width: min(420px, 100%); }
.title-foot { color: #fff; opacity: .7; font-size: .85rem; text-align: center; }

/* ---------- SETUP ---------- */
.setup { max-width: 980px; margin: 0 auto; }
.setup h2 { color: #fff; text-align: center; font-size: 2rem; }
.setup .sub { color: #fff; text-align: center; opacity: .85; margin: -.2em 0 1em; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
.choice-card { text-align: left; display: grid; gap: 8px; align-content: start; padding: 16px; min-height: 180px; position: relative; }
.choice-card[aria-pressed="true"] { background: var(--glow); outline: 4px solid var(--gold); outline-offset: 2px; }
.choice-card[aria-pressed="true"]::after { content: '✓'; position: absolute; top: 8px; right: 12px; font-size: 1.6rem; font-weight: 900; }
.choice-card h3 { font-size: 1.35rem; margin: 0; }
.choice-card p { margin: 0; font-weight: 500; font-size: .95rem; }
.choice-card .art { display: flex; gap: 4px; height: 64px; align-items: flex-end; }
.choice-card .art img { height: 64px; }
.steps-dots { display: flex; justify-content: center; gap: 8px; margin: 14px 0; }
.steps-dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; }
.steps-dots i.on { background: var(--gold); border-color: var(--gold); }
.players { display: grid; gap: 10px; }
.player-row { display: flex; gap: 10px; align-items: center; }
.player-row input { flex: 1; min-height: 52px; font: inherit; font-weight: 700; padding: 0 14px; border: var(--bw) solid var(--ink); border-radius: var(--r); background: #fff; }
.count-pick { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 16px; }
.count-pick .btn { width: 66px; font-size: 1.4rem; }
.count-pick .btn[aria-pressed="true"] { background: var(--gold); }

/* ---------- CENAS ---------- */
.scene { position: relative; width: 100%; aspect-ratio: 16 / 9; border: var(--bw) solid var(--ink); border-radius: var(--r); overflow: hidden; background: var(--night); box-shadow: var(--shadow); }
.scene.cap { max-width: min(100%, calc(56vh * 16 / 9)); margin-inline: auto; }
.scene > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; transition: filter 1.6s ease; }
.scene.faded > img.bg { filter: grayscale(.85) brightness(1.04) contrast(.9); }
.scene .fogl { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 20% 0%, #d8d4e2aa, transparent 55%), radial-gradient(ellipse at 90% 10%, #d8d4e299, transparent 50%); transition: opacity 1.6s; }
.scene:not(.faded) .fogl { opacity: 0; }
.hot { position: absolute; border: 0; background: transparent; padding: 0; border-radius: 8px; }
.hot::after { content: ''; position: absolute; inset: -4px; border-radius: 10px; border: 3px dashed transparent; transition: border-color .15s; }
.hot:hover::after, .hot:focus-visible::after { border-color: #fff; box-shadow: 0 0 0 2px var(--ink); }
.hot.checked::after { border: 3px solid #fff8; }
.hot.found::after { border: 4px solid var(--gold); box-shadow: 0 0 0 2px var(--ink), 0 0 16px var(--glow); }
.hot .colorize { position: absolute; left: 9.09%; top: 9.09%; width: 81.82%; height: 81.82%; animation: colorin .8s ease both; }
@keyframes colorin { from { filter: grayscale(1); opacity: .3; } }
html.easy .hot::after { border-color: #ffffff55; }
.hot .badge { position: absolute; top: -12px; right: -12px; width: 30px; height: 30px; border-radius: 50%; background: var(--gold); border: 3px solid var(--ink); display: grid; place-items: center; font-weight: 900; font-size: .9rem; z-index: 2; }
.hint-pulse { animation: hint 1.1s ease-in-out infinite; }
.hint-pulse::after { border: 4px solid var(--gold) !important; box-shadow: 0 0 0 3px var(--ink), 0 0 24px var(--glow) !important; }
@keyframes hint { 50% { transform: scale(1.1); } }
.sparkle { position: absolute; width: 8px; height: 8px; background: var(--glow); box-shadow: 0 0 8px var(--gold); pointer-events: none; animation: spark .8s ease-out forwards; }
@keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }

/* ---------- MISSÃO ---------- */
.mhead { display: flex; align-items: center; gap: 12px; color: #fff; margin-bottom: 12px; flex-wrap: wrap; }
.mhead .where { font-size: .82rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; opacity: .85; }
.mhead h2 { margin: 0; font-size: 1.6rem; color: var(--glow); text-shadow: 3px 3px 0 var(--ink); }
.dots { display: flex; gap: 6px; margin-left: auto; }
.dots i { width: 16px; height: 16px; border: 3px solid var(--ink); background: #3a3f5c; border-radius: 4px; transform: rotate(45deg); }
.dots i.done { background: var(--gold); }
.dots i.now { background: #fff; box-shadow: 0 0 10px var(--glow); }
.stage { display: grid; gap: 14px; }
.two { display: grid; grid-template-columns: 1.6fr 1fr; gap: 14px; align-items: start; }
.prompt { display: flex; gap: 12px; align-items: center; background: var(--paper); border: var(--bw) solid var(--ink); border-radius: var(--r); padding: 10px 14px; box-shadow: var(--shadow); }
.prompt img.px { width: 48px; height: 48px; flex: none; animation: bob 2.4s ease-in-out infinite; }
.prompt p { margin: 0; font-weight: 800; font-size: 1.08rem; flex: 1; min-width: 0; overflow-wrap: anywhere; }
@keyframes bob { 50% { transform: translateY(-4px); } }
.ibtn { width: 48px; height: 48px; flex: none; border: var(--bw) solid var(--ink); border-radius: 50%; background: var(--paper2); display: grid; place-items: center; box-shadow: 2px 2px 0 var(--ink); }
.ibtn svg { width: 24px; height: 24px; }
.ibtn:active { transform: translate(2px, 2px); box-shadow: none; }

.bubble { display: flex; gap: 14px; align-items: flex-start; }
.bubble .who { flex: none; width: 92px; text-align: center; }
.bubble .who .face { width: 92px; height: 92px; border: var(--bw) solid var(--ink); border-radius: var(--r); background: var(--paper2); display: grid; place-items: center; overflow: hidden; }
.bubble .who .face img { width: 64px; }
.bubble .who b { display: block; font-size: .85rem; margin-top: 4px; color: #fff; }
.bubble .text { flex: 1; position: relative; background: #fff; border: var(--bw) solid var(--ink); border-radius: 14px; padding: 14px 18px; box-shadow: var(--shadow); font-size: 1.15rem; font-weight: 700; min-height: 92px; }
.bubble .text::before { content: ''; position: absolute; left: -14px; top: 26px; border: 10px solid transparent; border-right: 12px solid var(--ink); }
.bubble .text p { margin: 0 0 .6em; animation: enter .3s ease both; }

.feedback { border: var(--bw) solid var(--ink); border-radius: var(--r); padding: 12px 16px; font-weight: 700; box-shadow: var(--shadow); display: flex; gap: 12px; align-items: center; animation: enter .25s ease both; }
.feedback img.px { width: 40px; flex: none; }
.feedback.ok { background: var(--okbg); }
.feedback.soft { background: var(--softbg); }
.feedback.info { background: #fff; }
.feedback b.kind { display: block; font-family: var(--title); font-size: 1.1rem; }

/* caderno de pistas */
.notebook { background: #fffdf6; background-image: repeating-linear-gradient(transparent 0 31px, #cfe0f0 31px 32px); border: var(--bw) solid var(--ink); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow); }
.notebook h3 { font-size: 1.2rem; }
.notebook ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.notebook li { display: flex; gap: 8px; align-items: center; font-weight: 700; min-height: 40px; }
.notebook li img.px { width: 36px; }
.notebook li.empty { opacity: .45; }
.notebook li.empty span { border-bottom: 2px dashed var(--ink2); width: 60%; height: 1em; }

/* associação */
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.match .col { display: grid; gap: 10px; align-content: start; }
.match .col > b { color: #fff; font-family: var(--title); font-size: 1.1rem; }
.mcard { display: flex; align-items: center; gap: 10px; text-align: left; padding: 8px 12px; min-height: 64px; background: var(--paper); border: var(--bw) solid var(--ink); border-radius: var(--r); box-shadow: 3px 3px 0 var(--ink); font-weight: 700; transition: transform .1s, background .15s; }
.mcard img.px { width: 44px; height: 44px; flex: none; }
.mcard[aria-pressed="true"] { background: var(--glow); transform: translateX(6px); outline: 3px solid var(--gold); }
.mcard.done { background: var(--okbg); opacity: .9; }
.mcard.done .num { background: var(--ok); color: #fff; }
.mcard .num { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--ink); display: grid; place-items: center; font-weight: 900; font-size: .85rem; background: #fff; }
.mcard.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

/* sequência */
.slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.slot { min-height: 150px; border: var(--bw) dashed #ffffff88; border-radius: var(--r); display: grid; place-items: center; position: relative; color: #fff; background: #ffffff10; padding: 0; }
.slot > .n { position: absolute; top: 6px; left: 8px; font-family: var(--title); font-size: 1.4rem; color: var(--glow); text-shadow: 2px 2px 0 var(--ink); z-index: 2; }
.slot.filled { border-style: solid; border-color: var(--ink); background: transparent; }
.slot .scard { width: 100%; height: 100%; }
.slot.right .scard { background: var(--okbg); }
.slot.right::after { content: '✓'; position: absolute; top: 4px; right: 10px; font-weight: 900; font-size: 1.4rem; color: var(--ok); }
.pool { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; min-height: 80px; }
.scard { display: grid; justify-items: center; gap: 6px; padding: 26px 8px 10px; width: 150px; min-height: 140px; background: var(--paper); border: var(--bw) solid var(--ink); border-radius: var(--r); box-shadow: 3px 3px 0 var(--ink); font-weight: 800; font-size: .92rem; line-height: 1.2; text-align: center; }
.pool .scard { padding-top: 10px; }
.scard img.px { width: 56px; height: 56px; }

/* separação */
.sortbox { display: grid; gap: 14px; justify-items: center; }
.sort-item { display: grid; justify-items: center; gap: 6px; background: var(--paper); border: var(--bw) solid var(--ink); border-radius: 16px; padding: 16px 28px; box-shadow: var(--shadow); min-width: 240px; animation: drop .4s ease both; }
.sort-item img.px { width: 112px; height: 112px; }
.sort-item b { font-size: 1.25rem; }
.sort-item .count { font-size: .85rem; font-weight: 800; opacity: .7; }
@keyframes drop { from { transform: translateY(-30px) scale(.9); opacity: 0; } }
.bins { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; width: 100%; }
.bin { display: grid; justify-items: center; gap: 4px; padding: 12px 8px; min-height: 120px; background: var(--paper); border: var(--bw) solid var(--ink); border-radius: var(--r); box-shadow: 3px 3px 0 var(--ink); font-weight: 900; position: relative; overflow: hidden; }
.bin::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 14px; background: var(--binc, var(--paper3)); border-bottom: 3px solid var(--ink); }
.bin img.px { width: 52px; height: 52px; margin-top: 10px; }
.bin .cnt { font-size: .8rem; font-weight: 800; opacity: .7; }

/* rota */
.route-wrap { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: start; }
.grid { display: grid; gap: 4px; background: #5d6573; padding: 8px; border: var(--bw) solid var(--ink); border-radius: var(--r); box-shadow: var(--shadow); width: fit-content; max-width: 100%; }
.cell { width: min(72px, max(30px, calc((100vw - 64px) / var(--gw, 7)))); aspect-ratio: 1; border: 2px solid #4b5160; background: #7b8392; border-radius: 6px; position: relative; padding: 0; display: grid; place-items: center; }
.cell::before { content: ''; position: absolute; left: 50%; top: 50%; width: 30%; height: 4px; background: #fff6; transform: translate(-50%, -50%); }
.cell.trail { background: #9aa3ad; }
.cell.trail::after { content: ''; position: absolute; width: 22%; height: 22%; border-radius: 50%; background: var(--gold); border: 2px solid var(--ink); }
.cell.block { background: #3f4552; }
.cell.block::before { display: none; }
.cell.start { background: #c8a27a; }
.cell img.px { width: 82%; height: 82%; position: relative; z-index: 1; }
.cell.drop.done { background: var(--okbg); }
.cell.drop.done::after { content: '✓'; position: absolute; top: -4px; right: 0; font-weight: 900; color: var(--ok); font-size: 1.2rem; z-index: 2; background: none; border: 0; width: auto; height: auto; }
.cell.here { outline: 4px solid var(--gold); z-index: 3; }
.cell.near { box-shadow: inset 0 0 0 3px #fff; }
.cell .bikeimg { position: absolute; inset: 6%; width: 88%; height: 88%; z-index: 2; filter: drop-shadow(0 0 6px var(--glow)); }
.route-side { display: grid; gap: 10px; }
.drop-list { display: grid; gap: 8px; }
.drop-list div { display: flex; gap: 8px; align-items: center; font-weight: 800; background: var(--paper); border: var(--bw) solid var(--ink); border-radius: var(--r); padding: 6px 10px; }
.drop-list div.done { background: var(--okbg); text-decoration: line-through; }
.drop-list img.px { width: 34px; }
.arrows { display: grid; grid-template-columns: repeat(3, 56px); gap: 6px; justify-content: start; }
.arrows .btn { min-height: 52px; padding: 0; }

/* quem sou eu */
.who-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 16px; align-items: start; }
.clues { display: grid; gap: 10px; }
.clue { background: #fff; border: var(--bw) solid var(--ink); border-radius: var(--r); padding: 12px 14px; font-weight: 800; box-shadow: 3px 3px 0 var(--ink); display: flex; gap: 10px; align-items: flex-start; animation: enter .3s ease both; }
.clue .n { flex: none; width: 32px; height: 32px; border-radius: 6px; background: var(--gold); border: 3px solid var(--ink); display: grid; place-items: center; font-family: var(--title); }
.clue.locked { background: #ffffff22; color: #fff; border-style: dashed; border-color: #ffffff88; box-shadow: none; font-weight: 700; }
.sils { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.sil { display: grid; justify-items: center; gap: 4px; padding: 10px 6px; background: linear-gradient(#cfc9e0, #a9a3c0); border: var(--bw) solid var(--ink); border-radius: var(--r); box-shadow: 3px 3px 0 var(--ink); font-weight: 900; }
.sil img.px { width: 72px; height: 108px; }
.sil.out { opacity: .35; filter: grayscale(1); }
.sil.out::after { content: 'Não é'; font-size: .8rem; }
.pass { text-align: center; display: grid; gap: 14px; justify-items: center; padding: 28px; }
.pass .bigt { font-family: var(--title); font-size: 2rem; }
.secret { font-size: 1.5rem; font-weight: 900; background: #fff; border: var(--bw) solid var(--ink); border-radius: var(--r); padding: 22px; max-width: 640px; box-shadow: var(--shadow); }

/* revelação / ficha */
.reveal { display: grid; grid-template-columns: 300px 1fr; gap: 18px; align-items: start; }
.cardbig { perspective: 900px; }
.cardbig .inner { color: var(--ink); position: relative; background: linear-gradient(180deg, var(--rc, #e0705a) 0 248px, var(--paper) 248px); border: var(--bw) solid var(--ink); border-radius: 16px; box-shadow: 6px 6px 0 var(--ink); padding: 16px; text-align: center; animation: flip .9s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes flip { 0% { transform: rotateY(90deg) scale(.8); filter: grayscale(1); } 60% { filter: grayscale(.5); } 100% { transform: none; filter: none; } }
.cardbig .portrait { position: relative; display: grid; place-items: center; height: 230px; }
.cardbig .portrait img.char { width: 128px; height: 192px; position: relative; z-index: 1; }
.cardbig .portrait img.prop { position: absolute; width: 64px; right: 18px; bottom: 10px; z-index: 2; }
.cardbig .portrait::before { content: ''; position: absolute; width: 190px; height: 190px; border-radius: 50%; background: radial-gradient(#fff9, transparent 70%); }
.cardbig h3 { font-size: 1.7rem; margin: 6px 0 2px; }
.cardbig .job { font-weight: 800; }
.cardbig .quote { font-style: italic; font-weight: 700; margin-top: 10px; font-size: .95rem; }
.facts { display: grid; gap: 10px; }
.fact { background: var(--paper); border: var(--bw) solid var(--ink); border-radius: var(--r); padding: 12px 14px; box-shadow: 3px 3px 0 var(--ink); }
.fact h4 { margin: 0 0 4px; font-family: var(--title); font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
.fact h4 img.px { width: 26px; }
.fact p, .fact ul { margin: 0; font-weight: 600; }
.fact ul { padding-left: 1.2em; }
.fact.curio { background: var(--glow); }

/* escolha */
.options { display: grid; gap: 12px; }
.opt { display: flex; gap: 12px; align-items: center; text-align: left; padding: 12px 16px; min-height: 68px; background: var(--paper); border: var(--bw) solid var(--ink); border-radius: var(--r); box-shadow: 3px 3px 0 var(--ink); font-weight: 800; font-size: 1.05rem; }
.opt .l { flex: none; width: 40px; height: 40px; border-radius: 8px; background: var(--paper3); border: 3px solid var(--ink); display: grid; place-items: center; font-family: var(--title); font-size: 1.2rem; }
.opt.chosen { background: var(--glow); }
.opt.tried { opacity: .7; }

/* reflexão */
.reflect { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.rcard { background: var(--paper); border: var(--bw) solid var(--ink); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); display: grid; gap: 10px; align-content: start; }
.rcard h3 { font-size: 1.25rem; display: flex; gap: 8px; align-items: center; }
.rcard h3 img.px { width: 34px; }
.rcard p { margin: 0; font-weight: 700; }
.rcard.q { background: #e6f1ff; }
.rcard.c { background: var(--glow); }

/* ---------- MAPA ---------- */
.mapwrap { position: relative; width: 100%; aspect-ratio: 200 / 120; border: var(--bw) solid var(--ink); border-radius: 14px; overflow: hidden; box-shadow: 6px 6px 0 #0008; background: #5f6b4f; }
.mapwrap > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; }
.marker { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 2px; border: 0; background: none; padding: 0; z-index: 3; }
.marker .pin { min-width: 150px; max-width: 30vw; padding: 6px 12px; background: var(--paper); border: var(--bw) solid var(--ink); border-radius: 12px; box-shadow: 3px 3px 0 var(--ink); font-weight: 900; font-size: .9rem; line-height: 1.15; text-align: center; }
.marker .st { font-size: .72rem; font-weight: 800; display: block; opacity: .85; margin-top: 2px; }

.medal.on .disc { background: radial-gradient(circle at 35% 30%, #fff6c4, var(--gold) 60%, var(--gold2)); box-shadow: 0 0 14px var(--gold); }

<script>'use strict';
/* ============================================================
   A CIDADE QUE ESQUECEU — Pixel art gerada por código
   Paleta única + objetos (props) + personagens montáveis
   ============================================================ */


const PAL = {
  ink: '#2b2233', inkL: '#4a4058', white: '#fff8ef', cream: '#f3e6cf', paper: '#fbf3e4',
  red: '#d9534f', redD: '#a63d3d', orange: '#f08a3c', orangeD: '#c8652a',
  yellow: '#f4c542', yellowD: '#c99a2a', yellowL: '#fff1a8',
  green: '#5cae6a', greenD: '#3d7f4c', greenL: '#a5d97f',
  teal: '#3fa7a0', tealD: '#2b7a76', tealL: '#8fd6cf',
  blue: '#4a78c9', blueD: '#33549a', blueL: '#9cc1ef', navy: '#2f3f6b',
  purple: '#8f5fb8', purpleL: '#c3a3e0', pink: '#e98bb0', pinkD: '#c0607f',
  brown: '#8b5a2b', brownD: '#5e3c1e', brownL: '#c08a55', tan: '#dcb683',
  grey: '#9aa3ad', greyD: '#5d6573', greyL: '#d3d8de',
  sky: '#a8dcf2', skyD: '#7fbfe0', night: '#27305a', nightD: '#1b2142', glass: '#cfeef7',
  s1: '#f6d3b3', s2: '#e0aa7e', s3: '#b97a4e', s4: '#7d4e31',
  vest: '#c6f05a'
};

/* ---------- utilidades de canvas ---------- */
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function col(k) { return PAL[k] || k; }
function drawOps(ctx, ops, ox = 0, oy = 0) {
  for (const o of ops) { ctx.fillStyle = col(o[0]); ctx.fillRect(ox + o[1], oy + o[2], o[3], o[4]); }
}
/* contorno automático de 1px em volta de tudo que não é transparente */
function outlined(src, color = PAL.ink) {
  const w = src.width, h = src.height;
  const d = src.getContext('2d').getImageData(0, 0, w, h).data;
  const out = mkCanvas(w + 2, h + 2), ctx = out.getContext('2d');
  const img = ctx.createImageData(w + 2, h + 2), o = img.data;
  const op = (x, y) => x >= 0 && y >= 0 && x < w && y < h && d[(y * w + x) * 4 + 3] > 0;
  const rgb = hexRgb(color);
  for (let y = 0; y < h + 2; y++) for (let x = 0; x < w + 2; x++) {
    const sx = x - 1, sy = y - 1, i = (y * (w + 2) + x) * 4;
    if (op(sx, sy)) { const j = (sy * w + sx) * 4; o[i] = d[j]; o[i + 1] = d[j + 1]; o[i + 2] = d[j + 2]; o[i + 3] = 255; }
    else if (op(sx - 1, sy) || op(sx + 1, sy) || op(sx, sy - 1) || op(sx, sy + 1)) { o[i] = rgb[0]; o[i + 1] = rgb[1]; o[i + 2] = rgb[2]; o[i + 3] = 255; }
  }
  ctx.putImageData(img, 0, 0);
  return out;
}
function hexRgb(h) { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
/* filtros de pixel: cinza (esquecido) e silhueta (mistério) */
function filtered(src, mode, amount = 1) {
  const w = src.width, h = src.height, out = mkCanvas(w, h), ctx = out.getContext('2d');
  ctx.drawImage(src, 0, 0);
  const img = ctx.getImageData(0, 0, w, h), d = img.data;
  const sil = hexRgb('#4b4760'), silL = hexRgb('#6d6884');
  for (let i = 0; i < d.length; i += 4) {
    if (!d[i + 3]) continue;
    if (mode === 'gray') {
      const g = d[i] * .3 + d[i + 1] * .59 + d[i + 2] * .11;
      const t = g * .85 + 30;

const SHADE = { red: 'redD', orange: 'orangeD', yellow: 'yellowD', green: 'greenD', teal: 'tealD', blue: 'blueD', purple: 'purpleL', pink: 'pinkD' };
function randomAvatar() { const r = a => a[Math.floor(Math.random() * a.length)]; const o = AVATAR_OPTS; return { skin: r(o.skin), hair: r(o.hair), hairColor: r(o.hairColor), shirt: r(o.shirt), bottom: r(o.bottom), bottomColor: r(o.bottomColor), extra: r(o.extra) }; }
function avatarId(av) {
  if (!av) return 'theo';
  const key = 'av_' + [av.skin, av.hair, av.hairColor, av.shirt, av.bottom, av.bottomColor, av.extra].join('_').replace(/#/g, '');
  if (!LOOKS[key]) {
    const layers = [av.hair === 'cap' ? 'short' : av.hair];
    if (av.hair === 'cap') layers.push('cap');
    if (av.extra === 'glasses') layers.push('glasses');
    if (av.extra === 'band' && av.hair !== 'cap') layers.push('band');
    if (av.bottom === 'skirt') layers.push('skirt');
    layers.push(av.extra === 'freckles' ? 'freckles' : 'smile');
    LOOKS[key] = { S: av.skin, H: av.hairColor, h: av.hairColor, T: av.shirt, U: SHADE[av.shirt] || av.shirt, P: av.bottomColor, F: 'ink', A: av.shirt === 'yellow' ? 'red' : 'yellow', B: av.shirt === 'yellow' ? 'redD' : 'yellowD', G: 'glass', layers };
  }
  return key;
}

function buildCharacter(id, walk) {
  const look = LOOKS[id];
  const grid = (walk ? BODY_WALK : BODY).map(r => r.split(''));
  for (const ln of look.layers) {
    const L = LAYERS[ln];
    for (const row in L) {
      const s = L[row];
      for (let x = 0; x < 16; x++) { const ch = s[x]; if (ch && ch !== '.') grid[row][x] = ch; }
    }
  }
  const c = mkCanvas(16, 24), ctx = c.getContext('2d');
  const map = { k: PAL.ink, S: col(look.S), C: '#e98b8b', T: col(look.T), U: col(look.U || look.T), P: col(look.P), F: col(look.F), H: col(look.H), h: col(look.h || look.H), A: col(look.A || 'red'), B: col(look.B || look.A || 'red'), V: col(look.V || 'vest'), W: col(look.W || 'white'), G: col(look.G || 'yellow'), M: col(look.M || 'brownD'), R: '#a8343f' };
  grid.forEach((row, y) => row.forEach((ch, x) => { if (ch !== '.' && map[ch]) { ctx.fillStyle = map[ch]; ctx.fillRect(x, y, 1, 1); } }));
  return c;
}

/* Névoa: nuvem sonolenta 34x20 (cinza) ou colorida (transformada) */
function buildNevoa(happy) {
  const base = mkCanvas(32, 18), ctx = base.getContext('2d');
  const body = happy ? '#f3f0ff' : '#b9b6c6', shade = happy ? '#d8cff7' : '#99959f';
  drawOps(ctx, [[body, 4, 7, 24, 10], [body, 7, 3, 9, 6], [body, 15, 1, 9, 8], [body, 1, 10, 4, 6], [body, 27, 9, 4, 7], [shade, 3, 14, 26, 3]]);
  const out = outlined(base, happy ? '#7a6bb0' : '#5f5b6e'), o = out.getContext('2d');
  if (happy) {
    drawOps(o, [['ink', 10, 9, 3, 1], ['ink', 20, 9, 3, 1], ['ink', 9, 10, 1, 1], ['ink', 13, 10, 1, 1], ['ink', 19, 10, 1, 1], ['ink', 23, 10, 1, 1], ['pink', 8, 12, 3, 1], ['pink', 22, 12, 3, 1], ['ink', 15, 12, 3, 1], ['ink', 14, 11, 1, 1], ['ink', 18, 11, 1, 1]]);

  }
  return out;
}

/* ---------- cache ---------- */
const SPR = {
  _c: {}, _u: {},
  canvas(name, mode) {
    const key = name + '|' + (mode || '');
    if (this._c[key]) return this._c[key];
    let c;
    if (mode === 'walk') c = LOOKS[name] ? buildCharacter(name, true) : this.canvas(name);
    else if (mode) c = filtered(this.canvas(name), mode);
    else if (name === 'faisca') c = buildFaisca();
    else if (name === 'nevoa') c = buildNevoa(false);
    else if (name === 'nevoaFeliz') c = buildNevoa(true);
    else if (LOOKS[name]) c = buildCharacter(name);
    else if (PROPS[name]) {
      const p = PROPS[name], b = mkCanvas(16, 16);
      drawOps(b.getContext('2d'), p.ops);
      c = outlined(b);
      if (p.top) drawOps(c.getContext('2d'), p.top, 1, 1);
    } else { c = mkCanvas(16, 16); console.warn('sprite ausente', name); }
    this._c[key] = c; return c;
  },
  url(name, mode) {
    const key = name + '|' + (mode || '');
    if (!this._u[key]) this._u[key] = this.canvas(name, mode).toDataURL();
    return this._u[key];
  },
  img(name, mode, cls = 'px', alt = '') {
    return `<img class="${cls}" src="${this.url(name, mode)}" alt="${alt}" draggable="false">`;
  }
};

/* ============================================================
   CENÁRIOS 160x90 em pixel art (desenhados com retângulos)
   ============================================================ */


const SW = 160, SH = 90;
function R(ctx, c, x, y, w, h) { ctx.fillStyle = col(c); ctx.fillRect(x, y, w, h); }
function put(ctx, name, x, y, mode, flip) {
  const s = SPR.canvas(name, mode);
  if (flip) { ctx.save(); ctx.translate(x + s.width, y); ctx.scale(-1, 1); ctx.drawImage(s, 0, 0); ctx.restore(); }
  else ctx.drawImage(s, x, y);
}
function stripes(ctx, c, x, y, w, h, step, vertical = true) {
  for (let i = 0; i < (vertical ? w : h); i += step) vertical ? R(ctx, c, x + i, y, 1, h) : R(ctx, c, x, y + i, w, 1);
}
function checker(ctx, a, b, x, y, w, h, s) {
  for (let j = 0; j < h; j += s) for (let i = 0; i < w; i += s) R(ctx, ((i + j) / s) % 2 ? a : b, x + i, y + j, Math.min(s, w - i), Math.min(s, h - j));
}
function windowPx(ctx, x, y, w, h, sky = 'sky', frame = 'white') {
  R(ctx, 'ink', x - 1, y - 1, w + 2, h + 2); R(ctx, frame, x, y, w, h); R(ctx, sky, x + 2, y + 2, w - 4, h - 4);
  R(ctx, frame, x + (w >> 1) - 1, y, 2, h); R(ctx, frame, x, y + (h >> 1) - 1, w, 2);
  R(ctx, 'white', x + 3, y + 3, 2, 1);
}
function tree(ctx, x, y, s = 1, leaf = 'green') {
  R(ctx, 'brownD', x + 6 * s, y + 14 * s, 3 * s, 10 * s);
  R(ctx, 'ink', x - 1, y + 2 * s - 1, 16 * s + 2, 13 * s + 2);
  R(ctx, leaf, x, y + 2 * s, 16 * s, 13 * s); R(ctx, leaf, x + 3 * s, y, 10 * s, 3 * s);
  R(ctx, 'greenL', x + 3 * s, y + 3 * s, 4 * s, 2 * s); R(ctx, 'greenD', x, y + 12 * s, 16 * s, 3 * s);
}

  R(ctx, 'ink', x - 3, y - 6, w + 6, 7); R(ctx, roof, x - 2, y - 5, w + 4, 5);
  R(ctx, 'brownD', x + (w >> 1) - 3, y + h - 10, 6, 10);
  windowPx(ctx, x + 3, y + 4, 8, 8, lit ? '#ffd65e' : 'sky');
  if (w > 26) windowPx(ctx, x + w - 11, y + 4, 8, 8, lit ? '#ffd65e' : 'sky');
}

/* compõe um cenário com objetos e elenco, devolve canvas */
function composeScene(key, items = [], cast = []) {
  const c = mkCanvas(SW, SH), ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  (SCENES[key] || SCENES.cidade)(ctx);
  for (const it of items) if (!it.hidden && it.prop) put(ctx, it.prop, it.x, it.y, it.mode, it.flip);
  for (const m of cast) put(ctx, m.id, m.x, m.y, m.mode, m.flip);
  return c;
}

const Audio8 = {
  ctx: null, master: null, musicBus: null, sfxBus: null, timer: null, cfg: null, step: 0, brightness: 0,
  vol: { music: .5, sfx: .7, mute: false },
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.connect(this.ctx.destination);
      const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400; lp.connect(this.master);
      this.musicBus = this.ctx.createGain(); this.musicBus.connect(lp);
      this.sfxBus = this.ctx.createGain(); this.sfxBus.connect(this.master);
      this.apply();
    } catch (e) { this.ctx = null; }
  },
  setVolumes(v) { Object.assign(this.vol, v); this.apply(); },
  apply() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.master.gain.setTargetAtTime(this.vol.mute ? 0 : 1, t, .05);
    this.musicBus.gain.setTargetAtTime(this.vol.music * .16, t, .1);
    this.sfxBus.gain.setTargetAtTime(this.vol.sfx * .5, t, .02);
  },
  note(freq, start, dur, type = 'triangle', gain = .3, bus) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, start); g.gain.linearRampToValueAtTime(gain, start + .015);
    g.gain.exponentialRampToValueAtTime(.0008, start + dur);
    o.connect(g); g.connect(bus || this.sfxBus); o.start(start); o.stop(start + dur + .05);
  },
  mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); },
  SCALES: { maj: [0, 2, 4, 7, 9, 12, 14, 16], pent: [0, 3, 5, 7, 10, 12, 15, 17], min: [0, 3, 5, 7, 8, 12, 15, 17] },
  /* música generativa calma; brightness 0..1 deixa mais alegre conforme a cidade se ilumina */
  music(cfg, brightness = 0) {
    this.brightness = brightness;
    if (!this.ctx) { this.cfg = cfg; return; }
    if (this.cfg === cfg && this.timer) return;
    this.stopMusic(); this.cfg = cfg; if (!cfg) return;
    const beat = 60 / cfg.tempo / 2; let next = this.ctx.currentTime + .1; this.step = 0;
    const prog = [0, 5, 3, 4];
    this.timer = setInterval(() => {
      if (!this.ctx) return;
      while (next < this.ctx.currentTime + .4) {
        const s = this.step++, bar = Math.floor(s / 8) % 4, chord = prog[bar];
        const scale = this.SCALES[this.brightness < .25 ? 'min' : cfg.scale] || this.SCALES.maj;
        const root = cfg.root + [0, -7, -3, -5][bar];
        if (s % 8 === 0) this.note(this.mtof(root - 12), next, beat * 7, 'sine', .55, this.musicBus);
        if (s % 4 === 2) this.note(this.mtof(root + scale[2] - 12), next, beat * 3, 'sine', .25, this.musicBus);
        const density = .35 + this.brightness * .35;
        if (Math.random() < density) {
          const idx = (chord + Math.floor(Math.random() * 5)) % scale.length;
          this.note(this.mtof(cfg.root + scale[idx]), next, beat * (1.5 + Math.random() * 2), cfg.wave, cfg.wave === 'square' ? .09 : .2, this.musicBus);
        }
        next += beat;
      }
    }, 120);
  },
  stopMusic() { if (this.timer) clearInterval(this.timer); this.timer = null; this.cfg = null; },
  sfx(name) {
    if (!this.ctx || this.vol.mute) return;
    const t = this.ctx.currentTime, m = this.mtof.bind(this);
    const seq = (notes, type = 'square', g = .18, d = .09) => notes.forEach((n, i) => n && this.note(m(n), t + i * d, d * 2.2, type, g));
    switch (name) {
      case 'click': seq([84], 'square', .06, .03); break;
      case 'select': seq([76, 81], 'square', .07, .04); break;
      case 'found': seq([79, 84, 88], 'triangle', .25, .07); break;
      case 'ok': seq([72, 76, 79, 84], 'triangle', .25, .07); break;
      case 'soft': seq([67, 64], 'sine', .25, .12); break;
      case 'step': seq([60, 67], 'triangle', .15, .05); break;
      case 'reveal': seq([60, 64, 67, 72, 76, 79, 84], 'triangle', .22, .06); break;
      case 'light': seq([88, 0, 91, 0, 96], 'sine', .3, .07); break;
      case 'medal': seq([72, 76, 79, 84, 79, 84, 88], 'square', .1, .07); break;
      case 'page': seq([90], 'sine', .1, .03); break;
      case 'win': seq([60, 64, 67, 72, 67, 72, 76, 79, 84, 88, 91, 96], 'triangle', .22, .08); break;
    }
  }
};

const Voice = {
  enabled: true, rate: .95, voice: null,
  ok() { return 'speechSynthesis' in window; },
  pick() {
    if (!this.ok()) return null;

    this.voice = vs.find(v => /pt[-_]BR/i.test(v.lang)) || vs.find(v => /^pt/i.test(v.lang)) || null;
    return this.voice;
  },
  speak(text) {
    if (!this.enabled || !this.ok() || !text) return;

      const u = new SpeechSynthesisUtterance(text.replace(/[•▸◂]/g, ''));
      u.lang = 'pt-BR'; u.rate = this.rate; if (this.voice || this.pick()) u.voice = this.voice;
      speechSynthesis.speak(u);
    } catch (e) { /* sem voz disponível */ }
  },
  stop() { try { if (this.ok()) speechSynthesis.cancel(); } catch (e) {} }
};

  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sem armazenamento: segue em memória */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const KEY_SET = 'cidade-esqueceu:config', KEY_GAME = 'cidade-esqueceu:partida';

const prefersRM = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
let S = Object.assign({ music: .5, sfx: .7, voice: true, autoRead: false, mute: false, contrast: false, bigText: false, reduceMotion: prefersRM }, Store.get(KEY_SET, {}));
let G = Store.get(KEY_GAME, null);
if (G && G.v !== 1) G = null;
if (G) { G.stars = G.stars || {}; G.bonus = G.bonus || {}; G.clueMode = G.clueMode || 'pass'; G.thanks = G.thanks || []; G.surpriseAt = G.surpriseAt || []; G.seen = G.seen || {}; }

function saveSettings() { Store.set(KEY_SET, S); applySettings(); }
function saveGame() { if (G) Store.set(KEY_GAME, G); }
function applySettings() {
  const H = document.documentElement;
  H.classList.toggle('hc', !!S.contrast);
  H.classList.toggle('bt', !!S.bigText);
  H.classList.toggle('rm', !!S.reduceMotion);
  H.classList.toggle('sala', !!(G && G.mode === 'sala'));
  H.classList.toggle('easy', !!(G && G.diff === 'exp'));
  Audio8.setVolumes({ music: S.music, sfx: S.sfx, mute: S.mute });
  Voice.enabled = !!S.voice && !S.mute;
}

/* ---------- partida ---------- */

  short: { label: 'Curta', time: '10 a 15 min', regions: { casas: ['jorge'], vila: ['ze'], parque: ['marina'] } },
  medium: { label: 'Média', time: '20 a 30 min', regions: { casas: ['cida'], vila: ['katia'], saude: ['lucia'], mercado: ['rafa'], parque: ['joaquim'], caminhos: ['pedro'] } },
  full: { label: 'Completa', time: '35 a 50 min', regions: Object.fromEntries(REGIONS.map(r => [r.id, r.missions.slice()])) }
};
const DIFFS = {
  exp: { label: 'Explorador', desc: 'Para começar (7 a 8 anos): pistas claras, menos itens e a Faísca ajuda quando alguém trava.', options: 3, clues: 4, decoys: 0, pairs: 4, star: 4 },
  inv: { label: 'Investigador', desc: 'O nível padrão (9 a 10 anos): mais itens, opções que confundem, entregas urgentes e dica só quando pedir.', options: 5, clues: 4, decoys: 1, pairs: 6, star: 2 },
  det: { label: 'Detetive', desc: 'Para quem gosta de desafio (11 a 12 anos): mais suspeitos, menos pistas, sequências sem ajuda e dica só depois de tentar.', options: 6, clues: 3, decoys: 2, pairs: 8, star: 1 }
};
const MODES = {
  solo: { label: 'Aventureiro', desc: 'Uma pessoa joga no próprio ritmo, com dicas aos poucos.' },
  juntos: { label: 'Juntos na aventura', desc: 'De 2 a 6 pessoas no mesmo aparelho, revezando a vez e dividindo pistas secretas.' },
  sala: { label: 'Sala de aula', desc: 'Para projetor: letras grandes, a turma conversa e vota, o professor conduz.' }
};

function newGame(cfg) {
  G = { v: 1, mode: cfg.mode, players: cfg.players, diff: cfg.diff, length: cfg.length, clueMode: cfg.clueMode || 'pass', stars: {}, bonus: {}, lastRegion: null, done: {}, album: [], medals: { colaboracao: 0, curiosidade: 0, criatividade: 0, gentileza: 0 }, earned: {}, seen: {}, challenges: [], surprise: 0, surpriseAt: [], turn: 0, current: null, finished: false, mirror: null, thanks: [], prologue: false, started: Date.now() };
  saveGame(); applySettings();
}
function planRegions() { const p = PLANS[G.length].regions; return REGIONS.filter(r => p[r.id]).map(r => ({ ...r, plan: p[r.id] })); }
function planMissions() { return planRegions().flatMap(r => r.plan); }
function doneCount() { return planMissions().filter(m => G.done[m]).length; }
function progress() { const all = planMissions(); return all.length ? doneCount() / all.length : 0; }
function regionOf(mid) { return REGIONS.find(r => r.missions.includes(mid)); }
function regionState(rid) {
  const rs = planRegions(), i = rs.findIndex(r => r.id === rid), r = rs[i];
  if (!r) return 'off';
  if (r.plan.every(m => G.done[m])) return 'done';
  if (i === 0 || rs[i - 1].plan.every(m => G.done[m])) return 'open';
  return 'locked';
}
function lvlOk(it) { if (!it || !it.level) return true; if (it.level === 'inv') return G.diff !== 'exp'; if (it.level === 'det') return G.diff === 'det'; return true; }
function player() { return G.players[G.turn % G.players.length]; }
function isJuntos() { return G && G.mode === 'juntos' && G.players.length > 1; }
function avatarOf(p) { return avatarId((p || player()).avatar); }
function starsHTML(n, max = 3) { return `<span class="stars" aria-label="${n || 0} de ${max} estrelas">${Array.from({ length: max }, (_, i) => `<i class="${i < (n || 0) ? 'on' : ''}">★</i>`).join('')}</span>`; }
const MISSION_ORDER = ['cida', 'jorge', 'ze', 'katia', 'lucia', 'benedito', 'zefa', 'rafa', 'marina', 'joaquim', 'denise', 'pedro'];
/* código das pistas para celulares: missão(2) + jogadores(1) + pistas(1) + verificador(1) */
function clueCode(mid, n, c) { const d = String(MISSION_ORDER.indexOf(mid) + 1).padStart(2, '0') + n + c; const chk = [...d].reduce((a, x, i) => a + (+x) * (i + 3), 0) % 10; return d + chk; }
function readClueCode(code) {
  code = String(code).replace(/\D/g, ''); if (code.length !== 5) return null;
  const d = code.slice(0, 4), chk = [...d].reduce((a, x, i) => a + (+x) * (i + 3), 0) % 10;
  if (chk !== +code[4]) return null;
  const mid = MISSION_ORDER[+d.slice(0, 2) - 1], n = +d[2], c = +d[3];
  if (!mid || n < 2 || n > 6 || c < 1 || !MISSIONS[mid].steps.some(s => s.t === 'whoami')) return null;
  return { mid, n, c };
}
function clueAssign(n, c) { const a = Array.from({ length: n }, () => []); for (let i = 0; i < c; i++) a[i % n].push(i); return a; }

/* ---------- medalhas ---------- */
function addMedal(key, n = 1, once) {
  if (once) { if (G.seen[once]) return; G.seen[once] = 1; }
  G.medals[key] = (G.medals[key] || 0) + n;
  const M = MEDALS[key];
  if (!G.earned[key] && G.medals[key] >= M.need) {
    G.earned[key] = true; Audio8.sfx('medal');
    toast(`Medalha conquistada: <b>${M.name}</b>!`, M.prop);
  }
  saveGame();
}

/* ---------- interface ---------- */
const app = () => $('#app');
let cleanupFns = [];
function onCleanup(fn) { cleanupFns.push(fn); }
function go(fn, ...args) {
  Voice.stop(); cleanupFns.forEach(f => { try { f(); } catch (e) {} }); cleanupFns = [];
  closeModal(); setFoot('');
  const a = app(); a.innerHTML = ''; a.className = '';
  fn(...args);
  window.scrollTo({ top: 0, behavior: 'auto' });
  const h = a.querySelector('h1, h2'); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
}
function setFoot(html) {
  let f = $('#foot');
  if (!html) { if (f) f.remove(); return; }
  if (!f) { f = document.createElement('div'); f.id = 'foot'; f.className = 'footbar'; document.body.appendChild(f); }
  f.innerHTML = `<div class="in">${html}</div>`;
}
function toast(html, prop) {
  let t = $('#toasts'); if (!t) { t = document.createElement('div'); t.id = 'toasts'; t.setAttribute('aria-live', 'polite'); document.body.appendChild(t); }
  const d = document.createElement('div'); d.className = 'toast';
  d.innerHTML = (prop ? SPR.img(prop) : '') + `<span>${html}</span>`;
  t.appendChild(d); setTimeout(() => d.remove(), 3500);
}
function modal(html, { onClose, label = 'Janela' } = {}) {
  closeModal();
  const bg = document.createElement('div'); bg.className = 'modal-bg'; bg.id = 'modal';
  bg.innerHTML = `<div class="modal panel" role="dialog" aria-modal="true" aria-label="${esc(label)}"><button class="ibtn x" data-close aria-label="Fechar">${ICON.close}</button>${html}</div>`;
  document.body.appendChild(bg);
  bg._onClose = onClose;
  bg.addEventListener('click', e => { if (e.target === bg || e.target.closest('[data-close]')) closeModal(); });
  const f = bg.querySelector('button:not(.x), input, select'); (f || bg.querySelector('.x')).focus();
  return bg;
}
function closeModal() { const m = $('#modal'); if (m) { const cb = m._onClose; m.remove(); if (cb) cb(); } }
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#modal')) closeModal(); else if ($('.pause')) $('.pause').click(); } });

/* direcional na tela (segura para andar sem parar) */
function dpadHTML(actionLabel) {
  return `<div class="dpad" aria-label="Controle para andar">
    <button class="dp up" data-d="0,-1" aria-label="Andar para cima">▲</button>
    <button class="dp left" data-d="-1,0" aria-label="Andar para a esquerda">◀</button>
    <button class="dp act" data-act="1">${esc(actionLabel)}</button>
    <button class="dp right" data-d="1,0" aria-label="Andar para a direita">▶</button>
    <button class="dp down" data-d="0,1" aria-label="Andar para baixo">▼</button></div>`;
}
function wireDpad(root, move, act) {
  $$('.dp[data-d]', root).forEach(b => {
    const [dx, dy] = b.dataset.d.split(',').map(Number); let t = null;
    const stop = () => { clearInterval(t); t = null; };
    b.addEventListener('pointerdown', e => { e.preventDefault(); move(dx, dy); stop(); t = setInterval(() => move(dx, dy), 110); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, stop));
    b.addEventListener('click', e => { if (e.detail === 0) move(dx, dy); });
    onCleanup(stop);
  });
  const a = $('.dp[data-act]', root); if (a) a.onclick = act;
}
function sparkle(el, n = 10) {
  if (S.reduceMotion || !el) return;
  const r = el.getBoundingClientRect();
  for (let i = 0; i < n; i++) {
    const s = document.createElement('i'); s.className = 'sparkle';
    s.style.left = (r.left + r.width / 2) + 'px'; s.style.top = (r.top + r.height / 2) + 'px'; s.style.position = 'fixed'; s.style.zIndex = 40;
    const a = Math.random() * Math.PI * 2, d = 30 + Math.random() * 50;
    s.style.setProperty('--dx', Math.cos(a) * d + 'px'); s.style.setProperty('--dy', Math.sin(a) * d + 'px');
    document.body.appendChild(s); setTimeout(() => s.remove(), 900);
  }
}
function confetti(n = 60) {
  if (S.reduceMotion) return;
  const cs = ['#f4c542', '#e98bb0', '#8fd6cf', '#a5d97f', '#c3a3e0', '#f08a3c', '#fff1a8'];
  for (let i = 0; i < n; i++) {
    const c = document.createElement('i'); c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = pick(cs);
    c.style.animationDuration = (2 + Math.random() * 2.5) + 's'; c.style.animationDelay = Math.random() * .8 + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 5500);
  }
}
function speakerInfo(who) {
  if (who === 'faisca') return { img: SPR.url('faisca'), name: NAMES.faisca };
  if (who === 'nevoa') return { img: SPR.url('nevoa'), name: NAMES.nevoa };
  if (who === 'nevoaFeliz') return { img: SPR.url('nevoaFeliz'), name: 'Nuvem das Lembranças' };
  if (who[0] === '?') { const id = who.slice(1); return G.album.includes(id) ? { img: SPR.url(id), name: CHARACTERS[id].name } : { img: SPR.url(id, 'sil'), name: '???' }; }
  return { img: SPR.url(who), name: (CHARACTERS[who] && CHARACTERS[who].name) || NAMES[who] || who };
}
function bubbleHTML(who, text) {
  const s = speakerInfo(who);
  return `<div class="bubble"><div class="who"><div class="face"><img class="px" src="${s.img}" alt=""></div><b>${esc(s.name)}</b></div><div class="text" aria-live="polite"><p>${esc(text)}</p></div></div>`;
}
function sceneHTML(key, { items = [], cast = [], faded = true, alt = '', extra = '', cap = false } = {}) {
  const url = composeScene(key, items, cast).toDataURL();
  return `<div class="scene ${faded ? 'faded' : ''} ${cap ? 'cap' : ''}"><img class="bg px" src="${url}" alt="${esc(alt)}"><div class="fogl"></div>${extra}</div>`;
}
const pct = (v, total) => (v / total * 100).toFixed(3) + '%';
function hotStyle(it) {
  const w = it.w || 18, h = it.h || 18, pad = 2;
  return `left:${pct(it.x - pad, SW)};top:${pct(it.y - pad, SH)};width:${pct(w + pad * 2, SW)};height:${pct(h + pad * 2, SH)}`;
}

function promptHTML(text) {
  return `<div class="prompt"><img class="px" src="${SPR.url('faisca')}" alt=""><p>${esc(text)}</p><button class="ibtn" data-say aria-label="Ouvir em voz alta">${ICON.voice}</button></div>`;
}
function feedback(box, kind, html, prop) {
  box.innerHTML = `<div class="feedback ${kind}" role="status">${prop ? SPR.img(prop) : ''}<div>${html}</div></div>`;
}
function wireSay(root, fn) { $$('[data-say]', root).forEach(b => b.onclick = () => { Audio8.init(); Voice.enabled = S.voice && !S.mute; if (!S.voice) toast('A leitura em voz alta está desligada nas configurações.'); Voice.speak(fn()); }); }

/* personagem do jogador andando pela cena */
const AV_FLOOR = { sala: [40, 64], cozinha: [40, 64], quarto: [40, 64], parque: [30, 64], salaaula: [38, 64], rua: [28, 40] };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function makeWalker(ctx, sceneKey, items, onExamine) {
  const sc = $('.scene', ctx.stage); if (!sc) return null;
  const [y0, y1] = AV_FLOOR[sceneKey] || [40, 64];
  const st = { x: 2, y: y1 - 2, busy: false, flip: false, frame: 0, timer: null };
  sc.insertAdjacentHTML('beforeend', `<img class="px avatar" alt="Seu personagem" src="${SPR.url(avatarOf())}"><span class="av-tip" aria-hidden="true">Examinar</span>`);
  const img = $('.avatar', sc), tip = $('.av-tip', sc);
  const place = dur => { img.style.transitionDuration = dur + 's'; img.style.left = pct(st.x, SW); img.style.top = pct(st.y, SH); img.style.width = pct(16, SW); img.classList.toggle('flip', st.flip); };
  const anim = on => { clearInterval(st.timer); if (on) st.timer = setInterval(() => { st.frame ^= 1; img.src = SPR.url(avatarOf(), st.frame ? 'walk' : null); }, 130); else { st.frame = 0; img.src = SPR.url(avatarOf()); } };
  const nearest = () => {
    let best = null, bd = 1e9; const cx = st.x + 8, cy = st.y + 14;
    items.forEach((it, k) => { const d = Math.hypot(it.x + (it.w || 18) / 2 - cx, it.y + (it.h || 18) / 2 - cy); if (d < bd) { bd = d; best = k; } });
    return bd < 30 ? best : null;
  };
  const highlight = () => {
    $$('.hot.near', sc).forEach(h => h.classList.remove('near'));
    const k = nearest(); if (k === null) { tip.style.display = 'none'; return; }
    const it = items[k], h = $(`.hot[data-k="${k}"]`, sc); if (h) h.classList.add('near');
    tip.style.display = 'block'; tip.style.left = pct(it.x + (it.w || 18) / 2, SW); tip.style.top = pct(Math.max(0, it.y - 7), SH);
  };
  const walkTo = (x, y, cb) => {
    x = clamp(Math.round(x), 0, SW - 16); y = clamp(Math.round(y), y0, y1);
    const d = Math.hypot(x - st.x, y - st.y); if (x !== st.x) st.flip = x < st.x; st.x = x; st.y = y;
    const dur = S.reduceMotion ? 0 : Math.min(1.1, d / 95);
    anim(dur > .05); place(dur); st.busy = true;
    clearTimeout(st.to); st.to = setTimeout(() => { anim(false); st.busy = false; st.target = null; highlight(); if (cb) cb(); }, dur * 1000 + 40);
  };
  const goItem = (it, cb) => {
    if (st.busy && st.target === it) return;
    st.target = it;
    const left = it.x - 14 > 0 && (it.x - 14 >= st.x - 40 || it.x + (it.w || 18) + 2 > SW - 16);
    walkTo(left ? it.x - 14 : it.x + (it.w || 18) - 2, it.y + (it.h || 18) - 22, cb);
  };
  sc.addEventListener('click', e => {
    if (e.target.closest(".hot")) return; st.target = null;
    const r = sc.getBoundingClientRect();
    walkTo((e.clientX - r.left) / r.width * SW - 8, (e.clientY - r.top) / r.height * SH - 20);
  });
  const onKey = e => {
    if ($('#modal') || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
    const m = { ArrowUp: [0, -5], ArrowDown: [0, 5], ArrowLeft: [-6, 0], ArrowRight: [6, 0], w: [0, -5], s: [0, 5], a: [-6, 0], d: [6, 0] }[e.key];
    if (m) { e.preventDefault(); walkTo(st.x + m[0], st.y + m[1]); return; }
    if ((e.key === 'Enter' || e.key === ' ') && !document.activeElement.closest('button')) {
      const k = nearest(); if (k !== null) { e.preventDefault(); onExamine(k); }
    }
  };
  document.addEventListener('keydown', onKey);
  onCleanup(() => { document.removeEventListener('keydown', onKey); clearInterval(st.timer); clearTimeout(st.to); });
  place(0); setTimeout(highlight, 50);
  const step = (dx, dy) => { st.target = null; walkTo(st.x + dx * 5, st.y + dy * 4); };
  const act = () => { const k = nearest(); if (k !== null) onExamine(k); else toast('Chegue mais perto de um objeto para examinar.', 'faisca'); };
  const pad = document.createElement('div'); pad.innerHTML = dpadHTML('Ver'); sc.after(pad.firstElementChild);
  wireDpad(sc.parentElement, step, act);
  return { goItem, refresh: () => { img.src = SPR.url(avatarOf()); }, get busy() { return st.busy; } };
}

const STEPS = {
  /* ---------------- DIÁLOGO ---------------- */
  dialog(step, ctx) {
    let i = 0;
    const lines = step.lines;
    ctx.stage.innerHTML = sceneHTML(step.scene, { items: step.items, cast: step.cast, faded: step.faded ?? !ctx.colored, alt: 'Cena da história', cap: true }) + `<div id="bub"></div>`;
    const show = () => {
      const l = lines[i];
      $('#bub', ctx.stage).innerHTML = bubbleHTML(l.who, l.text);
      ctx.setPrimary(i < lines.length - 1 ? 'Continuar' : 'Vamos lá!');
      if (S.autoRead) Voice.speak(l.text);
    };
    show(); ctx.complete();
    return {
      speak: () => lines[i].text,
      primary() { if (i < lines.length - 1) { i++; Audio8.sfx('page'); show(); return true; } return false; },
      back() { if (i > 0) { i--; show(); return true; } return false; }
    };
  },

  /* ---------------- INVESTIGAÇÃO ---------------- */
  investigate(step, ctx) {
    const items = step.items.filter(lvlOk);
    const clues = items.filter(i => i.clue);
    const found = new Set(), checked = new Set();
    const hots = items.map((it, k) => `<button class="hot" data-k="${k}" style="${hotStyle(it)}" aria-label="Examinar: ${esc(it.label)}"></button>`).join('');
    ctx.stage.innerHTML = promptHTML(step.prompt) +
      `<div class="two"><div>${sceneHTML(step.scene, { items, cast: step.cast, faded: !ctx.colored, extra: hots, alt: 'Cena para investigar' })}<p class="walk-help">Toque num objeto, use o controle ou as setas do teclado para andar. Perto de um objeto, toque em Examinar (ou Enter).</p><div id="fb" style="margin-top:12px"></div></div>
      <aside class="notebook"><h3>Caderno de pistas</h3><p class="muted" style="margin:0 0 8px;font-weight:700">Pistas: <b id="cnt">0</b> de ${clues.length}</p><ul id="nb">${clues.map(() => '<li class="empty"><span></span></li>').join('')}</ul></aside></div>`;
    wireSay(ctx.stage, () => step.prompt);
    const fb = $('#fb', ctx.stage), nb = $('#nb', ctx.stage);
    const examine = k => {
      const b = $(`.hot[data-k="${k}"]`, ctx.stage), it = items[k];
      ctx.activity();
      if (it.clue) {
        if (found.has(it)) { feedback(fb, 'info', `<b>${esc(it.label)}</b> já está no caderno.`, it.prop); return; }
        found.add(it); b.classList.add('found'); b.classList.remove('hint-pulse');
        if (it.prop && !ctx.colored) b.insertAdjacentHTML('afterbegin', `<img class="px colorize" src="${SPR.url(it.prop)}" alt="">`);
        b.insertAdjacentHTML('beforeend', `<span class="badge">${found.size}</span>`);
        Audio8.sfx('found'); sparkle(b);
        feedback(fb, 'ok', `<b class="kind">Pista encontrada!</b>${esc(it.text)}`, it.prop);
        const li = nb.children[found.size - 1]; li.className = ''; li.innerHTML = `${it.prop ? SPR.img(it.prop) : ''}<span>${esc(it.label)}</span>`;
        $('#cnt', ctx.stage).textContent = found.size;
        if (S.autoRead) Voice.speak(it.text);
        if (found.size === clues.length) { ctx.complete(); setTimeout(() => toast('Todas as pistas encontradas! Toque em <b>Continuar</b>.', 'faisca'), 600); }
        else ctx.nextTurn();
      } else {
        b.classList.add('checked'); Audio8.sfx('select');
        feedback(fb, 'info', `<b>${esc(it.label)}</b>: ${esc(it.text)}`, it.prop);
        if (!checked.has(it)) { checked.add(it); addMedal('curiosidade', 1, 'cur:' + ctx.id + ':' + it.label); }
        if (S.autoRead) Voice.speak(it.text);
      }
    };
    const W = makeWalker(ctx, step.scene, items, examine);
    ctx.onTurn(() => W && W.refresh());
    $$('.hot', ctx.stage).forEach(b => b.onclick = e => {
      e.stopPropagation(); const k = +b.dataset.k;
      if (W) W.goItem(items[k], () => examine(k)); else examine(k);
    });
    return {
      speak: () => step.prompt,
      hint() { ctx.usedHint(); const k = items.findIndex(i => i.clue && !found.has(i)); if (k >= 0) { const b = $(`.hot[data-k="${k}"]`, ctx.stage); b.classList.add('hint-pulse'); b.focus(); } }
    };
  },

  /* ---------------- ANTES E DEPOIS (diferenças) ---------------- */
  spot(step, ctx) {
    const diffs = step.diffs.filter(lvlOk), found = new Set();
    const before = diffs.map(d => ({ prop: d.prop, x: d.x, y: d.y }));
    const after = diffs.filter(d => d.after).map(d => ({ prop: d.after, x: d.x, y: d.y }));
    const hots = side => diffs.map((d, k) => `<button class="hot" data-k="${k}" style="${hotStyle(d)}" aria-label="${side}: ${esc(d.label)}"></button>`).join('');
    ctx.stage.innerHTML = promptHTML(step.prompt) +

  /* ---------------- SEQUÊNCIA ---------------- */
  sequence(step, ctx) {

      }

  /* ---------------- ROTA ---------------- */
  route(step, ctx) {
    const g = step.grids[G.diff] || step.grids.inv;
    const urgentIdx = G.diff !== 'exp' && step.urgent ? g.drops.findIndex(d => d.prop === step.urgent) : -1;
    let pos = g.start.slice(); const trail = [pos.slice()], delivered = new Set();
    const key = (x, y) => x + ',' + y;
    const blockAt = (x, y) => g.blocks.find(b => b.x === x && b.y === y);
    const dropAt = (x, y) => g.drops.findIndex(d => d.x === x && d.y === y);
    ctx.stage.innerHTML = promptHTML(step.prompt) + `<div class="route-wrap"><div class="grid" id="grid" style="grid-template-columns:repeat(${g.w},auto);--gw:${g.w}" role="grid" aria-label="Mapa das entregas"></div>
      <div class="route-side"><div class="drop-list" id="dl"></div><div class="arrows" aria-label="Setas para mover">
        <span></span><button class="btn" data-mv="0,-1" aria-label="Para cima">▲</button><span></span>
        <button class="btn" data-mv="-1,0" aria-label="Para a esquerda">◀</button><button class="btn" id="undo" aria-label="Desfazer">${ICON.undo}</button><button class="btn" data-mv="1,0" aria-label="Para a direita">▶</button>
        <span></span><button class="btn" data-mv="0,1" aria-label="Para baixo">▼</button><span></span></div>
        <div id="fb"></div></div></div>`;
    wireSay(ctx.stage, () => step.prompt);
    const fb = $('#fb', ctx.stage);
    const draw = () => {
      const tr = new Set(trail.map(p => key(p[0], p[1])));
      let html = '';
      for (let y = 0; y < g.h; y++) for (let x = 0; x < g.w; x++) {
        const b = blockAt(x, y), d = dropAt(x, y), here = pos[0] === x && pos[1] === y;
        const near = Math.abs(pos[0] - x) + Math.abs(pos[1] - y) === 1;
        const st = x === g.start[0] && y === g.start[1];
        let cls = 'cell', inner = '', label = `Rua ${x + 1}, ${y + 1}`;
        if (b) { cls += ' block'; inner = SPR.img(b.prop); label = b.prop === 'agua' ? 'Rua alagada' : 'Rua em obra'; }
        else if (d >= 0) { cls += ' drop' + (delivered.has(d) ? ' done' : ''); inner = SPR.img(g.drops[d].prop); label = 'Entrega: ' + g.drops[d].label + (delivered.has(d) ? ' (entregue)' : ''); }
        else if (st) { cls += ' start'; inner = SPR.img('barraca'); label = 'Mercado (saída)'; }
        if (tr.has(key(x, y)) && !b && d < 0 && !st) cls += ' trail';
        if (here) { cls += ' here'; inner += `<img class="px bikeimg" src="${SPR.url('bike')}" alt="">`; label += ' (a bicicleta está aqui)'; }
        if (near && !b) cls += ' near';
        html += `<button class="${cls}" data-x="${x}" data-y="${y}" aria-label="${esc(label)}">${inner}</button>`;
      }
      $('#grid', ctx.stage).innerHTML = html;
      $('#dl', ctx.stage).innerHTML = g.drops.map((d, i) => `<div class="${delivered.has(i) ? 'done' : ''}">${SPR.img(d.prop)}<span>${esc(d.label)}${i === urgentIdx ? ' <b class="urg">URGENTE</b>' : ''}</span></div>`).join('') + `<small style="color:#fff;font-weight:700">Pedaladas: ${trail.length - 1}</small>`;
      $$('.cell', ctx.stage).forEach(c => c.onclick = () => move(+c.dataset.x, +c.dataset.y));
    };
    const move = (x, y) => {
      ctx.activity();
      if (x < 0 || y < 0 || x >= g.w || y >= g.h) return;
      if (Math.abs(pos[0] - x) + Math.abs(pos[1] - y) !== 1) {
        if (!(pos[0] === x && pos[1] === y)) feedback(fb, 'info', 'A bicicleta anda uma rua de cada vez. Toque num quadrado vizinho (com borda branca).');
        return;
      }
      const b = blockAt(x, y);
      if (b) { Audio8.sfx('soft'); ctx.mistake(); feedback(fb, 'soft', esc(step.blockText[b.prop]), b.prop); return; }
      pos = [x, y]; trail.push(pos.slice()); Audio8.sfx('click');
      const d = dropAt(x, y);
      if (d >= 0 && !delivered.has(d) && urgentIdx >= 0 && d !== urgentIdx && !delivered.has(urgentIdx)) {
        Audio8.sfx('soft'); ctx.mistake(); feedback(fb, 'soft', esc(step.urgentText), 'farmacia'); draw(); return;
      }
      if (d >= 0 && !delivered.has(d)) {
        delivered.add(d); Audio8.sfx('found');

        if (delivered.size === g.drops.length) { draw(); feedback(fb, 'ok', `<b class="kind">Tudo entregue!</b>${esc(step.ok)}`, 'bike'); Audio8.sfx('ok'); ctx.complete(); return; }
        ctx.nextTurn();

      const h = $('.cell.here', ctx.stage); if (h && document.activeElement && document.activeElement.classList.contains('cell')) h.focus();
    };
    $$('[data-mv]', ctx.stage).forEach(b => b.onclick = () => { const [dx, dy] = b.dataset.mv.split(',').map(Number); move(pos[0] + dx, pos[1] + dy); });
    $('#undo', ctx.stage).onclick = () => { if (trail.length > 1) { trail.pop(); pos = trail[trail.length - 1].slice(); Audio8.sfx('page'); draw(); } };
    const onKey = e => {
      const m = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[e.key];
      if (m && !$('#modal')) { e.preventDefault(); move(pos[0] + m[0], pos[1] + m[1]); }
    };
    document.addEventListener('keydown', onKey); onCleanup(() => document.removeEventListener('keydown', onKey));
    draw();
    return {
      speak: () => step.prompt + ' Entregas: ' + g.drops.map(d => d.label).join(', '),
      hint() {
        const seen = new Map([[key(...pos), null]]), q = [pos.slice()];
        ctx.usedHint();
        while (q.length) {
          const [x, y] = q.shift(); const d = dropAt(x, y);

            let c = key(x, y), prev = seen.get(c); while (prev && prev !== key(...pos)) { c = prev; prev = seen.get(c); }
            const [hx, hy] = c.split(',').map(Number); const cell = $(`.cell[data-x="${hx}"][data-y="${hy}"]`, ctx.stage);
            if (cell) { cell.classList.add('hint-pulse'); cell.focus(); }

          }

            const nx = x + dx, ny = y + dy, k2 = key(nx, ny);

            seen.set(k2, key(x, y)); q.push([nx, ny]);
          }

      }
    };
  },

  /* ---------------- QUEM SOU EU? ---------------- */
  whoami(step, ctx) {

    const others = shuffle(Object.keys(CHARACTERS).filter(c => c !== step.char)).slice(0, D.options - 1);
    const opts = shuffle([step.char, ...others]); const out = new Set();
    const team = isJuntos(), phone = team && G.clueMode === 'phone';
    const assign = team ? clueAssign(G.players.length, clues.length) : [];
    const owner = i => team ? G.players[assign.findIndex(a => a.includes(i))] : null;
    let shown = team ? 0 : 1, phase = team ? (phone ? 'phone' : 'pass') : 'guess', pi = 0, opened = false;
    const L = 'ABCDEF';

      if (phase === 'phone') return renderPhone();
