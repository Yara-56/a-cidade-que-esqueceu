      const clueBox = (c, i) => {
        if (team && !opened) { const o = owner(i); return `<div class="clue locked"><span class="n">${i + 1}</span><span>Pista secreta de <b>${esc(o.name)}</b>: conte com suas palavras!</span></div>`; }
        return i < shown || opened ? `<div class="clue"><span class="n">${i + 1}</span><span>${esc(c)}</span></div>` : `<div class="clue locked"><span class="n">${i + 1}</span><span>Pista escondida</span></div>`;
      };
      ctx.stage.innerHTML = promptHTML(team ? 'Cada um conta a sua pista com as próprias palavras, sem mostrar! Depois, decidam juntos: quem é?' : teacher ? 'Professor(a): revele as pistas uma a uma. A turma conversa e vota em quem é.' : 'Quem sou eu? Leia as pistas e escolha a silhueta certa. Quanto menos pistas usar, mais estrelas!')
        + `<div class="who-grid"><div class="clues" aria-live="polite">${clues.map(clueBox).join('')}
        ${!team && shown < clues.length ? `<button class="btn" id="more">${ICON.hint} Revelar a próxima pista</button>` : ''}
        ${team && !opened ? `<button class="btn" id="open">Esqueceram? Mostrar todas as pistas</button>` : ''}
        ${phone ? `<p style="color:#fff;font-weight:800;margin:0">Código das pistas: <span class="code">${clueCode(ctx.id, G.players.length, clues.length)}</span></p>` : ''}</div>
        <div><div class="sils">${opts.map((c, i) => `<button class="sil ${out.has(c) ? 'out' : ''}" data-c="${c}" ${out.has(c) ? 'disabled' : ''} aria-label="Silhueta ${L[i]}">${SPR.img(c, 'sil')}<span>Silhueta ${L[i]}</span></button>`).join('')}</div><div id="fb" style="margin-top:12px"></div></div></div>`;
      wireSay(ctx.stage, () => team && !opened ? 'Cada um conta a sua pista.' : clues.slice(0, opened ? clues.length : shown).join('. '));
      const more = $('#more', ctx.stage); if (more) more.onclick = () => { shown++; if (shown > 2) ctx.mistake(); Audio8.sfx('page'); ctx.activity(); render(); if (S.autoRead) Voice.speak(clues[shown - 1]); };
      const op = $('#open', ctx.stage); if (op) op.onclick = () => { opened = true; ctx.usedHint(); Audio8.sfx('page'); render(); };
      $$('.sil', ctx.stage).forEach(b => b.onclick = () => {
        ctx.activity(); const c = b.dataset.c;
        if (c === step.char) {
          Audio8.sfx('reveal'); b.innerHTML = SPR.img(c) + `<span>${esc(CHARACTERS[c].name)}!</span>`; b.style.background = 'var(--glow)'; sparkle(b, 16);
          if (G.mode !== 'solo') addMedal('colaboracao', 1, 'col:' + ctx.id);
          feedback($('#fb', ctx.stage), 'ok', `<b class="kind">Descobriram!</b>É ${esc(CHARACTERS[c].name)}, ${esc(CHARACTERS[c].job.toLowerCase())}.`, CHARACTERS[c].prop);
          $$('.sil', ctx.stage).forEach(x => x.disabled = true);
          ctx.complete();
        } else {
          out.add(c); Audio8.sfx('soft'); ctx.mistake();
          const r = REGIONS.find(r => r.id === CHARACTERS[c].region);
          render();
          feedback($('#fb', ctx.stage), 'soft', `Ainda não! Essa pessoa trabalha em outro lugar da cidade${G.diff === 'exp' ? ` (${esc(r.name)})` : ''}. ${!team && shown < clues.length ? 'Que tal revelar mais uma pista?' : 'Conversem de novo sobre as pistas.'}`);
        }
      });
    };
    const renderPass = () => {
      if (pi >= G.players.length) { phase = 'guess'; render(); return; }
      const p = G.players[pi], mine = assign[pi];
      ctx.stage.innerHTML = `<div class="panel pass"><img class="px" src="${SPR.url(avatarOf(p))}" style="width:64px;height:96px" alt="">
        <div class="bigt">Pistas secretas!</div><p style="font-weight:800;margin:0">Passe o aparelho para <b>${esc(p.name)}</b>. Só ${esc(p.name)} olha a tela!</p>
        <div id="sec"></div><button class="btn primary big" id="see">Sou eu! Ver minha pista</button>
        <p class="muted" style="font-weight:700;margin:0">Jogador ${pi + 1} de ${G.players.length}</p></div>`;
      $('#see', ctx.stage).onclick = () => {
        Audio8.sfx('page');
        $('#sec', ctx.stage).innerHTML = mine.length
          ? mine.map(i => `<div class="secret">“${esc(clues[i])}”</div>`).join('<br>') + `<p style="font-weight:800">Guarde na memória e conte com suas palavras depois!</p>`
          : `<div class="secret">Você é a <b>pessoa detetive-chefe</b>! Ouça todas as pistas, organize a conversa e ajude o grupo a decidir.</div>`;
        const s = $('#see', ctx.stage); s.textContent = pi + 1 < G.players.length ? 'Esconder e passar adiante' : 'Esconder e conversar juntos';
        s.onclick = () => { pi++; Audio8.sfx('select'); renderPass(); };
        s.focus();
      };
    };
    const renderPhone = () => {
      const code = clueCode(ctx.id, G.players.length, clues.length);
      ctx.stage.innerHTML = `<div class="panel pass"><div class="bigt">Pistas no celular</div>
        <p style="font-weight:800;margin:0;max-width:640px">Cada jogador abre o link do jogo no próprio celular, toca em <b>“Tenho um código de pista”</b>, digita o código e escolhe o seu número.</p>
        <div class="code big">${code}</div>
        <div class="row center">${G.players.map((p, i) => `<span class="tag" style="background:${p.color}">${i + 1}. ${esc(p.name)}</span>`).join('')}</div>
        <button class="btn primary big" id="ready">Todo mundo viu a sua pista</button>
        <p class="muted" style="font-weight:700;margin:0">Funciona até numa chamada de vídeo: quem está longe vê a pista no celular e conta para o grupo.</p></div>`;
      $('#ready', ctx.stage).onclick = () => { phase = 'guess'; Audio8.sfx('select'); render(); };
    };
    render();
    return {
      speak: () => phase === 'pass' ? 'Passe o aparelho para ' + (G.players[pi] ? G.players[pi].name : '') : phase === 'phone' ? 'Cada jogador abre o jogo no celular e digita o código.' : clues.slice(0, opened ? clues.length : shown).join('. '),
      hint() {
        if (phase !== 'guess') return;
        ctx.usedHint();
        if (!team && shown < clues.length) { shown++; render(); return; }
        if (team && !opened) { opened = true; render(); return; }
        const w = opts.find(c => c !== step.char && !out.has(c)); if (w) { out.add(w); render(); feedback($('#fb', ctx.stage), 'info', 'A Faísca tirou uma silhueta que não é a certa.', 'faisca'); }
      }
    };
  },

  /* ---------------- JOGO DA MEMÓRIA ---------------- */
  memory(step, ctx) {
    const pairs = shuffle(step.pairs).slice(0, DIFFS[G.diff].pairs);
    const label = id => (step.labels && step.labels[id]) || (CHARACTERS[id] ? CHARACTERS[id].name : NAMES[id] || '');
    const cards = shuffle(pairs.flatMap((p, i) => [{ id: p[0], pair: i }, { id: p[1], pair: i }]));
    const open = [], done = new Set(); let moves = 0, lock = false;
    const cols = cards.length <= 8 ? 4 : 6;
    ctx.stage.innerHTML = promptHTML(step.prompt) + `<div class="memo" style="--cols:${cols}">${cards.map((c, i) => `<button class="mem" data-i="${i}" data-p="${c.pair}" aria-label="Carta ${i + 1} virada para baixo"><span class="back">${SPR.img('faisca')}</span><span class="front">${SPR.img(c.id)}<small>${esc(step.labels ? '' : label(c.id))}</small></span></button>`).join('')}</div>
      <p style="color:#fff;font-weight:800;margin:0;text-align:center">Jogadas: <span id="mv">0</span> · Pares: <span id="pr">0</span> de ${pairs.length}</p><div id="fb"></div>`;
    wireSay(ctx.stage, () => step.prompt);
    const fb = $('#fb', ctx.stage);
    const flip = (i, on) => { const b = $(`.mem[data-i="${i}"]`, ctx.stage); b.classList.toggle('up', on); b.setAttribute('aria-label', on ? 'Carta: ' + (label(cards[i].id) || cards[i].id) : `Carta ${i + 1} virada para baixo`); };
    $$('.mem', ctx.stage).forEach(b => b.onclick = () => {
      const i = +b.dataset.i; if (lock || done.has(i) || open.includes(i)) return;
      ctx.activity(); flip(i, true); open.push(i); Audio8.sfx('page');
      if (open.length === 2) {
        moves++; $('#mv', ctx.stage).textContent = moves;
        const [x, y] = open;
        if (cards[x].pair === cards[y].pair) {
          done.add(x); done.add(y); open.length = 0; Audio8.sfx('found');
          [x, y].forEach(k => $(`.mem[data-i="${k}"]`, ctx.stage).classList.add('done'));
          $('#pr', ctx.stage).textContent = done.size / 2;
          const p = pairs[cards[x].pair];
          feedback(fb, 'ok', `<b class="kind">Par encontrado!</b>${esc(step.labels ? label(p[0]) + ': ' + 'os dois são do mesmo tipo.' : label(p[0]) + ' usa isso no trabalho.')}`, p[1]);
          if (done.size === cards.length) { Audio8.sfx('ok'); ctx.complete(); } else ctx.nextTurn();
        } else {
          lock = true; if (moves > pairs.length + 3) ctx.mistake();
          setTimeout(() => { flip(x, false); flip(y, false); open.length = 0; lock = false; ctx.nextTurn(); }, 950);
        }
      }
    });
    return {
      speak: () => step.prompt,
      hint() {
        ctx.usedHint(); const p = cards.findIndex((c, i) => !done.has(i)); if (p < 0) return;
        const q = cards.findIndex((c, i) => i !== p && c.pair === cards[p].pair);
        [p, q].forEach(k => flip(k, true)); lock = true;
        setTimeout(() => { [p, q].forEach(k => { if (!done.has(k)) flip(k, false); }); lock = false; }, 1200);
      }
    };
  },

  /* ---------------- ENIGMA DE LÓGICA ---------------- */
  logic(step, ctx) {
    const perm = shuffle(step.options.map((_, i) => i)), O = perm.map(i => step.options[i]), ans = step.answer.map(a => perm.indexOf(a));
    const P = step.people, grid = P.map(() => O.map(() => 0));
    ctx.stage.innerHTML = promptHTML(step.prompt) + `<div class="two"><div class="clues">${step.clues.map((c, i) => `<div class="clue"><span class="n">${i + 1}</span><span>${esc(c)}</span></div>`).join('')}</div>
      <div><div class="logic" role="grid" style="--cols:${O.length}"><span></span>${O.map(o => `<b class="lh">${esc(o)}</b>`).join('')}
      ${P.map((p, r) => `<b class="lr">${esc(p)}</b>${O.map((o, c) => `<button class="lc" data-r="${r}" data-c="${c}" aria-label="${esc(p)} e ${esc(o)}: vazio"></button>`).join('')}`).join('')}</div>
      <p style="color:#fff;font-weight:700;margin:8px 0">Toque uma vez para ✓ (é isso), duas para ✗ (não é), três para limpar.</p>
      <div class="row"><button class="btn primary" id="chk">Conferir</button></div><div id="fb" style="margin-top:10px"></div></div></div>`;
    wireSay(ctx.stage, () => step.prompt + ' ' + step.clues.join(' '));
    const fb = $('#fb', ctx.stage);
    const paint = () => $$('.lc', ctx.stage).forEach(b => { const v = grid[b.dataset.r][b.dataset.c]; b.textContent = ['', '✓', '✗'][v]; b.className = 'lc ' + ['', 'yes', 'no'][v]; b.setAttribute('aria-label', `${P[b.dataset.r]} e ${O[b.dataset.c]}: ${['vazio', 'sim', 'não'][v]}`); });
    $$('.lc', ctx.stage).forEach(b => b.onclick = () => {
      ctx.activity(); const r = +b.dataset.r, c = +b.dataset.c; grid[r][c] = (grid[r][c] + 1) % 3;
      if (grid[r][c] === 1 && G.diff === 'exp') { grid[r].forEach((_, k) => { if (k !== c) grid[r][k] = 2; }); grid.forEach((row, k) => { if (k !== r) row[c] = 2; }); }
      Audio8.sfx('click'); paint();
    });
    $('#chk', ctx.stage).onclick = () => {
      ctx.activity();
      const picks = grid.map(row => row.indexOf(1)), ok = picks.filter((v, i) => v === ans[i]).length;
      if (picks.some((v, i) => v < 0 || row1(i) > 1)) { feedback(fb, 'info', 'Cada pessoa precisa de exatamente um ✓ na sua linha.'); return; }
      if (ok === P.length) { Audio8.sfx('ok'); feedback(fb, 'ok', `<b class="kind">Enigma resolvido!</b>${P.map((p, i) => `${esc(p)}: ${esc(O[ans[i]])}`).join(' · ')}`, 'estrela'); $$('.lc', ctx.stage).forEach(b => b.disabled = true); ctx.complete(); }
      else { Audio8.sfx('soft'); ctx.mistake(); feedback(fb, 'soft', `<b>${ok} de ${P.length}</b> certas. Releia as pistas: qual delas resolve uma pessoa sozinha?`); ctx.nextTurn(); }
    };
    const row1 = i => grid[i].filter(v => v === 1).length;
    return {
      speak: () => step.prompt + ' ' + step.clues.join(' '),
      hint() {
        ctx.usedHint(); const r = P.findIndex((_, i) => grid[i][ans[i]] !== 1); if (r < 0) return;
        grid[r] = O.map((_, c) => c === ans[r] ? 1 : 2); paint(); feedback(fb, 'info', `A Faísca resolveu: <b>${esc(P[r])}</b>.`, 'faisca');
      }
    };
  },

  /* ---------------- REVELAÇÃO (ficha do personagem) ---------------- */
  reveal(step, ctx) {
    const c = CHARACTERS[step.char], r = REGIONS.find(x => x.id === c.region);
    unlockCharacter(step.char);
    ctx.stage.innerHTML = `<div class="reveal">${charCardHTML(step.char)}
      <div class="facts">
        <div class="fact"><h4>${SPR.img('livro')} História</h4><p>${esc(c.story)}</p></div>
        <div class="fact"><h4>${SPR.img('relogio')} Rotina</h4><ul>${c.routine.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
        <div class="fact"><h4>${SPR.img('coracao')} Por que importa</h4><p>${esc(c.contribution)}</p></div>
        <div class="fact"><h4>${SPR.img('cone')} Desafios do trabalho</h4><p>${esc(c.challenges)}</p></div>
        <div id="cur"><button class="btn" id="curio">${SPR.img('oculos')} Ver uma curiosidade</button></div>
      </div></div>`;
    Audio8.sfx('reveal'); sparkle($('.cardbig', ctx.stage), 20);
    $('#curio', ctx.stage).onclick = () => {
      $('#cur', ctx.stage).innerHTML = `<div class="fact curio"><h4>${SPR.img('oculos')} Curiosidade</h4><p>${esc(c.curiosity)}</p></div>`;
      addMedal('curiosidade', 1, 'curio:' + step.char); Audio8.sfx('found');
      if (S.autoRead) Voice.speak(c.curiosity);
    };
    ctx.complete();
    toast(`<b>${esc(c.name)}</b> entrou no álbum da cidade!`, c.prop);
    return { speak: () => `${c.name}, ${c.job}. ${c.story} ${c.contribution} ${c.quote}` };
  },

  /* ---------------- ESCOLHA ---------------- */
  choice(step, ctx) {
    const tried = new Set(); const L = 'ABC';
    ctx.stage.innerHTML = `<div class="two"><div>${sceneHTML(step.scene, { items: step.items, cast: step.cast, faded: false, alt: 'Cena da situação' })}</div>
      <div class="stage">${promptHTML(step.prompt)}${G.mode === 'sala' ? '<p style="color:#fff;font-weight:800;margin:0">Turma: levantem a mão para cada opção. O professor toca na mais votada.</p>' : isJuntos() ? `<p style="color:#fff;font-weight:800;margin:0">Cada pessoa dá sua opinião. Depois, ${esc(player().name)} toca na escolha do grupo.</p>` : ''}
      <div class="options">${step.options.map((o, i) => `<button class="opt" data-o="${i}"><span class="l">${L[i]}</span><span>${esc(o.text)}</span></button>`).join('')}</div><div id="fb"></div></div></div>`;
    wireSay(ctx.stage, () => step.prompt + ' ' + step.options.map((o, i) => L[i] + ': ' + o.text).join('. '));
    $$('.opt', ctx.stage).forEach(b => b.onclick = () => {
      ctx.activity(); const o = step.options[+b.dataset.o]; tried.add(+b.dataset.o);
      $$('.opt', ctx.stage).forEach(x => { x.classList.remove('chosen'); if (tried.has(+x.dataset.o)) x.classList.add('tried'); });
      b.classList.add('chosen'); b.classList.remove('tried');
      if (o.kind) { Audio8.sfx('ok'); addMedal('gentileza', 1, 'kind:' + ctx.id); sparkle(b); }
      else Audio8.sfx('soft');
      feedback($('#fb', ctx.stage), o.kind ? 'ok' : 'soft', `<b class="kind">${o.kind ? 'Escolha gentil!' : 'O que acontece:'}</b>${esc(o.result)}${o.kind ? '' : '<br><span style="font-weight:800">Quer pensar em outra escolha? Pode tentar de novo.</span>'}`, o.kind ? 'coracao' : null);
      if (S.autoRead) Voice.speak(o.result);
      ctx.complete();
    });
    return { speak: () => step.prompt + ' ' + step.options.map((o, i) => 'Opção ' + L[i] + ': ' + o.text).join('. '), hint() { ctx.usedHint(); feedback($('#fb', ctx.stage), 'info', 'Pense: qual escolha ajuda a pessoa que trabalha e mostra que você reparou nela?', 'faisca'); } };
  },

  /* ---------------- REFLEXÃO ---------------- */
  reflect(step, ctx) {
    const accepted = G.challenges.includes(step.challenge);
    ctx.stage.innerHTML = `<div class="reflect">
      <div class="rcard"><h3>${SPR.img('lampada')} O que descobrimos</h3><p>${esc(step.learn)}</p></div>
      <div class="rcard q"><h3>${SPR.img('carta')} Para conversar</h3><p>${esc(step.question)}</p><button class="btn" id="talk">${G.mode === 'solo' ? 'Pensei sobre isso' : 'Conversamos sobre isso'}</button></div>
      <div class="rcard c"><h3>${SPR.img('estrela')} Desafio da vida real</h3><p>${esc(step.challenge)}</p><button class="btn primary" id="acc" ${accepted ? 'disabled' : ''}>${accepted ? 'Desafio aceito ✓' : 'Aceitamos o desafio!'}</button></div>
    </div>`;
    $('#talk', ctx.stage).onclick = e => { e.target.disabled = true; e.target.textContent = 'Boa conversa ✓'; Audio8.sfx('select'); addMedal(G.mode === 'solo' ? 'curiosidade' : 'colaboracao', 1, 'talk:' + ctx.id); };
    $('#acc', ctx.stage).onclick = e => {
      e.target.disabled = true; e.target.textContent = 'Desafio aceito ✓'; Audio8.sfx('light'); sparkle(e.target, 14);
      if (!G.challenges.includes(step.challenge)) G.challenges.push(step.challenge);
      addMedal('gentileza', 1, 'acc:' + ctx.id);
    };
    ctx.setPrimary('Concluir missão'); ctx.complete();
    return { speak: () => `${step.learn} Para conversar: ${step.question} Desafio da vida real: ${step.challenge}` };
  }
};

function unlockCharacter(id) { if (!G.album.includes(id)) { G.album.push(id); saveGame(); } }
function charCardHTML(id) {
  const c = CHARACTERS[id], r = REGIONS.find(x => x.id === c.region);
  return `<div class="cardbig" style="--rc:${r.color}"><div class="inner"><div class="portrait"><img class="px char" src="${SPR.url(id)}" alt="${esc(c.name)}"><img class="px prop" src="${SPR.url(c.prop)}" alt=""></div>
    <h3>${esc(c.name)}</h3><div class="job">${esc(c.job)}</div><span class="tag">${esc(r.name)}</span><p class="quote">“${esc(c.quote)}”</p></div></div>`;
}

function turnInner() { return `<span class="dot" style="background:${player().color}"><img class="px" src="${SPR.url(avatarOf())}" alt=""></span>Vez de ${esc(player().name)}`; }
function updateTurnChip() {
  const t = $('#turn'); if (!t || !isJuntos()) return;

function resumeGame() {

const HAIR_NAMES = { short: 'Curto', curly: 'Cacheado', afro: 'Black power', long: 'Longo', pony: 'Rabo de cavalo', braids: 'Tranças', bun: 'Coque', cap: 'Boné' };
const COLOR_NAMES = { '#22161d': 'Preto', '#5a3520': 'Castanho', '#b5562c': 'Ruivo', '#e8c25a': 'Loiro', '#cfcfd6': 'Grisalho', '#8f5fb8': 'Roxo', red: 'Vermelho', orange: 'Laranja', yellow: 'Amarelo', green: 'Verde', teal: 'Verde-água', blue: 'Azul', purple: 'Roxo', pink: 'Rosa', navy: 'Azul-marinho', greyD: 'Cinza', brown: 'Marrom', greenD: 'Verde-escuro' };
const EXTRA_NAMES = { none: 'Nada', glasses: 'Óculos', band: 'Faixa', freckles: 'Sardas' };

function screenSetup() {
  const cfg = { mode: 'solo', count: 2, names: PLAYER_DEFAULT.slice(), diff: 'inv', length: 'medium', clueMode: 'pass', avatars: PLAYER_DEFAULT.map(() => randomAvatar()), who: 0 };

    app().innerHTML = `<div class="screen setup">${dots}${body}<div class="row" style="margin-top:20px;justify-content:space-between"><button class="btn" id="back">${ICON.back} Voltar</button><button class="btn primary big" id="fwd">${st === steps - 1 ? 'Começar!' : 'Próximo'} ${ICON.next}</button></div></div>`;
    $$('[data-v]').forEach(b => b.onclick = () => { Audio8.sfx('select'); cfg[view] = b.dataset.v; draw(); $(`[data-v="${b.dataset.v}"]`).focus(); });
    $$('[data-n]').forEach(b => b.onclick = () => { saveNames(); cfg.count = +b.dataset.n; Audio8.sfx('select'); draw(); $(`[data-n="${b.dataset.n}"]`).focus(); });

    $$('[data-who]').forEach(b => b.onclick = () => { cfg.who = +b.dataset.who; Audio8.sfx('select'); draw(); });
    $$('.av-opt').forEach(b => b.onclick = () => { cfg.avatars[cfg.who][b.dataset.k] = b.dataset.val; Audio8.sfx('click'); draw(); const f = $(`.av-opt[data-k="${b.dataset.k}"][data-val="${b.dataset.val}"]`); if (f) f.focus(); });
    const rnd = $('#rand'); if (rnd) rnd.onclick = () => { cfg.avatars[cfg.who] = randomAvatar(); Audio8.sfx('select'); draw(); $('#rand').focus(); };
    const big = $('#avbig'); if (big && !S.reduceMotion) { let f = 0; const t = setInterval(() => { if (!document.body.contains(big)) return clearInterval(t); f ^= 1; big.src = SPR.url(avatarId(cfg.avatars[cfg.who]), f ? 'walk' : null); }, 380); }
    $('#back').onclick = () => { saveNames(); Audio8.sfx('click'); if (st === 0) go(screenTitle); else { st--; draw(); } };
    $('#fwd').onclick = () => {
      saveNames(); Audio8.sfx('select');
      if (view === 'avatar' && cfg.mode === 'juntos' && cfg.who < cfg.count - 1) { cfg.who++; draw(); return; }
      if (st < steps - 1) { st++; draw(); return; }
      const players = cfg.mode === 'juntos' ? Array.from({ length: cfg.count }, (_, i) => ({ name: (cfg.names[i] || '').trim() || PLAYER_DEFAULT[i], color: PLAYER_COLORS[i], avatar: cfg.avatars[i] }))
        : cfg.mode === 'sala' ? [{ name: 'Turma', color: PLAYER_COLORS[0], avatar: cfg.avatars[0] }] : [{ name: 'Você', color: PLAYER_COLORS[0], avatar: cfg.avatars[0] }];
      if (cfg.mode === 'sala' && !S._salaSet) { S.contrast = true; S._salaSet = true; saveSettings(); }
      newGame({ mode: cfg.mode, players, diff: cfg.diff, length: cfg.length, clueMode: cfg.mode === 'juntos' ? cfg.clueMode : 'pass' });
      go(screenPrologue, 0);
    };
    if (view === 'avatar' && cfg.mode === 'juntos') $('#fwd').innerHTML = (cfg.who < cfg.count - 1 ? `Próximo jogador` : 'Próximo') + ' ' + ICON.next;
  };
  const saveNames = () => $$('.player-row input').forEach((inp, i) => cfg.names[i] = inp.value);
  draw();
}

/* ---------------- MAPA ---------------- */
const MAP_W = 200, MAP_H = 120;
const DISTRICTS = {
  casas: { x: 0, y: 0, w: 64, h: 54, mx: 17, my: 9 }, vila: { x: 74, y: 0, w: 52, h: 54, mx: 50, my: 9 }, saude: { x: 136, y: 0, w: 64, h: 54, mx: 83, my: 9 },
  mercado: { x: 0, y: 66, w: 64, h: 54, mx: 17, my: 59 }, parque: { x: 74, y: 66, w: 52, h: 54, mx: 50, my: 59 }, caminhos: { x: 136, y: 66, w: 64, h: 54, mx: 83, my: 59 }
};
function drawMap() {
  const c = mkCanvas(MAP_W, MAP_H), ctx = c.getContext('2d');
  const lit = rid => regionState(rid) === 'done';
  R(ctx, '#8fc47a', 0, 0, MAP_W, MAP_H);
  for (let i = 0; i < 70; i++) R(ctx, '#7fb46a', (i * 37) % MAP_W, (i * 53) % MAP_H, 2, 1);
  /* ruas */
  R(ctx, 'greyD', 0, 55, MAP_W, 10); R(ctx, 'greyD', 65, 0, 8, MAP_H); R(ctx, 'greyD', 127, 0, 8, MAP_H);
  for (let x = 2; x < MAP_W; x += 10) R(ctx, 'white', x, 59, 5, 1);
  for (let y = 2; y < MAP_H; y += 10) { R(ctx, 'white', 68, y, 1, 5); R(ctx, 'white', 130, y, 1, 5); }
  R(ctx, 'greyL', 0, 54, MAP_W, 1); R(ctx, 'greyL', 0, 65, MAP_W, 1);
  /* Bairro das Casas */
  const L1 = lit('casas');
  house(ctx, 6, 22, 16, 14, 'yellowL', 'red', L1); house(ctx, 28, 18, 14, 18, 'tealL', 'blueD', L1); house(ctx, 48, 24, 12, 12, 'pink', 'brown', L1);
  house(ctx, 10, 44, 18, 9, 'cream', 'redD', L1); house(ctx, 38, 44, 18, 9, 'greenL', 'orangeD', L1);
  /* Vila do Aprendizado: escola */
  const L2 = lit('vila');
  R(ctx, 'ink', 79, 19, 43, 31); R(ctx, '#f0dc8c', 80, 20, 41, 29); R(ctx, 'ink', 77, 15, 47, 6); R(ctx, 'orangeD', 78, 16, 45, 4);
  for (let i = 0; i < 5; i++) for (let j = 0; j < 2; j++) windowPx(ctx, 83 + i * 8, 24 + j * 10, 5, 6, L2 ? 'yellowL' : 'sky');
  R(ctx, 'brownD', 97, 42, 7, 7); R(ctx, 'greyD', 100, 4, 1, 12); R(ctx, L2 ? 'red' : 'grey', 101, 4, 7, 5);
  /* Estação da Saúde */
  const L3 = lit('saude');
  R(ctx, 'ink', 143, 17, 36, 30); R(ctx, 'white', 144, 18, 34, 28); R(ctx, 'tealD', 144, 18, 34, 5);
  R(ctx, L3 ? 'green' : 'grey', 158, 26, 6, 14); R(ctx, L3 ? 'green' : 'grey', 154, 30, 14, 6);
  windowPx(ctx, 147, 27, 5, 6, L3 ? 'yellowL' : 'sky'); windowPx(ctx, 170, 27, 5, 6, L3 ? 'yellowL' : 'sky'); R(ctx, 'tealD', 158, 41, 6, 5);
  house(ctx, 184, 30, 12, 16, 'pink', 'brown', L3);
  /* Mercado */
  const L4 = lit('mercado');
  for (const [x, cc] of [[4, 'red'], [24, 'green'], [44, 'blue']]) {
    R(ctx, 'ink', x - 1, 77, 18, 6); for (let i = 0; i < 16; i += 4) R(ctx, i % 8 ? 'white' : cc, x + i, 78, 4, 4);
    R(ctx, 'brownD', x, 83, 1, 14); R(ctx, 'brownD', x + 15, 83, 1, 14); R(ctx, 'ink', x - 1, 92, 18, 5); R(ctx, 'brownL', x, 93, 16, 3);
    R(ctx, 'red', x + 2, 90, 3, 2); R(ctx, 'orange', x + 7, 90, 3, 2); R(ctx, 'greenL', x + 11, 90, 3, 2);
  }
  R(ctx, L4 ? 'yellowL' : 'greyL', 6, 104, 52, 2);
  /* Parque */
  R(ctx, 'ink', 95, 92, 28, 18); R(ctx, 'blue', 96, 93, 26, 16); R(ctx, 'blueL', 100, 97, 8, 1);
  tree(ctx, 78, 70, 1); tree(ctx, 100, 68, .9, 'greenD'); tree(ctx, 78, 92, .8);
  R(ctx, 'tan', 74, 86, 20, 4);
  /* Caminhos */
  const L6 = lit('caminhos');
  R(ctx, 'greyL', 140, 72, 56, 44); checker(ctx, 'greyL', '#c3c9d0', 140, 72, 56, 44, 6);
  R(ctx, 'ink', 159, 85, 18, 18); R(ctx, 'blueL', 160, 86, 16, 16); R(ctx, 'white', 166, 90, 4, 8);
  for (const [x, y] of [[144, 74], [190, 74], [144, 104], [190, 104], [167, 74]]) { R(ctx, 'greyD', x, y, 1, 10); R(ctx, 'greyD', x, y, 3, 1); R(ctx, L6 ? 'yellow' : '#7a7f96', x + 2, y + 1, 2, 2); if (L6) R(ctx, '#fff1a866', x, y + 3, 5, 3); }
  for (let i = 0; i < 4; i++) R(ctx, 'white', 136 + i * 2, 57, 1, 6);
  /* cinza nas regiões ainda esquecidas + névoa nas bloqueadas */
  const d = ctx.getImageData(0, 0, MAP_W, MAP_H);
  for (const r of planRegions().concat(REGIONS.filter(x => !PLANS[G.length].regions[x.id]).map(x => ({ ...x, off: true })))) {
    const D = DISTRICTS[r.id], st = r.off ? 'off' : regionState(r.id);
    const amt = st === 'done' ? 0 : st === 'open' ? .75 : 1;
    if (!amt) continue;
    for (let y = D.y; y < D.y + D.h; y++) for (let x = D.x; x < D.x + D.w; x++) {
      const i = (y * MAP_W + x) * 4, gr = d.data[i] * .3 + d.data[i + 1] * .59 + d.data[i + 2] * .11, t = gr * .8 + 40;
      for (let k = 0; k < 3; k++) d.data[i + k] += (t - d.data[i + k]) * amt;
    }
  }
  ctx.putImageData(d, 0, 0);
  for (const r of REGIONS) {
    const st = PLANS[G.length].regions[r.id] ? regionState(r.id) : 'off';
    if (st !== 'locked' && st !== 'off') continue;
    const D = DISTRICTS[r.id];
    ctx.fillStyle = st === 'off' ? 'rgba(30,34,60,.55)' : 'rgba(215,211,228,.55)';
    ctx.fillRect(D.x, D.y, D.w, D.h);
    const cloud = (cx, cy, s) => {
      ctx.fillStyle = st === 'off' ? 'rgba(60,64,90,.7)' : 'rgba(236,233,244,.9)';
      ctx.fillRect(cx, cy + 3 * s, 16 * s, 4 * s); ctx.fillRect(cx + 2 * s, cy + s, 6 * s, 3 * s); ctx.fillRect(cx + 7 * s, cy, 6 * s, 4 * s);
      ctx.fillStyle = st === 'off' ? 'rgba(20,22,40,.5)' : 'rgba(170,166,190,.8)'; ctx.fillRect(cx, cy + 7 * s, 16 * s, 1);
    };
    cloud(D.x + 4, D.y + 14, 1.2); cloud(D.x + D.w - 26, D.y + 26, 1.4); cloud(D.x + D.w / 2 - 10, D.y + 38, 1);
  }
  return c;
}

      ${prog < 1 ? `<img class="px map-nevoa" src="${SPR.url('nevoa')}" alt="" style="left:${60 - prog * 30}%;top:${36 + prog * 10}%;opacity:${.95 - prog * .5}">` : ''}</div>
    <div class="map-ctrl">${dpadHTML('Entrar')}<p id="near" class="near-msg">Ande com o controle ou com as setas. Chegue perto de uma região e toque em Entrar.</p></div>
    <div class="map-list">${planRegions().map(r => { const st = regionState(r.id); return `<button class="mitem ${st === 'done' ? 'done' : ''}" data-r="${r.id}" ${st === 'locked' ? 'aria-disabled="true"' : ''}><span class="rdot" style="background:${st === 'locked' ? '#b9b6c6' : r.color}"></span><span class="grow"><b>${esc(r.name)}</b><small>${{ done: 'Restaurada ✓', open: 'Toque para explorar', locked: 'Coberta pela Névoa' }[st]}</small></span>${st === 'locked' ? '' : ICON.next}</button>`; }).join('')}</div>
    <div class="map-foot"><div class="say">${bubbleHTML('faisca', say)}</div>
      ${allDone ? `<button class="btn primary big" id="finale">${SPR.img('estrela')} Grande final</button>` : ''}</div></div>`;
  wireHud();
  let walking = false;
  $$('[data-r]').forEach(m => m.onclick = () => {
    const rid = m.dataset.r, st = regionState(rid); Audio8.sfx('click');
    if (walking) return;
    if (st === 'locked') { const prev = regs[regs.findIndex(r => r.id === rid) - 1]; toast(`A Névoa ainda cobre esta região. Termine o <b>${esc(prev.name)}</b> primeiro!`, 'nevoa'); Audio8.sfx('soft'); return; }
    const av = $('#mav'), D = DISTRICTS[rid]; walking = true;
    if (S.reduceMotion || !av) { G.lastRegion = rid; saveGame(); go(screenRegion, rid); return; }
    const cur = parseFloat(av.style.left); av.classList.toggle('flip', D.mx < cur);
    let f = 0; const t = setInterval(() => { f ^= 1; av.src = SPR.url(avatarOf(), f ? 'walk' : null); }, 120);
    av.style.transitionDuration = '.75s'; av.style.left = D.mx + '%'; av.style.top = (D.my + 22) + '%';
    setTimeout(() => { clearInterval(t); G.lastRegion = rid; saveGame(); go(screenRegion, rid); }, 800);
  });
  /* andar livremente pelo mapa */
  const av = $('#mav'); const mp = { x: parseFloat(av.style.left), y: parseFloat(av.style.top) };
  const nearRegion = () => { let best = null, bd = 1e9; for (const r of regs) { const D = DISTRICTS[r.id]; const d = Math.hypot(D.mx - mp.x, (D.my + 22 - mp.y) * .6); if (d < bd) { bd = d; best = r; } } return bd < 13 ? best : null; };
  const showNear = () => {
    const r = nearRegion(), msg = $('#near'), btn = $('.map-ctrl .dp[data-act]');
    btn.disabled = !r;
    msg.innerHTML = r ? `Você chegou em: <b>${esc(r.name)}</b>. ${regionState(r.id) === 'locked' ? 'A Névoa ainda cobre esta região.' : 'Toque em Entrar!'}` : 'Ande com o controle ou com as setas. Chegue perto de uma região e toque em Entrar.';
  };
  let mf = 0, mt = null;
  const mapMove = (dx, dy) => {
    mp.x = clamp(mp.x + dx * 2.2, 3, 97); mp.y = clamp(mp.y + dy * 3.6, 12, 98);
    av.style.transitionDuration = '.12s'; av.style.left = mp.x + '%'; av.style.top = mp.y + '%';
    if (dx) av.classList.toggle('flip', dx < 0);
    mf ^= 1; av.src = SPR.url(avatarOf(), mf ? 'walk' : null); clearTimeout(mt); mt = setTimeout(() => { av.src = SPR.url(avatarOf()); }, 220);
    showNear();
  };
  const enter = () => { const r = nearRegion(); if (!r) return; const m = $(`.marker[data-r="${r.id}"]`); G.lastRegion = r.id; saveGame(); if (regionState(r.id) === 'locked') m.click(); else go(screenRegion, r.id); };
  wireDpad($('.map-ctrl'), mapMove, enter);
  const mapKey = e => {
    if ($('#modal') || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
    const m = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] }[e.key];
    if (m) { e.preventDefault(); mapMove(...m); }
    else if ((e.key === 'Enter' || e.key === ' ') && !document.activeElement.closest('button') && nearRegion()) { e.preventDefault(); enter(); }
  };
  document.addEventListener('keydown', mapKey); onCleanup(() => document.removeEventListener('keydown', mapKey));
  showNear();
  if (allDone) $('#finale').onclick = () => { G.current = { mission: '_finale' }; saveGame(); go(screenFinale); };
  /* carta surpresa: depois de algumas missões */
  const dc = doneCount();
  if (dc > 0 && !allDone && dc % 2 === 1 && !G.surpriseAt.includes(dc)) { G.surpriseAt.push(dc); saveGame(); setTimeout(openSurprise, 700); }
}

/* ---------------- REGIÃO ---------------- */
function screenRegion(rid) {

      }).join('')}

        : `<div class="mitem" style="opacity:.6">${SPR.img('caderno', 'sil')}<span class="grow"><b>Desafio extra</b><small>Termine uma missão para liberar</small></span></div>`) : ''}</div></div></div>`;

  $$('.mitem[data-b]').forEach(b => b.onclick = () => { Audio8.sfx('select'); const id = '_bonus_' + b.dataset.b; G.current = { mission: id, step: 0 }; saveGame(); go(renderMission, id, 0); });
  setFoot(`<button class="btn" id="say" aria-label="Ouvir">${ICON.voice}<span class="lbl">Ouvir</span></button><span class="grow"></span><button class="btn" id="bk">${ICON.map} Voltar ao mapa</button>`);
  $('#say').onclick = () => Voice.speak(r.intro + ' ' + r.faisca);
  $('#bk').onclick = () => go(screenMap);
}

/* ---------------- MISSÃO (executor de etapas) ---------------- */
let RUN = null;
function renderMission(id, idx) {
  const M = MISSIONS[id], step = M.steps[idx], r = regionOf(id);
  if (!step) { finishMission(id); return; }
  const prev = G.current && G.current.mission === id ? G.current : {};
  G.current = { mission: id, step: idx, mistakes: prev.mistakes || 0, hints: prev.hints || 0 }; saveGame();
  Audio8.music(r.music, progress());
  const revealIdx = M.steps.findIndex(s => s.t === 'reveal');
  const known = G.album.includes(M.char);
  const label = { dialog: 'História', investigate: 'Investigação', spot: 'Antes e depois', match: 'Associação', sequence: 'Sequência', sort: 'Separação', route: 'Rota', whoami: 'Quem sou eu?', reveal: 'Descoberta', choice: 'Decisão', reflect: 'Reflexão', thanks: 'Mural do Obrigado', mirror: 'A última carta', memory: 'Desafio extra · Memória', logic: 'Desafio extra · Lógica' }[step.t];
  app().innerHTML = `<div class="screen">${hudHTML()}
    <div class="mhead"><div><div class="where">${esc(r.name)} · ${label}</div><h2>${esc(M.title)}</h2></div>
    <div class="dots" aria-label="Etapa ${idx + 1} de ${M.steps.length}">${M.steps.map((_, i) => `<i class="${i < idx ? 'done' : i === idx ? 'now' : ''}"></i>`).join('')}</div></div>
    <div class="stage" id="stage"></div></div>`;
  wireHud();
  const sala = G.mode === 'sala';
  setFoot(`${sala ? `<div class="teacher"><span>Professor</span><button class="btn small" id="tback">${ICON.back} Etapa anterior</button><button class="btn small" id="tpause">${ICON.pause} Pausar</button><button class="btn small" id="trep">${ICON.repeat} Repetir</button></div>` : `<button class="btn" id="say" aria-label="Ouvir">${ICON.voice}<span class="lbl">Ouvir</span></button>`}
    <button class="btn" id="hint" aria-label="Dica">${ICON.hint}<span class="lbl">Dica</span></button><span class="grow"></span>
    ${sala ? `<button class="btn small" id="tskip">Pular ${ICON.next}</button>` : ''}
    <button class="btn primary big" id="prim" disabled>Continuar ${ICON.next}</button>`);
  RUN = { id, idx, mistakes: 0, done: false, ctrl: null, idle: null, hinted: false, turnFns: [], auto: false };
  const prim = $('#prim'), hintBtn = $('#hint');
  const ctx = {
    stage: $('#stage'), id, idx, step, colored: idx > revealIdx,
    complete() { RUN.done = true; prim.disabled = false; prim.classList.add('ready'); },
    setPrimary(t) { prim.innerHTML = `${esc(t)} ${ICON.next}`; },
    mistake() { RUN.mistakes++; G.current.mistakes++; saveGame(); refreshHint(); },
    usedHint() { if (!RUN.auto) { G.current.hints++; saveGame(); } },
    onTurn(fn) { RUN.turnFns.push(fn); },
    nextTurn() { if (isJuntos()) { G.turn++; saveGame(); updateTurnChip(); RUN.turnFns.forEach(f => f()); } },
    activity() { resetIdle(); }
  };
  const refreshHint = () => {
    const ok = !!(RUN.ctrl && RUN.ctrl.hint) && (G.diff !== 'det' || RUN.mistakes >= 2 || RUN.hinted);
    hintBtn.disabled = !ok;
    hintBtn.title = ok ? '' : G.diff === 'det' ? 'No Detetive, a dica aparece depois de duas tentativas.' : '';
  };
  const resetIdle = () => {
    clearTimeout(RUN.idle);
    if (G.diff === 'exp' && RUN.ctrl && RUN.ctrl.hint && !RUN.done) RUN.idle = setTimeout(() => { if (!RUN.done && !$('#modal')) { RUN.auto = true; RUN.ctrl.hint(); RUN.auto = false; toast('A Faísca deu uma dica!', 'faisca'); } }, 25000);
    if (G.diff === 'det') RUN.idle = setTimeout(() => { RUN.hinted = true; refreshHint(); }, 45000);
  };
  onCleanup(() => clearTimeout(RUN && RUN.idle));
  RUN.ctrl = STEPS[step.t](step, ctx) || {};
  refreshHint(); resetIdle();
  if (S.autoRead && step.t !== 'dialog' && RUN.ctrl.speak) setTimeout(() => Voice.speak(RUN.ctrl.speak()), 300);
  const say = () => RUN.ctrl.speak && Voice.speak(RUN.ctrl.speak());
  if ($('#say')) $('#say').onclick = () => { Audio8.init(); if (!S.voice) toast('A leitura em voz alta está desligada nas configurações.'); say(); };
  hintBtn.onclick = () => { if (RUN.ctrl.hint) { Audio8.sfx('select'); RUN.ctrl.hint(); } };
  prim.onclick = () => {
    if (!RUN.done) return;
    if (RUN.ctrl.primary && RUN.ctrl.primary()) return;
    Audio8.sfx('step'); advance(id, idx);
  };
  if (sala) {
    $('#tback').onclick = () => { if (RUN.ctrl.back && RUN.ctrl.back()) return; if (idx > 0) go(renderMission, id, idx - 1); };
    $('#tpause').onclick = () => {
      const p = document.createElement('div'); p.className = 'pause'; p.setAttribute('role', 'dialog'); p.tabIndex = 0;
      p.innerHTML = `<div><img class="px" src="${SPR.url('faisca')}" style="width:120px" alt=""><h2>Pausa para conversar</h2><p style="font-size:1.3rem;font-weight:700">Toque em qualquer lugar para continuar.</p></div>`;
      p.onclick = () => p.remove(); document.body.appendChild(p); p.focus();
    };
    $('#trep').onclick = () => { Audio8.init(); Voice.enabled = true; say(); Voice.enabled = S.voice && !S.mute; };
    $('#tskip').onclick = () => { if (!RUN.done) { G.current.hints++; G.current.mistakes += 99; saveGame(); } advance(id, idx); };
  }
}
function advance(id, idx) {
  const M = MISSIONS[id], step = M.steps[idx];
  if (step.t === 'reveal' || step.t === 'whoami') unlockCharacter(M.char);
  if (idx + 1 < M.steps.length) go(renderMission, id, idx + 1);
  else finishMission(id);
}
function calcStars() {
  const c = G.current || {}; return 1 + ((c.mistakes || 0) <= DIFFS[G.diff].star ? 1 : 0) + ((c.hints || 0) === 0 ? 1 : 0);
}
function finishMission(id) {
  const first = !G.done[id], stars = calcStars(), info = { mistakes: (G.current || {}).mistakes || 0, hints: (G.current || {}).hints || 0 };
  G.done[id] = true; unlockCharacter(MISSIONS[id].char); G.current = null;
  G.stars[id] = Math.max(G.stars[id] || 0, stars);
  addMedal('colaboracao', 1, 'mis:' + id);
  saveGame(); go(screenReward, id, first, stars, info);
}
function totalStars() { return Object.values(G.stars || {}).reduce((a, b) => a + b, 0) + Object.values(G.bonus || {}).reduce((a, b) => a + b, 0); }

  Audio8.sfx(regionDone ? 'win' : 'light'); if (first) confetti(regionDone ? 90 : 40);
  const p = Math.round(progress() * 100);
  app().innerHTML = `<div class="screen reward">
    <h2>${regionDone ? `${esc(r.name)} restaurado!` : 'Lumiara ganhou mais luz!'}</h2>
    <p style="font-weight:700;font-size:1.15rem;margin:0;max-width:640px">${regionDone ? 'As cores voltaram e as janelas se acenderam. Quem trabalha aqui foi lembrado!' : 'Uma janela de cada vez, a cidade volta a brilhar.'}</p>
    <div class="star-big">${starsHTML(stars)}</div>
    <p class="star-why">${starsHTML(1, 1)} Missão concluída &nbsp; ${starsHTML((info.mistakes || 0) <= DIFFS[G.diff].star ? 1 : 0, 1)} Poucos tropeços (${info.mistakes || 0}) &nbsp; ${starsHTML((info.hints || 0) === 0 ? 1 : 0, 1)} Sem pedir dica${stars < 3 ? '<br><span style="opacity:.85">Quer as 3 estrelas? Dá para jogar a missão de novo pela região.</span>' : ''}</p>
    <div class="windows" aria-label="${on} de ${nWin} janelas acesas">${Array.from({ length: nWin }, (_, i) => `<div class="win ${i < on ? 'on' : ''}" style="--d:${i * .15}s"></div>`).join('')}</div>
    <div style="width:min(520px,100%)" class="lights"><div class="hud" style="margin:0"><span class="lbl">Luz de Lumiara</span><div class="bar"><i style="width:${p}%"></i></div><span class="pct">${p}%</span></div></div>
    <div class="row center" style="align-items:flex-start">${charCardHTML(M.char).replace('class="cardbig"', 'class="cardbig" style="--rc:' + r.color + ';width:260px"')}
      <div style="display:grid;gap:10px;max-width:420px;text-align:left">
        <div class="fact" style="color:var(--ink)"><h4>Missão concluída</h4><p>Vocês conheceram <b>${esc(c.name)}</b> (${esc(c.job.toLowerCase())}) e descobriram por que esse trabalho é tão importante.</p></div>
        <div class="medal-row">${medalsHTML()}</div></div></div>
    <div class="row center"><button class="btn primary big" id="go">${progress() >= 1 ? 'Ir para o grande final' : 'Voltar ao mapa'} ${ICON.next}</button></div></div>`;
  $('#go').onclick = () => { if (progress() >= 1) { G.current = { mission: '_finale' }; saveGame(); go(screenFinale); } else go(screenMap); };
}
function medalsHTML() {
  return Object.entries(MEDALS).map(([k, m]) => {
    const v = Math.min(G.medals[k] || 0, m.need), on = G.earned[k];

}

      <div class="set-row"><label for="diffSel">Nível de desafio</label><select class="sel" id="diffSel">${Object.entries(DIFFS).map(([k, d]) => `<option value="${k}" ${G.diff === k ? 'selected' : ''}>${d.label}</option>`).join('')}</select></div>
      <div class="set-row"><label>Modo: <b>${MODES[G.mode].label}</b> · Duração: <b>${PLANS[G.length].label}</b></label><button class="btn small" id="reset">Apagar progresso</button></div>` : ''}
    <p class="muted" style="font-weight:700;font-size:.85rem">Tudo fica salvo só neste aparelho. Nenhum dado é enviado para a internet.</p>`, { label: 'Configurações' });
  $$('#modal [data-k]').forEach(b => b.onclick = () => { const k = b.dataset.k; S[k] = !S[k]; b.setAttribute('aria-checked', S[k]); saveSettings(); Audio8.init(); Audio8.sfx('click'); if (k === 'voice' && S.voice) Voice.speak('Leitura em voz alta ligada.'); });
  $$('#modal [data-r]').forEach(r => r.oninput = () => { S[r.dataset.r] = +r.value; saveSettings(); });
  $$('#modal [data-r]').forEach(r => r.onchange = () => { Audio8.init(); Audio8.sfx('select'); });
  if (G) {
    $('#diffSel').onchange = e => { G.diff = e.target.value; saveGame(); applySettings(); toast('Nível alterado para <b>' + DIFFS[G.diff].label + '</b>. Vale a partir da próxima etapa.'); };
    $('#reset').onclick = () => confirmBox('Apagar todo o progresso desta partida?', 'Apagar', () => { Store.del(KEY_GAME); G = null; applySettings(); go(screenTitle); });
  }
}

/* ---------------- GUIA ---------------- */
function openGuide() {
  modal(`<h2>Como jogar</h2>
    <div class="fact" style="margin-bottom:10px"><h4>${SPR.img('faisca')} A história</h4><p>A Névoa do Esquecimento fez Lumiara esquecer quem faz a cidade funcionar. Explore as regiões, resolva os desafios e descubra quem são essas pessoas. Cada missão concluída acende uma parte da cidade.</p></div>
    <div class="fact" style="margin-bottom:10px"><h4>${SPR.img('estrela')} Não existe perder</h4><p>Errar faz parte da investigação. Ninguém é eliminado e não há cronômetro. As medalhas são da equipe toda.</p></div>
    <div class="fact" style="margin-bottom:10px"><h4>${SPR.img('estrela')} Estrelas</h4><p>Cada missão vale até 3 estrelas: concluir, tropeçar pouco e não pedir dica. Cada região ainda tem um desafio extra (memória ou enigma de lógica). Dá para jogar de novo e tentar mais estrelas.</p></div>
    <div class="fact" style="margin-bottom:10px"><h4>${SPR.img('caderno')} Os desafios</h4><p>Investigar cenas, ligar objetos, montar sequências, separar recicláveis, planejar rotas de entrega, achar diferenças, adivinhar "Quem sou eu?" e tomar decisões.</p></div>
    <h2 style="margin-top:18px">Para professores e mediadores</h2>
    <ul style="font-weight:700;display:grid;gap:6px">
      <li><b>Modo Sala de aula:</b> projete a tela. Use a barra do professor para pausar, repetir em voz alta, voltar ou pular etapas. Nas decisões, a turma vota levantando a mão.</li>
      <li><b>Modo Juntos:</b> de 2 a 6 crianças, cada uma com seu personagem. A vez gira sozinha e, no "Quem sou eu?", cada uma recebe uma pista secreta. Só resolvem se conversarem.</li>
      <li><b>Jogar à distância:</b> escolha "No celular de cada um" ao montar a partida. Quem está longe acompanha por chamada de vídeo (com a tela compartilhada) e vê a sua pista no próprio celular, tocando em "Tenho um código de pista" na tela inicial.</li>
      <li><b>Duração:</b> Curta (3 missões), Média (6) ou Completa (12). O nível de desafio pode ser trocado nas configurações a qualquer momento.</li>
      <li><b>Depois de cada missão</b> há uma pergunta para conversar e um desafio da vida real. Eles valem mais do que acertar.</li>
      <li><b>Sugestão:</b> peça que a turma registre em um mural os nomes dos trabalhadores da própria escola.</li>
      <li><b>Privacidade:</b> não há cadastro. O progresso fica só neste navegador e o jogo funciona sem internet depois de carregado.</li>
    </ul>
    <h2 style="margin-top:18px">Perguntas para fechar a partida</h2>
    <ol style="font-weight:700"><li>O que você descobriu hoje?</li><li>Qual trabalho você não tinha reparado antes?</li><li>Por que esse trabalho importa?</li><li>Como essa pessoa ajuda a comunidade?</li><li>Como podemos mostrar que reconhecemos esse trabalho?</li></ol>`, { label: 'Como jogar' });
}

/* ============================================================
   GRANDE FINAL — a Festa das Luzes
   ============================================================ */


const FINAL_REGION = { id: '_final', name: 'Festa das Luzes', color: '#f4c542', music: { root: 60, scale: 'maj', tempo: 108, wave: 'triangle' }, missions: [] };
const MIRROR_TASKS = ['Cozinha', 'Lava a roupa', 'Limpa a casa', 'Me leva à escola', 'Cuida de mim quando fico doente', 'Me ajuda na lição', 'Faz as compras', 'Cuida de irmãos ou avós'];

function buildFinale() {
  MISSIONS._finale = {
    title: 'A Festa das Luzes', char: null, steps: [
      { t: 'dialog', scene: 'festa', faded: true, cast: [{ id: 'nevoa', x: 62, y: 2 }], lines: FINALE.intro },
      { t: 'match', prompt: 'O que aconteceria com Lumiara sem cada uma dessas pessoas?', left: 'Quem', right: 'Sem essa pessoa…',
        pairsFn() {
          const met = planMissions().map(m => MISSIONS[m].char).filter(c => G.album.includes(c));
          const ids = (met.length >= 3 ? met : G.album).slice();
          return shuffle(ids).slice(0, 6).map(id => ({ a: { label: CHARACTERS[id].name + ' · ' + CHARACTERS[id].job, img: `<img class="px" style="width:30px;height:45px;flex:none" src="${SPR.url(id)}" alt="">` }, b: { label: FINALE.without[id] }, ok: `Sem ${CHARACTERS[id].name}, ${FINALE.without[id].charAt(0).toLowerCase() + FINALE.without[id].slice(1)}` }));
        }, wrong: 'Hmm, pense no trabalho que essa pessoa faz todos os dias.' },
      { t: 'thanks' },
      { t: 'dialog', scene: 'festa', faded: false, cast: [{ id: 'nevoaFeliz', x: 62, y: 2 }], lines: FINALE.outro.map(l => l.who === 'nevoa' ? { ...l, who: 'nevoaFeliz' } : l) },
      { t: 'mirror' }
    ]
  };
}

STEPS.thanks = function (step, ctx) {
  const need = G.mode === 'sala' ? 5 : Math.max(3, G.players.length);
  let sent = 0, who = null, msg = null;
  const chars = G.album.slice();
  ctx.stage.innerHTML = promptHTML(`Mural do Obrigado: escolham para quem agradecer e a mensagem. Cada obrigado deixa a Névoa menor. Faltam ${need}.`) + `
    <div class="two"><div class="stage"><div class="scene faded" id="fs"><img class="bg px" src="${composeScene('festa').toDataURL()}" alt="A festa na praça de Lumiara"><div class="fogl"></div>
      <img class="px map-nevoa nevoa-big" id="nv" src="${SPR.url('nevoa')}" alt="A Névoa" style="left:32%;top:2%;width:36%;animation:none"></div>
      <div class="thanks-wall" id="wall" aria-live="polite"><span style="color:#fff;font-weight:700;opacity:.8">Os bilhetes de obrigado aparecem aqui.</span></div></div>
    <div class="panel stage"><h3>1. Para quem?</h3><div class="chips" id="who">${chars.map(id => `<button class="chip" data-w="${id}" aria-pressed="false">${esc(CHARACTERS[id].name)}</button>`).join('')}</div>
      <h3>2. Qual mensagem?</h3><div class="chips" id="msg">${FINALE.thanks.map((t, i) => `<button class="chip" data-m="${i}" aria-pressed="false">${esc(t)}</button>`).join('')}</div>
      <label for="own" style="font-weight:800">Ou escreva a sua (opcional):</label><input class="txt" id="own" maxlength="80" autocomplete="off" placeholder="Ex.: Obrigada por cuidar do parque!">
      <button class="btn primary big" id="send" disabled>Enviar obrigado</button><p id="left" style="font-weight:800;margin:0">Faltam ${need} agradecimentos.</p></div></div>`;
  wireSay(ctx.stage, () => 'Mural do Obrigado. Escolham para quem agradecer e a mensagem.');
  const upd = () => { $('#send', ctx.stage).disabled = !(who && (msg !== null || $('#own', ctx.stage).value.trim())); };
  $$('[data-w]', ctx.stage).forEach(b => b.onclick = () => { $$('[data-w]', ctx.stage).forEach(x => x.setAttribute('aria-pressed', 'false')); b.setAttribute('aria-pressed', 'true'); who = b.dataset.w; Audio8.sfx('select'); upd(); });
  $$('[data-m]', ctx.stage).forEach(b => b.onclick = () => { $$('[data-m]', ctx.stage).forEach(x => x.setAttribute('aria-pressed', 'false')); b.setAttribute('aria-pressed', 'true'); msg = +b.dataset.m; $('#own', ctx.stage).value = ''; Audio8.sfx('select'); upd(); });
  $('#own', ctx.stage).oninput = () => { if ($('#own', ctx.stage).value.trim()) { msg = null; $$('[data-m]', ctx.stage).forEach(x => x.setAttribute('aria-pressed', 'false')); } upd(); };
  $('#send', ctx.stage).onclick = () => {
    const text = $('#own', ctx.stage).value.trim() || FINALE.thanks[msg];
    const wall = $('#wall', ctx.stage); if (!sent) wall.innerHTML = '';
    sent++; G.thanks.push({ to: who, text }); saveGame();
    const by = isJuntos() ? player().name : G.mode === 'sala' ? 'Turma' : '';
    wall.insertAdjacentHTML('beforeend', `<div class="note" style="--rot:${(Math.random() * 6 - 3).toFixed(1)}deg">${esc(text)}<small>Para ${esc(CHARACTERS[who].name)}${by ? ' · de ' + esc(by) : ''}</small></div>`);
    Audio8.sfx('light'); sparkle($('#nv', ctx.stage), 14);
    const f = Math.min(sent / need, 1), nv = $('#nv', ctx.stage);
    nv.style.transform = `scale(${1 - f * .55})`; nv.style.filter = `grayscale(${1 - f}) brightness(${1 + f * .3})`;
    $('#fs', ctx.stage).classList.toggle('faded', f < 1);
    addMedal('gentileza', 1, 'thx:' + sent);
    who = null; msg = null; $('#own', ctx.stage).value = ''; $$('.chip', ctx.stage).forEach(x => x.setAttribute('aria-pressed', 'false')); upd();
    if (sent >= need) {
      $('#left', ctx.stage).textContent = 'A Névoa está mudando…'; nv.src = SPR.url('nevoaFeliz'); Audio8.sfx('win'); confetti(70);
      ctx.setPrimary('Ver o que aconteceu'); ctx.complete();
    } else { $('#left', ctx.stage).textContent = `Faltam ${need - sent} agradecimentos.`; ctx.nextTurn(); }
  };
  return { speak: () => 'Mural do Obrigado. Escolham para quem agradecer e a mensagem. Cada obrigado deixa a Névoa menor.' };
};

STEPS.mirror = function (step, ctx) {
  const tasks = new Set();
  ctx.stage.innerHTML = `<div class="reveal"><div class="cardbig"><div class="inner" style="--rc:#f4c542"><div class="portrait"><img class="px char" src="${SPR.url('sono', 'sil')}" alt="Silhueta misteriosa"><span style="position:absolute;font-family:var(--title);font-size:4rem;color:#fff;text-shadow:3px 3px 0 var(--ink);z-index:2">?</span></div><h3>A última carta</h3><div class="job">Quem cuida da sua casa?</div></div></div>
    <div class="stage"><div class="fact"><p style="font-size:1.1rem">${esc(FINALE.mirror)}</p></div>
      ${G.mode === 'sala' ? '<p style="color:#fff;font-weight:800;margin:0">Cada pessoa da turma pensa em alguém. Quem quiser, conta em voz alta. Podem preencher juntos um exemplo.</p>' : ''}
      <div class="panel stage"><label for="mn" style="font-weight:800">Nome ou apelido dessa pessoa (opcional)</label><input class="txt" id="mn" maxlength="30" autocomplete="off" placeholder="Ex.: Vó Fátima">
      <b>O que essa pessoa faz?</b><div class="chips">${MIRROR_TASKS.map((t, i) => `<button class="chip" data-t="${i}" aria-pressed="false">${esc(t)}</button>`).join('')}</div>
      <div class="row"><button class="btn primary" id="put">${SPR.img('coracao')} Colocar no álbum</button><button class="btn ghost" id="skip">Prefiro só pensar</button></div>
      <p class="muted" style="font-weight:700;font-size:.85rem;margin:0">Isso fica guardado só neste aparelho.</p></div></div></div>`;
  $$('[data-t]', ctx.stage).forEach(b => b.onclick = () => { const i = +b.dataset.t; tasks.has(i) ? tasks.delete(i) : tasks.add(i); b.setAttribute('aria-pressed', tasks.has(i)); Audio8.sfx('select'); });
  $('#put', ctx.stage).onclick = () => {
    G.mirror = { name: $('#mn', ctx.stage).value.trim(), tasks: [...tasks].map(i => MIRROR_TASKS[i].toLowerCase()) }; saveGame();
    Audio8.sfx('reveal'); toast('A carta especial entrou no álbum!', 'coracao'); addMedal('gentileza', 1, 'mirror');
    $('#put', ctx.stage).disabled = true; ctx.setPrimary('Terminar a aventura'); ctx.complete();
  };
  $('#skip', ctx.stage).onclick = () => { ctx.setPrimary('Terminar a aventura'); ctx.complete(); $('#prim').focus(); };
  return { speak: () => FINALE.mirror };
};

function screenFinale() { buildFinale(); const s = (G.current && G.current.mission === '_finale' && G.current.step) || 0; go(renderMission, '_finale', s); }

function screenEnding() {
  Audio8.music({ root: 60, scale: 'maj', tempo: 112, wave: 'triangle' }, 1);
  confetti(100); Audio8.sfx('win');
  const names = G.mode === 'sala' ? 'A turma toda' : G.players.map(p => p.name).join(', ');
  const met = G.album.length, total = Object.keys(CHARACTERS).length;
  app().innerHTML = `<div class="screen stage">
    <div class="logo"><h1>Lumiara está acesa!</h1><p>Uma cidade só funciona porque muitas pessoas fazem a sua parte. Ninguém deveria ser invisível.</p></div>
    <div class="scene cap"><img class="bg px" src="${composeScene('festa', [], [{ id: 'nevoaFeliz', x: 62, y: 2 }, ...G.album.slice(0, 6).map((id, i) => ({ id, x: 8 + i * 25, y: 60 }))]).toDataURL()}" alt="Festa em Lumiara com os trabalhadores lembrados"></div>
    <div class="cert"><span class="tag">Certificado</span><h2>Guardiões da Memória de Lumiara</h2>
      <div class="row center">${G.players.map(p => `<img class="px" style="width:48px;height:72px" src="${SPR.url(avatarOf(p))}" alt="">`).join('')}</div><p class="names">${esc(names)}</p>
      <p style="font-weight:800;font-size:1.2rem;margin:0">${starsHTML(1, 1)} ${totalStars()} estrelas conquistadas</p>
      <p style="font-weight:700">ajudaram a cidade a lembrar de <b>${met}</b> ${met === 1 ? 'pessoa' : 'pessoas'} que fazem tudo funcionar${G.mirror ? ', e de alguém muito especial em casa' : ''}.</p>
      <div class="medal-row">${medalsHTML()}</div>
      ${G.challenges.length ? `<h3 style="margin-top:16px">Desafios da vida real aceitos</h3><ul style="text-align:left;font-weight:700;max-width:640px;margin:0 auto">${G.challenges.map(c => `<li>${esc(c)}</li>`).join('')}</ul>` : ''}
      <p style="font-weight:800;margin-top:16px">Agora é com vocês: olhem em volta. Quem faz a sua escola, a sua rua e a sua casa funcionarem?</p></div>
    ${met < total ? `<p style="color:#fff;font-weight:800;text-align:center;margin:0">Ainda há ${total - met} pessoas para conhecer em Lumiara. Que tal jogar a versão Completa?</p>` : ''}
    <div class="row center"><button class="btn big" id="alb">${ICON.book} Ver o álbum</button><button class="btn big" id="map">${ICON.map} Passear pelo mapa</button><button class="btn primary big" id="again">Jogar de novo</button></div></div>`;
  $('#alb').onclick = openAlbum;
  $('#map').onclick = () => go(screenMap);
  $('#again').onclick = () => confirmBox('Começar uma nova aventura? O álbum desta partida será apagado.', 'Começar de novo', () => go(screenSetup));
}

/* desafios extras viram mini-missões de uma etapa */
for (const rid in BONUS) MISSIONS['_bonus_' + rid] = { title: BONUS[rid].title, char: null, bonus: rid, steps: [BONUS[rid]] };

/* integra o final e os extras ao executor de missões */
const _regionOf = regionOf;
regionOf = function (mid) { if (mid === '_finale') return FINAL_REGION; if (mid.startsWith('_bonus_')) return REGIONS.find(r => r.id === mid.slice(7)); return _regionOf(mid); };
const _finish = finishMission;
finishMission = function (id) {
  if (id.startsWith('_bonus_')) {
    const rid = id.slice(7), st = calcStars();
    G.bonus[rid] = Math.max(G.bonus[rid] || 0, st); G.current = null; addMedal('curiosidade', 1, 'bonus:' + rid); saveGame();
    Audio8.sfx('win'); confetti(40); toast(`Desafio extra concluído: ${'★'.repeat(st)}${'☆'.repeat(3 - st)}`, 'estrela');
    go(screenRegion, rid); return;
  }
  if (id !== '_finale') return _finish(id);
  G.finished = true; G.current = null; saveGame(); go(screenEnding);
};

/* ============================================================
   INÍCIO
   ============================================================ */

(function boot() {
  applySettings();
  const wake = () => { Audio8.init(); };
  document.addEventListener('pointerdown', wake, { once: true });
  document.addEventListener('keydown', wake, { once: true });
  go(screenTitle);
})();
</script>
</body>
</html>
