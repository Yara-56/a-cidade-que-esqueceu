        <div><div class="sils">${opts.map((c, i) => `<button class="sil ${out.has(c) ? 'out' : ''}" data-c="${c}" ${out.has(c) ? 'disabled' : ''} aria-label="Silhueta ${L[i]}">${SPR.img(c, 'sil')}<span>Silhueta ${L[i]}</span></button>`).join('')}</div><div id="fb" style="margin-top:12px"></div></div></div>`;
      wireSay(ctx.stage, () => team && !opened ? 'Cada um conta a sua pista.' : clues.slice(0, opened ? clues.length : shown).join('. '));
      const more = $('#more', ctx.stage); if (more) more.onclick = () => { shown++; if (shown > 2) ctx.mistake(); Audio8.sfx('page'); ctx.activity(); render(); if (S.autoRead) Voice.speak(clues[shown - 1]); };
      const op = $('#open', ctx.stage); if (op) op.onclick = () => { opened = true; ctx.usedHint(); Audio8.sfx('page'); render(); };
      $$('.sil', ctx.stage).forEach(b => b.onclick = () => {

          feedback($('#fb', ctx.stage), 'ok', `<b class="kind">Descobriram!</b>É ${esc(CHARACTERS[c].name)}, ${esc(CHARACTERS[c].job.toLowerCase())}.`, CHARACTERS[c].prop);
          $$('.sil', ctx.stage).forEach(x => x.disabled = true);

          feedback($('#fb', ctx.stage), 'soft', `Ainda não! Essa pessoa trabalha em outro lugar da cidade${G.diff === 'exp' ? ` (${esc(r.name)})` : ''}. ${!team && shown < clues.length ? 'Que tal revelar mais uma pista?' : 'Conversem de novo sobre as pistas.'}`);
        }
      });

        <p style="font-weight:800;margin:0;max-width:620px">Só você está vendo isso. Conte para os amigos com as suas palavras, pela chamada ou por mensagem!</p>
        <button class="btn primary big" id="ready" data-local>Já contei! Vamos adivinhar</button></div>`;
      $('#ready', ctx.stage).onclick = () => { phase = 'guess'; Audio8.sfx('select'); render(); };
    };
    const renderPhone = () => {
      const code = clueCode(ctx.id, G.players.length, clues.length);

        <div class="row center">${G.players.map((p, i) => `<span class="tag" style="background:${p.color}">${i + 1}. ${esc(p.name)}</span>`).join('')}</div>
        <button class="btn primary big" id="ready">Todo mundo viu a sua pista</button>
        <p class="muted" style="font-weight:700;margin:0">Funciona até numa chamada de vídeo: quem está longe vê a pista no celular e conta para o grupo.</p></div>`;

  /* ---------------- JOGO DA MEMÓRIA ---------------- */
  memory(step, ctx) {
    const pairs = shuffle(step.pairs).slice(0, DIFFS[G.diff].pairs);
    const label = id => (step.labels && step.labels[id]) || (CHARACTERS[id] ? CHARACTERS[id].name : NAMES[id] || '');
    const cards = shuffle(pairs.flatMap((p, i) => [{ id: p[0], pair: i }, { id: p[1], pair: i }]));
    const open = [], done = new Set(); let moves = 0, lock = false;
    const cols = cards.length <= 8 ? 4 : 6;
    ctx.stage.innerHTML = promptHTML(step.prompt) + `<div class="memo" style="--cols:${cols}">${cards.map((c, i) => `<button class="mem" data-i="${i}" data-p="${c.pair}" aria-label="Carta ${i + 1} virada para baixo"><span class="back">${SPR.img('faisca')}</span><span class="front">${SPR.img(c.id)}<small>${esc(step.labels ? '' : label(c.id))}</small></span></button>`).join('')}</div>
      <p style="color:#fff;font-weight:800;margin:0;text-align:center">Jogadas: <span id="mv">0</span> · Pares: <span id="pr">0</span> de ${pairs.length}</p><div id="fb"></div>`;
    wireSay(ctx.stage, () => step.prompt);
    const fb = $('#fb', ctx.stage);
    const flip = (i, on) => { const b = $(`.mem[data-i="${i}"]`, ctx.stage); b.classList.toggle('up', on); b.setAttribute('aria-label', on ? 'Carta: ' + (label(cards[i].id) || cards[i].id) : `Carta ${i + 1} virada para baixo`); };
    $$('.mem', ctx.stage).forEach(b => b.onclick = () => {
      const i = +b.dataset.i; if (lock || done.has(i) || open.includes(i)) return;
      ctx.activity(); flip(i, true); open.push(i); Audio8.sfx('page');
      if (open.length === 2) {
        moves++; $('#mv', ctx.stage).textContent = moves;
        const [x, y] = open;
        if (cards[x].pair === cards[y].pair) {
          done.add(x); done.add(y); open.length = 0; Audio8.sfx('found');
          [x, y].forEach(k => $(`.mem[data-i="${k}"]`, ctx.stage).classList.add('done'));
          $('#pr', ctx.stage).textContent = done.size / 2;
          const p = pairs[cards[x].pair];
          feedback(fb, 'ok', `<b class="kind">Par encontrado!</b>${esc(step.labels ? label(p[0]) + ': ' + 'os dois são do mesmo tipo.' : label(p[0]) + ' usa isso no trabalho.')}`, p[1]);
          if (done.size === cards.length) { Audio8.sfx('ok'); ctx.complete(); } else ctx.nextTurn();
        } else {
          lock = true; if (moves > pairs.length + 3) ctx.mistake();
          setTimeout(() => { flip(x, false); flip(y, false); open.length = 0; lock = false; ctx.nextTurn(); }, 950);
        }
      }
    });
    return {
      speak: () => step.prompt,
      hint() {
        ctx.usedHint(); const p = cards.findIndex((c, i) => !done.has(i)); if (p < 0) return;
        const q = cards.findIndex((c, i) => i !== p && c.pair === cards[p].pair);
        [p, q].forEach(k => flip(k, true)); lock = true;
        setTimeout(() => { [p, q].forEach(k => { if (!done.has(k)) flip(k, false); }); lock = false; }, 1200);
      }
    };
  },

  /* ---------------- ENIGMA DE LÓGICA ---------------- */
  logic(step, ctx) {
    const perm = shuffle(step.options.map((_, i) => i)), O = perm.map(i => step.options[i]), ans = step.answer.map(a => perm.indexOf(a));
    const P = step.people, grid = P.map(() => O.map(() => 0));
    ctx.stage.innerHTML = promptHTML(step.prompt) + `<div class="two"><div class="clues">${step.clues.map((c, i) => `<div class="clue"><span class="n">${i + 1}</span><span>${esc(c)}</span></div>`).join('')}</div>
      <div><div class="logic" role="grid" style="--cols:${O.length}"><span></span>${O.map(o => `<b class="lh">${esc(o)}</b>`).join('')}
      ${P.map((p, r) => `<b class="lr">${esc(p)}</b>${O.map((o, c) => `<button class="lc" data-r="${r}" data-c="${c}" aria-label="${esc(p)} e ${esc(o)}: vazio"></button>`).join('')}`).join('')}</div>
      <p style="color:#fff;font-weight:700;margin:8px 0">Toque uma vez para ✓ (é isso), duas para ✗ (não é), três para limpar.</p>
      <div class="row"><button class="btn primary" id="chk">Conferir</button></div><div id="fb" style="margin-top:10px"></div></div></div>`;
    wireSay(ctx.stage, () => step.prompt + ' ' + step.clues.join(' '));
    const fb = $('#fb', ctx.stage);
    const paint = () => $$('.lc', ctx.stage).forEach(b => { const v = grid[b.dataset.r][b.dataset.c]; b.textContent = ['', '✓', '✗'][v]; b.className = 'lc ' + ['', 'yes', 'no'][v]; b.setAttribute('aria-label', `${P[b.dataset.r]} e ${O[b.dataset.c]}: ${['vazio', 'sim', 'não'][v]}`); });
    $$('.lc', ctx.stage).forEach(b => b.onclick = () => {
      ctx.activity(); const r = +b.dataset.r, c = +b.dataset.c; grid[r][c] = (grid[r][c] + 1) % 3;
      if (grid[r][c] === 1 && G.diff === 'exp') { grid[r].forEach((_, k) => { if (k !== c) grid[r][k] = 2; }); grid.forEach((row, k) => { if (k !== r) row[c] = 2; }); }
      Audio8.sfx('click'); paint();
    });
    $('#chk', ctx.stage).onclick = () => {
      ctx.activity();
      const picks = grid.map(row => row.indexOf(1)), ok = picks.filter((v, i) => v === ans[i]).length;
      if (picks.some((v, i) => v < 0 || row1(i) > 1)) { feedback(fb, 'info', 'Cada pessoa precisa de exatamente um ✓ na sua linha.'); return; }
      if (ok === P.length) { Audio8.sfx('ok'); feedback(fb, 'ok', `<b class="kind">Enigma resolvido!</b>${P.map((p, i) => `${esc(p)}: ${esc(O[ans[i]])}`).join(' · ')}`, 'estrela'); $$('.lc', ctx.stage).forEach(b => b.disabled = true); ctx.complete(); }
      else { Audio8.sfx('soft'); ctx.mistake(); feedback(fb, 'soft', `<b>${ok} de ${P.length}</b> certas. Releia as pistas: qual delas resolve uma pessoa sozinha?`); ctx.nextTurn(); }
    };
    const row1 = i => grid[i].filter(v => v === 1).length;
    return {
      speak: () => step.prompt + ' ' + step.clues.join(' '),
      hint() {
        ctx.usedHint(); const r = P.findIndex((_, i) => grid[i][ans[i]] !== 1); if (r < 0) return;
        grid[r] = O.map((_, c) => c === ans[r] ? 1 : 2); paint(); feedback(fb, 'info', `A Faísca resolveu: <b>${esc(P[r])}</b>.`, 'faisca');
      }
    };
  },

  /* ---------------- REVELAÇÃO (ficha do personagem) ---------------- */
  reveal(step, ctx) {
    const c = CHARACTERS[step.char], r = REGIONS.find(x => x.id === c.region);
    const vscene = (DAYS[step.char] && DAYS[step.char].scene) || (MISSIONS[step.char] && MISSIONS[step.char].steps[0].scene) || 'cidade';
    unlockCharacter(step.char);
    ctx.stage.innerHTML = `<div class="reveal rv">${charCardHTML(step.char)}
      <div class="facts">
        <div class="fact big1"><h4>${SPR.img('coracao')} Por que importa</h4><p>${esc(c.contribution)}</p></div>
        <div class="scene vid" id="vid"><img class="bg px" src="${composeScene(vscene).toDataURL()}" alt="${esc(c.name)} trabalhando">${ambientHTML(vscene)}<div class="layer" id="vl"></div><div class="vcap" id="vc" aria-live="polite"></div><span class="vtag">${SPR.img('relogio')} Um dia de trabalho</span></div>
        <div class="row">
          <button class="btn small" data-more="hist">${SPR.img('livro')} História</button>
          <button class="btn small" data-more="des">${SPR.img('cone')} Desafios</button>
          <button class="btn small" id="curio">${SPR.img('oculos')} Curiosidade</button></div>
        <div id="cur"></div>
      </div></div>`;
    Audio8.sfx('reveal'); sparkle($('.cardbig', ctx.stage), 20);
    { /* mini-vídeo: a pessoa chega com o objeto de trabalho e a rotina passa em legendas */
      const vl = $('#vl', ctx.stage), w = spriteEl(step.char, -18, 54), tool = spriteEl(c.prop, -8, 66, { cls: 'work' });
      vl.appendChild(w); vl.appendChild(tool);
      setTimeout(() => { moveEl(w, 64, 54, 1600, true); moveEl(tool, 76, 64, 1600); }, 80);
      let k = 0; const cap = $('#vc', ctx.stage);
      const next = () => { if (!document.body.contains(cap)) return; cap.classList.remove('in'); void cap.offsetWidth; cap.textContent = c.routine[k % c.routine.length]; cap.classList.add('in'); k++; if (k % 2 === 0) sparkle(tool, 6); };
      setTimeout(next, 1400); const iv = setInterval(next, 2600); onCleanup(() => clearInterval(iv));
    }
    const more = { hist: ['História', 'livro', c.story], des: ['Desafios do trabalho', 'cone', c.challenges] };
    $$('[data-more]', ctx.stage).forEach(b => b.onclick = () => { const [t, p, x] = more[b.dataset.more]; $('#cur', ctx.stage).innerHTML = `<div class="fact"><h4>${SPR.img(p)} ${t}</h4><p>${esc(x)}</p></div>`; Audio8.sfx('page'); addMedal('curiosidade', 1, 'more:' + step.char + b.dataset.more); if (S.autoRead) Voice.speak(x); });
    $('#curio', ctx.stage).onclick = () => {
      $('#cur', ctx.stage).innerHTML = `<div class="fact curio"><h4>${SPR.img('oculos')} Curiosidade</h4><p>${esc(c.curiosity)}</p></div>`;
      addMedal('curiosidade', 1, 'curio:' + step.char); Audio8.sfx('found');
      if (S.autoRead) Voice.speak(c.curiosity);
    };
    ctx.complete();
    toast(`<b>${esc(c.name)}</b> entrou no álbum da cidade!`, c.prop);
    return { speak: () => `${c.name}, ${c.job}. ${c.story} ${c.contribution} ${c.quote}` };
  },

  /* ---------------- ESCOLHA ---------------- */
  choice(step, ctx) {
    const tried = new Set(); const L = 'ABC';
    ctx.stage.innerHTML = `<div class="two"><div>${sceneHTML(step.scene, { items: step.items, cast: step.cast, faded: false, alt: 'Cena da situação' })}</div>
      <div class="stage">${promptHTML(step.prompt)}${G.mode === 'sala' ? '<p style="color:#fff;font-weight:800;margin:0">Turma: levantem a mão para cada opção. O professor toca na mais votada.</p>' : isJuntos() ? `<p style="color:#fff;font-weight:800;margin:0">Cada pessoa dá sua opinião. Depois, ${esc(player().name)} toca na escolha do grupo.</p>` : ''}
      <div class="options">${step.options.map((o, i) => `<button class="opt" data-o="${i}"><span class="l">${L[i]}</span><span>${esc(o.text)}</span></button>`).join('')}</div><div id="fb"></div></div></div>`;
    wireSay(ctx.stage, () => step.prompt + ' ' + step.options.map((o, i) => L[i] + ': ' + o.text).join('. '));
    $$('.opt', ctx.stage).forEach(b => b.onclick = () => {
      ctx.activity(); const o = step.options[+b.dataset.o]; tried.add(+b.dataset.o);
      $$('.opt', ctx.stage).forEach(x => { x.classList.remove('chosen'); if (tried.has(+x.dataset.o)) x.classList.add('tried'); });
      b.classList.add('chosen'); b.classList.remove('tried');
      if (o.kind) { Audio8.sfx('ok'); addMedal('gentileza', 1, 'kind:' + ctx.id); sparkle(b); if (!G.seen['en:' + ctx.id]) { G.seen['en:' + ctx.id] = 1; G.energy = (G.energy || 0) + 2; saveGame(); if (typeof floatText === 'function') floatText(ctx.stage, '+2 Energia do Obrigado!', 50, 20); updEnergy(); } }
      else Audio8.sfx('soft');
      feedback($('#fb', ctx.stage), o.kind ? 'ok' : 'soft', `<b class="kind">${o.kind ? 'Escolha gentil!' : 'O que acontece:'}</b>${esc(o.result)}${o.kind ? '' : '<br><span style="font-weight:800">Quer pensar em outra escolha? Pode tentar de novo.</span>'}`, o.kind ? 'coracao' : null);
      if (S.autoRead) Voice.speak(o.result);
      ctx.complete();
    });
    return { speak: () => step.prompt + ' ' + step.options.map((o, i) => 'Opção ' + L[i] + ': ' + o.text).join('. '), hint() { ctx.usedHint(); feedback($('#fb', ctx.stage), 'info', 'Pense: qual escolha ajuda a pessoa que trabalha e mostra que você reparou nela?', 'faisca'); } };
  },

  /* ---------------- REFLEXÃO ---------------- */
  reflect(step, ctx) {
    const accepted = G.challenges.includes(step.challenge);
    ctx.stage.innerHTML = `<div class="reflect">
      <div class="rcard"><h3>${SPR.img('lampada')} O que descobrimos</h3><p>${esc(step.learn)}</p></div>
      <div class="rcard q"><h3>${SPR.img('carta')} Para conversar</h3><p>${esc(step.question)}</p><button class="btn" id="talk">${G.mode === 'solo' ? 'Pensei sobre isso' : 'Conversamos sobre isso'}</button></div>
      <div class="rcard c"><h3>${SPR.img('estrela')} Desafio da vida real</h3><p>${esc(step.challenge)}</p><button class="btn primary" id="acc" ${accepted ? 'disabled' : ''}>${accepted ? 'Desafio aceito ✓' : 'Aceitamos o desafio!'}</button></div>
    </div>`;
    $('#talk', ctx.stage).onclick = e => { e.target.disabled = true; e.target.textContent = 'Boa conversa ✓'; Audio8.sfx('select'); addMedal(G.mode === 'solo' ? 'curiosidade' : 'colaboracao', 1, 'talk:' + ctx.id); };
    $('#acc', ctx.stage).onclick = e => {
      e.target.disabled = true; e.target.textContent = 'Desafio aceito ✓'; Audio8.sfx('light'); sparkle(e.target, 14);
      if (!G.challenges.includes(step.challenge)) G.challenges.push(step.challenge);
      addMedal('gentileza', 1, 'acc:' + ctx.id);
    };
    ctx.setPrimary('Concluir missão'); ctx.complete();
    return { speak: () => `${step.learn} Para conversar: ${step.question} Desafio da vida real: ${step.challenge}` };
  }
};

      : `<div class="cw-opts ${S_.kind}">${O[S_.k].map(v => `<button class="cw-o" data-v="${v}" aria-pressed="${av[S_.k] === v}" aria-label="${esc(S_.t)}">${S_.kind === 'sw' ? `<i style="background:${swc(S_.k, v)}"></i>` : SPR.img(avatarId({ ...av, [S_.k]: v }))}</button>`).join('')}</div>`;
    ov.innerHTML = `<div class="cw-card">

  R(ctx, 'greyL', 0, 54, MAP_W, 1); R(ctx, 'greyL', 0, 65, MAP_W, 1);

  R(ctx, 'brownD', 97, 42, 7, 7); R(ctx, 'greyD', 100, 4, 1, 12); R(ctx, L2 ? 'red' : 'grey', 101, 4, 7, 5);

  house(ctx, 184, 30, 12, 16, 'pink', 'brown', L3);

    R(ctx, 'ink', x - 1, 77, 18, 6); for (let i = 0; i < 16; i += 4) R(ctx, i % 8 ? 'white' : cc, x + i, 78, 4, 4);
    R(ctx, 'brownD', x, 83, 1, 14); R(ctx, 'brownD', x + 15, 83, 1, 14); R(ctx, 'ink', x - 1, 92, 18, 5); R(ctx, 'brownL', x, 93, 16, 3);

  const say = () => RUN.ctrl.speak && Voice.speak(RUN.ctrl.speak());
  if ($('#say')) $('#say').onclick = () => { Audio8.init(); if (!S.voice) toast('A leitura em voz alta está desligada nas configurações.'); say(); };
  hintBtn.onclick = () => { if (RUN.ctrl.hint) { Audio8.sfx('select'); RUN.ctrl.hint(); } };
  /* rede de segurança: se travar numa etapa, aparece "Pular" (nunca fica preso) */
  const skipT = setTimeout(() => { if (RUN.done || !prim.isConnected) return; RUN.skipOk = true; prim.disabled = false; prim.classList.add('skip'); prim.innerHTML = flowOn() ? `${ICON.next}` : `Pular ${ICON.next}`; prim.title = 'Pular'; }, step.t === 'dialog' || step.t === 'reveal' ? 25000 : 75000);
  onCleanup(() => clearTimeout(skipT));
  prim.onclick = () => {
    if (!RUN.done && RUN.skipOk) { Audio8.sfx('step'); G.current.hints++; saveGame(); advance(id, idx); return; }
    if (!RUN.done) return;
    if (RUN.ctrl.primary && RUN.ctrl.primary()) return;
    Audio8.sfx('step'); advance(id, idx);
  };
  if (sala) {
    $('#tback').onclick = () => { if (RUN.ctrl.back && RUN.ctrl.back()) return; if (idx > 0) go(renderMission, id, idx - 1); };
    $('#tpause').onclick = () => {

  }
}
/* segue direto para a próxima missão do roteiro (sem passar pelo mapa) */
function goNextMission() {
  if (G.prologue && G.mode !== 'sala') { go(screenMap); return; }
  if (progress() >= 1) { G.current = { mission: '_finale' }; saveGame(); go(screenFinale); return; }
  const m = planMissions().find(x => !G.done[x]);
  if (!m) { go(screenMap); return; }
  G.current = { mission: m, step: 0 }; saveGame(); go(renderMission, m, 0);
}
function advance(id, idx) {
  const M = MISSIONS[id], step = M.steps[idx];
  if (step.t === 'reveal' || step.t === 'whoami') unlockCharacter(M.char);
  if (idx + 1 < M.steps.length) go(renderMission, id, idx + 1);
  else finishMission(id);
}
function calcStars() {
  const c = G.current || {}; return 1 + ((c.mistakes || 0) <= DIFFS[G.diff].star ? 1 : 0) + ((c.hints || 0) === 0 ? 1 : 0);
}
function finishMission(id) {
  const first = !G.done[id], stars = calcStars(), info = { mistakes: (G.current || {}).mistakes || 0, hints: (G.current || {}).hints || 0 };
  G.done[id] = true; unlockCharacter(MISSIONS[id].char); G.current = null;
  G.stars[id] = Math.max(G.stars[id] || 0, stars);
  addMedal('colaboracao', 1, 'mis:' + id);
  saveGame(); go(screenReward, id, first, stars, info);
}
function totalStars() { return Object.values(G.stars || {}).reduce((a, b) => a + b, 0) + Object.values(G.bonus || {}).reduce((a, b) => a + b, 0); }

/* integra o final e os extras ao executor de missões */
const _regionOf = regionOf;
regionOf = function (mid) { if (mid === '_finale') return FINAL_REGION; if (mid.startsWith('_bonus_')) return REGIONS.find(r => r.id === mid.slice(7)); return _regionOf(mid); };
const _finish = finishMission;
finishMission = function (id) {
  if (id.startsWith('_bonus_')) {
    const rid = id.slice(7), st = calcStars();
    G.bonus[rid] = Math.max(G.bonus[rid] || 0, st); G.current = null; addMedal('curiosidade', 1, 'bonus:' + rid); saveGame();
    Audio8.sfx('win'); confetti(40); toast(`Desafio extra concluído: ${'★'.repeat(st)}${'☆'.repeat(3 - st)}`, 'estrela');
    go(screenRegion, rid); return;
  }
  if (id !== '_finale') return _finish(id);
  G.finished = true; G.current = null; saveGame(); go(screenOutro);
};

/* ---------- camada de sprites por cima de um cenário ---------- */
function spriteEl(name, x, y, { mode = null, w = null, cls = '' } = {}) {
  if (name === 'you') name = avatarOf();
  const c = SPR.canvas(name, mode), img = document.createElement('img');
  img.className = 'px sprite ' + cls; img.alt = ''; img.src = SPR.url(name, mode);
  img.style.left = pct(x, SW); img.style.top = pct(y, SH); img.style.width = pct(w || c.width, SW);
  img._name = name; img._mode = mode;
  return img;
}
function moveEl(img, x, y, ms, walk) {
  img.style.transitionDuration = (S.reduceMotion ? 0 : ms / 1000) + 's';
  img.style.left = pct(x, SW); img.style.top = pct(y, SH);
  if (walk && !S.reduceMotion && LOOKS[img._name]) {
    clearInterval(img._walk); let f = 0;
    img._walk = setInterval(() => { f ^= 1; img.src = SPR.url(img._name, f ? 'walk' : img._mode); }, 140);
    setTimeout(() => { clearInterval(img._walk); img.src = SPR.url(img._name, img._mode); }, ms);
  }
}

/* ---------- motor de cenas ---------- */
function playCutscene(frames, { title = 'Lumiara', where = 'História', onDone }) {
  let i = 0, cancelT = null; const actors = {};
  app().innerHTML = `<div class="screen stage"><div class="mhead"><div><div class="where">${esc(where)}</div><h2>${esc(title)}</h2></div>
    <div class="dots">${frames.map(() => '<i></i>').join('')}</div></div>
    <div class="scene cap cut" id="cut"><img class="bg px" id="cbg" alt=""><div class="layer" id="lay"></div><div class="tint" id="dark"></div><div class="fogl" id="fog"></div></div>
    <div id="cb"></div></div>`;
  const lay = $('#lay'), bg = $('#cbg');
  $('#cut').addEventListener('click', () => { const n = $('#nx'); if (n) n.click(); });
  $('#cb').addEventListener('click', e => { if (e.target.closest('button')) return; const n = $('#nx'); if (n) n.click(); });
  let sceneKey = null;
  const show = () => {
    const f = frames[i];
    $$('.mhead .dots i').forEach((d, k) => d.className = k < i ? 'done' : k === i ? 'now' : '');
    if (f.scene && f.scene !== sceneKey) { sceneKey = f.scene; bg.src = composeScene(f.scene).toDataURL(); const old = $('#cut .amb-layer'); if (old) old.remove(); bg.insertAdjacentHTML('afterend', ambientHTML(f.scene)); }
    bg.style.filter = `grayscale(${f.gray ?? 0}) brightness(${1 - (f.gray ?? 0) * .05})`;
    $('#dark').style.opacity = f.dark ?? 0;
    $('#fog').style.opacity = f.fog ?? 0;
    for (const [k, a] of Object.entries(f.actors || {})) {
      if (a.hide) { if (actors[k]) { actors[k].style.opacity = 0; } continue; }
      const id = a.s === 'avatar' ? avatarOf() : a.s;
      let el = actors[k];
      if (!el) {
        const [fx, fy] = a.from || [a.x, a.y];
        el = actors[k] = spriteEl(id, fx, fy, { mode: a.mode, w: a.w, cls: a.glow ? 'glow' : '' }); lay.appendChild(el);
        void el.offsetWidth;
      }
      if (a.mode !== undefined && a.mode !== el._mode) { el._mode = a.mode; el.src = SPR.url(id, a.mode); }
      if (a.s && a.s !== el._name && a.s !== 'avatar') { el._name = a.s; el.src = SPR.url(a.s, el._mode); }
      if (a.w) el.style.width = pct(a.w, SW);
      el.classList.toggle('flip', !!a.flip); el.style.opacity = 1;
      moveEl(el, a.x, a.y, a.ms || 1400, a.walk);
    }
    if (f.sparkle) setTimeout(() => { for (let n = 0; n < 4; n++) setTimeout(() => sparkle($('#cut'), 14), n * 250); }, 300);
    $('#cb').innerHTML = bubbleHTML(f.who || 'faisca', f.text);
    if (f.who === 'nevoa') Audio8.sfx('villain');
    if (S.autoRead) Voice.speak(f.text);
    const fl = G && G.mode !== 'sala', last = i >= frames.length - 1;
    setFoot(`${fl ? '' : `<button class="btn" id="say" data-local aria-label="Ouvir">${ICON.voice}<span class="lbl">Ouvir</span></button>`}<span class="grow"></span><button class="btn ghost" id="skip" style="color:#fff">Pular</button><button class="btn primary big ${last ? 'lastbtn' : ''}" id="nx">${!last ? (fl ? '' : 'Continuar') : (f.last || 'Vamos lá!')} ${ICON.next}</button>`);
    if (fl) { $('#foot').classList.add('flow', 'cutfoot'); document.documentElement.classList.add('flowfoot'); }
    if ($('#say')) $('#say').onclick = () => { Audio8.init(); Voice.speak(f.text); };
    $('#skip').onclick = () => onDone();
    $('#nx').onclick = () => { Audio8.sfx('page'); if (i < frames.length - 1) { i++; show(); } else onDone(); };
    /* minifilme: passa sozinho; tocar na cena adianta */
    if (cancelT) { cancelT(); cancelT = null; } /* sem pressa: a criança lê e toca para seguir */
    $('#cut').onclick = () => $('#nx').click();
  };
  show();
}

function screenInterlude(rid, k, n) {
  const r = REGIONS.find(x => x.id === rid), mids = r.missions.filter(m => G.album.includes(MISSIONS[m].char)).slice(0, 2);
  const lines = INTERLUDES[n > 1 ? Math.round((k - 1) * (INTERLUDES.length - 1) / (n - 1)) : INTERLUDES.length - 1];
  const scene = MISSIONS[r.missions[0]].steps[0].scene, prog = progress(), nw = Math.max(20, 70 - prog * 50);
  const actors = {};
  mids.forEach((m, i) => { actors['w' + i] = { s: MISSIONS[m].char, from: [i ? 170 : -18, 56], x: i ? 96 : 52, y: 56, walk: true, flip: !!i }; });

/* ---------- "E se ninguém fizesse?" ---------- */
STEPS.days = function (step, ctx) {
  const c = CHARACTERS[step.char], last = step.stages[step.stages.length - 1].n, unitL = step.unit.toLowerCase();
  let day = 0, guess = null, phase = 'predict', busy = false, restored = false; const added = [];
  const L = 'ABC';
  const renderPredict = () => {
    ctx.stage.innerHTML = promptHTML(`E se ninguém fizesse o trabalho de ${c.name}? Antes de ver, dê o seu palpite!`) + `
      <div class="panel stage"><h3>${esc(step.title)}</h3><p style="font-weight:800;margin:0">${esc(step.predict.q)}</p>
      <div class="options">${step.predict.options.map((o, i) => `<button class="opt" data-g="${i}"><span class="l">${L[i]}</span><span>${esc(o)}</span></button>`).join('')}</div></div>`;
    wireSay(ctx.stage, () => step.predict.q + ' ' + step.predict.options.join('. '));
    $$('[data-g]', ctx.stage).forEach(b => b.onclick = () => { guess = +b.dataset.g; Audio8.sfx('select'); ctx.activity(); phase = 'run'; renderRun(); });
  };
  const renderRun = () => {
    ctx.stage.innerHTML = promptHTML(`${step.title}. Toque em "Passar ${step.unit === 'Semana' ? 'uma semana' : 'um dia'}" e veja o que acontece.`) + `
      <div class="two"><div><div class="scene days" id="ds"><img class="bg px" src="${composeScene(step.scene).toDataURL()}" alt="${esc(step.title)}">${ambientHTML(step.scene)}<div class="layer" id="dl"></div>
        <div class="tint" id="dt" style="background:${step.tint}"></div><div class="night" id="nf"></div><div class="daycount" id="dc">${esc(step.unit)} 0</div><div class="vcap dcap" id="dcap"></div></div>
        <div class="meter"><span>${esc(step.meter)}</span><div class="bar"><i id="mb" style="width:0%"></i></div></div>
        <div class="row center" style="margin-top:12px" id="ctl"><button class="btn primary big" id="pass">${ICON.next} Passar ${step.unit === 'Semana' ? 'uma semana' : 'um dia'}</button></div></div>
      <div class="cons"><h3>O que aconteceu</h3><ul id="cl"><li class="muted">Ainda nada... por enquanto.</li></ul></div></div><div id="fb"></div>`;
    wireSay(ctx.stage, () => step.title);
    $('#pass', ctx.stage).onclick = passDay;
  };
  const passDay = () => {
    if (busy || day >= last) return; busy = true; ctx.activity(); day++;
    const nf = $('#nf', ctx.stage); nf.classList.remove('go'); void nf.offsetWidth; nf.classList.add('go');
    Audio8.sfx('page');
    setTimeout(() => {
      $('#dc', ctx.stage).textContent = `${step.unit} ${day}`; $('#dc', ctx.stage).classList.remove('pop'); void $('#dc', ctx.stage).offsetWidth; $('#dc', ctx.stage).classList.add('pop');
      const f = day / last; $('#mb', ctx.stage).style.width = (f * 100) + '%'; $('#dt', ctx.stage).style.opacity = f * (step.tint === '#05060f' ? .7 : .35);
      const sg = step.stages.find(s => s.n === day);
      if (sg) {
        const lay = $('#dl', ctx.stage);
        sg.add.forEach(([p, x, y], k) => setTimeout(() => { const el = spriteEl(p, x, y, { cls: 'popin' + (p === 'mosca' || p === 'mosquito' ? ' buzz' : '') }); lay.appendChild(el); added.push(el); }, k * 220));
        const cl = $('#cl', ctx.stage); if (cl.querySelector('.muted')) cl.innerHTML = '';
        cl.insertAdjacentHTML('beforeend', `<li><b>${esc(step.unit)} ${day}:</b> ${esc(sg.text)}</li>`);
        const dc = $('#dcap', ctx.stage); dc.textContent = sg.text; dc.classList.add('show');
        Audio8.sfx('soft'); if (S.autoRead) Voice.speak(`${step.unit} ${day}. ${sg.text}`);
      }
      busy = false;
      if (day >= last) finishRun();
      else if ($('#pass', ctx.stage)) $('#pass', ctx.stage).innerHTML = `${ICON.next} Passar ${step.unit === 'Semana' ? 'mais uma semana' : 'mais um dia'}`;
    }, S.reduceMotion ? 0 : 420);
  };
  const finishRun = () => {
    if (auto) { setTimeout(restore, 1300); return; }
    const right = guess === step.predict.answer;
    if (right) addMedal('curiosidade', 1, 'pred:' + ctx.id);

  for (let i = 0; i < 6; i++) addTrash(rnd(14, PSIDE - 16), rnd(48, 72), 'p');

  const put = (el, x, y) => { el.style.left = pct(x, SW); el.style.top = pct(y, SH); };

  };
  const sweepNear = (who, side) => {

    for (const t of trash) if ((side === 'any' || t.side === side) && Math.hypot(t.x - (o.x + 2), t.y - (o.y + 12)) < 12) {
      if (who === 'p' && P.load >= CAP) { if (!sweepNear._warned) { fbq( 'info', '<b>Carrinho cheio!</b> Leve até a lixeira grande, lá na esquerda.', 'lixeira'); sweepNear._warned = true; } return; }

    if (!dx && !dy && P.tx !== null) { const ddx = P.tx - P.x, ddy = P.ty - P.y, d = Math.hypot(ddx, ddy); if (d < 2) P.tx = null; else { dx = ddx / d; dy = ddy / d; } }
    if (dx || dy) {
      const n = Math.hypot(dx, dy) || 1; P.x = clamp(P.x + dx / n * speed, 0, 144); P.y = clamp(P.y + dy / n * speed * .8, 38, 66);
      me._f = (me._f || 0) + 1; if (me._f % 3 === 0) me.src = SPR.url(avatarOf(), (me._f / 3) % 2 ? 'walk' : null);

    el.style.transitionDuration = '0s'; void el.offsetWidth; moveEl(el, -20, 34, 3800, true);
    setTimeout(() => {
      if (choice) { el.insertAdjacentHTML('afterend', ''); Audio8.sfx('select'); fbq( 'ok', choice === 'placa' ? 'A pessoa viu a placa e guardou o lixo para jogar na lixeira!' : '"Opa, desculpa! Vou jogar no lixo." Funcionou!', 'coracao'); }
      else { drops++; for (let k = 0; k < 2; k++) addTrash(rnd(16, PSIDE - 10), rnd(46, 70), 'p'); Audio8.sfx('soft'); fbq( 'soft', `Ei! Alguém passou e jogou lixo no chão de novo${drops > 1 ? '... outra vez!' : '.'}`, 'papel'); if (drops >= 2 && !asked) askChoice(); }
    }, 1500);

  };

      <button class="opt" data-ch="falar"><span class="l">B</span>Pedir com educação para jogar no lixo</button></div></div>`;
    $$('[data-ch]', ctx.stage).forEach(b => b.onclick = () => {
      choice = b.dataset.ch; addMedal('gentileza', 1, 'shift:' + ctx.id); Audio8.sfx('ok');
      $('#ask', ctx.stage).innerHTML = `<div class="feedback ok">${SPR.img('coracao')}<div><b class="kind">Boa ideia!</b>Quando todo mundo colabora, o trabalho de quem limpa rende muito mais.</div></div>`;
      if (choice === 'placa') { const pl = spriteEl('cone', 60, 40, { w: 12, cls: 'popin' }); lay.appendChild(pl); }

    if (S.autoRead) Voice.speak(`Turno concluído! Você recolheu ${P.total} lixos. Você limpou um quarteirão. Eu e minha equipe varremos mais de 40 por dia, desde as 5 da manhã.`);
    ctx.complete();
  };
  /* controles: direcional, teclado e tocar na rua */
  const map = { ArrowUp: 'u', ArrowDown: 'd', ArrowLeft: 'l', ArrowRight: 'r', w: 'u', s: 'd', a: 'l', d: 'r' };
  const kd = e => { if ($('#modal') || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return; const k = map[e.key]; if (k) { e.preventDefault(); keys[k] = true; P.tx = null; } };

  sc.addEventListener('click', e => { const r = sc.getBoundingClientRect(); P.tx = (e.clientX - r.left) / r.width * SW - 8; P.ty = (e.clientY - r.top) / r.height * SH - 20; });

    h.animate([{ transform: 'translate(-30%, 30%) scale(1)' }, { transform: 'translate(-30%, 5%) scale(.82)' }, { transform: 'translate(-30%, 30%) scale(1)' }], { duration: 650, iterations: 2 }).onfinish = () => { if (n > 1) setTimeout(() => go(n - 1), 900); else h.remove(); }; };
  setTimeout(() => go(3), delay);

/* ---------------- BOMBEIRA: apagar o fogo ---------------- */
STEPS.fire = function (step, ctx) {

  const lay = $('#lay', ctx.stage), sc = $('#js', ctx.stage), say = $('#say', ctx.stage);
  const truck = spriteEl('bombeiros', -50, 66, { w: 48 }); lay.appendChild(truck); setTimeout(() => moveEl(truck, 4, 66, 1200), 50);
  const jo = spriteEl('joana', 26, 50); lay.appendChild(jo);
  $('#hyd', ctx.stage).classList.add('glow'); setTimeout(() => demoTap($('#hyd', ctx.stage)), 900);
  const spawn = () => {

/* ---------------- POLICIAL COMUNITÁRIO: travessia segura ---------------- */
STEPS.cross = function (step, ctx) {
  energize();
  const goal = G.diff === 'exp' ? 3 : 4, ZX0 = 62, ZX1 = 80;
  let mode = 'go', cars = [], kids = null, crossed = 0, done = false, tick = 0, waitT = 0, idleStop = 0, nextCar = 0;
  ctx.stage.innerHTML = `<div class="mg job">${mgHead('carlos', 'Quando as crianças chegarem, toque em <b>PARE</b>!')}
    <div class="scene jobscene" id="js"><img class="bg px" src="${composeScene('ruacasas').toDataURL()}" alt="Rua com faixa de pedestres"><div class="layer" id="lay"></div><div class="mgsay" id="say"></div></div>
    <div class="crossbar"><button class="btn big stopb" id="cpare">${SPR.img('pare')} PARE</button><span class="kidsok">Crianças seguras: <b id="cnt">0/${goal}</b></span><button class="btn big gob" id="csiga" disabled>SIGA ${ICON.next}</button></div></div>`;
  wireSay(ctx.stage, () => 'Quando as crianças chegarem, toque em PARE. Depois que atravessarem, toque em SIGA.');
  const lay = $('#lay', ctx.stage), say = $('#say', ctx.stage), sc = $('#js', ctx.stage);
  const cop = spriteEl('carlos', 82, 40); lay.appendChild(cop);
  const sign = spriteEl('pare', 92, 34, { w: 10 }); sign.style.opacity = 0; lay.appendChild(sign);
  const VAR = ['carro', 'carro2', 'carro3', 'taxi'];
  const addCar = lane => {
    const v = pick(VAR), x = lane === 0 ? -34 : 162, el = spriteEl(v, x, lane === 0 ? 66 : 75, { w: 32 }); el.style.transitionDuration = '0s';
    if (lane === 1) el.classList.add('flip'); lay.appendChild(el); cars.push({ lane, x, el });
  };
  const zebraClear = () => !cars.some(c => c.x + 32 > ZX0 - 1 && c.x < ZX1 + 1);
  const spawnKids = () => {
    const ids = shuffle(['theo', 'bia', 'iara', 'davi']).slice(0, 2);
    const els = ids.map((id, i) => { const e = spriteEl(id, 60 + i * 9, 40); lay.appendChild(e); return e; });
    kids = { els, state: 'wait' }; waitT = 0; if (!crossed) demoTap($('#cpare', ctx.stage), 300);
    floatText(sc, 'Quero atravessar!', 45, 30); Audio8.sfx('select');
  };
  const upd = () => { $('#cnt', ctx.stage).textContent = `${crossed}/${goal}`; $('#cpare', ctx.stage).disabled = mode === 'stop'; $('#csiga', ctx.stage).disabled = mode === 'go'; sign.style.opacity = mode === 'stop' ? 1 : 0; };
  $('#cpare', ctx.stage).onclick = () => {
    if (done || mode === 'stop') return; ctx.activity();
    if (!kids) { ctx.mistake(); Audio8.sfx('soft'); floatText(sc, 'Biii!', 30, 60); mgSay(say, 'Ninguém esperando: deixe os carros passarem.', 'soft'); return; }
    mode = 'stop'; idleStop = 0; Audio8.sfx('ok'); upd(); setHead(ctx, 'Carros parando... quando a faixa ficar livre, as crianças atravessam.');
  };
  $('#csiga', ctx.stage).onclick = () => {
    if (done || mode === 'go') return; ctx.activity();
    if (kids) { ctx.mistake(); Audio8.sfx('soft'); mgSay(say, kids.state === 'cross' ? 'Espere! Tem criança na faixa!' : 'As crianças ainda não atravessaram!', 'soft'); return; }
    mode = 'go'; Audio8.sfx('select'); upd(); setHead(ctx, 'Trânsito liberado. Fique de olho nas crianças!');
  };
  const loop = setInterval(() => {
    if (done) return; tick++;
    /* carros */
    if (tick >= nextCar && cars.length < 5) { addCar(tick % 2); nextCar = tick + 22 + (tick * 7) % 18; }
    for (const lane of [0, 1]) {
      const list = cars.filter(c => c.lane === lane).sort((a, b) => lane === 0 ? b.x - a.x : a.x - b.x);
      list.forEach((c, i) => {
        const sp = 1.8; let nx = lane === 0 ? c.x + sp : c.x - sp;
        if (mode === 'stop') { if (lane === 0 && c.x + 32 <= ZX0 - 1) nx = Math.min(nx, ZX0 - 34); if (lane === 1 && c.x >= ZX1 + 1) nx = Math.max(nx, ZX1 + 2); }
        const ahead = list[i - 1]; if (ahead) nx = lane === 0 ? Math.min(nx, ahead.x - 35) : Math.max(nx, ahead.x + 35);
        c.x = nx; c.el.style.left = pct(c.x, SW);
      });
    }
    cars = cars.filter(c => { const gone = c.x > 170 || c.x < -40; if (gone) c.el.remove(); return !gone; });
    /* crianças */
    if (!kids && mode === 'go' && tick % 40 === 20 && crossed < goal) spawnKids();
    if (kids && kids.state === 'wait') {
      waitT++;
      if (mode === 'stop' && zebraClear()) { kids.state = 'cross'; Audio8.sfx('step'); kids.els.forEach((e, i) => moveEl(e, 64 + i * 7, 92, 2400, true)); setTimeout(() => { if (!kids) return; kids.els.forEach(e => e.remove()); kids = null; crossed++; Audio8.sfx('found'); floatText(sc, 'Atravessaram!', 50, 70); ctx.nextTurn(); upd(); if (crossed >= goal) finish(); else setHead(ctx, 'Agora toque em <b>SIGA</b> para liberar os carros.'); }, 2500); }
      if (mode === 'go' && waitT === 60) mgSay(say, 'As crianças estão esperando! Toque em PARE.', 'info');
    }
    if (mode === 'stop' && !kids) { idleStop++; if (idleStop % 50 === 30) { floatText(sc, 'Biii!', 20, 62); Audio8.sfx('soft'); mgSay(say, 'Já atravessaram! Toque em SIGA.', 'info'); } }
  }, 50);
  onCleanup(() => clearInterval(loop));
  const finish = () => {
    done = true; clearInterval(loop); Audio8.sfx('win'); confetti(40);
    setHead(ctx, '<b>Todo mundo seguro!</b> Atravesse sempre na faixa. Emergência: <b>190</b>.');
    if (S.autoRead) Voice.speak('Todo mundo seguro! Atravesse sempre na faixa.');
    ctx.complete();
  };
  upd();
  return {
    speak: () => 'Quando as crianças chegarem, toque em PARE. Depois, toque em SIGA.',
    hint() { ctx.usedHint(); const b = kids && mode === 'go' ? $('#cpare', ctx.stage) : $('#csiga', ctx.stage); b.classList.add('glow'); setTimeout(() => b.classList.remove('glow'), 1600); },
    autoStep() { if (done) return; if (kids && mode === 'go') $('#cpare', ctx.stage).click(); else if (!kids && mode === 'stop') $('#csiga', ctx.stage).click(); }
  };
};

const CATCH = {

STEPS.catch = function (step, ctx) {
  const C = CATCH[step.who || ctx.id], goal = G.diff === 'exp' ? 8 : G.diff === 'inv' ? 10 : 12;
  Audio8.energy = 1; onCleanup(() => { Audio8.energy = 0; });
  let px = 72, tx = 72, got = 0, items = [], tick = 0, done = false, combo = 0;
  ctx.stage.innerHTML = `<div class="mg job catchg">${mgHead(ctx.id, C.say)}
    <div class="scene jobscene catchscene" id="js"><img class="bg px" src="${composeScene(C.scene).toDataURL()}" alt="Cena do pega-pega"><div class="layer" id="lay"></div><div class="mgsay" id="say"></div>
      <div class="ctouch" id="ct" aria-label="Arraste para mover"></div></div>
    <div class="mgbar"><span>${C.unit}</span><div class="bar"><i id="cm" style="width:0%;background:linear-gradient(90deg,#3d9a55,#a5d97f)"></i></div><b id="cnt">0/${goal}</b></div>
    <div class="cbtns"><button class="btn big" id="cl" aria-label="Para a esquerda">◀</button><button class="btn big" id="cr" aria-label="Para a direita">▶</button></div></div>`;
  wireSay(ctx.stage, () => C.say.replace(/<[^>]+>/g, ''));
  const lay = $('#lay', ctx.stage), sc = $('#js', ctx.stage), say = $('#say', ctx.stage);
  const hero = spriteEl(ctx.id, px, 56); hero.style.transitionDuration = '0s'; lay.appendChild(hero);
  const basket = spriteEl('cesta', px + 1, 56, { w: 16 }); basket.style.transitionDuration = '0s'; lay.appendChild(basket);
  const place = () => { hero.style.left = pct(px, SW); basket.style.left = pct(px + 1, SW); basket.style.top = pct(45, SH); };
  /* controles: arrastar o dedo na cena, tocar nos lados, setas */
  const toX = e => { const r = sc.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width * SW - 8, 0, 144); };
  const ct = $('#ct', ctx.stage);
  ct.addEventListener('pointerdown', e => { tx = toX(e); ctx.activity(); ct.setPointerCapture && ct.setPointerCapture(e.pointerId); });
  ct.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'touch') tx = toX(e); });
  const hold = (id, d) => { const b = $(id, ctx.stage); let iv; const st = () => { clearInterval(iv); iv = setInterval(() => { tx = clamp(tx + d * 4, 0, 144); }, 40); }; b.addEventListener('pointerdown', st); ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => clearInterval(iv))); b.onclick = () => { tx = clamp(tx + d * 18, 0, 144); }; onCleanup(() => clearInterval(iv)); };
  hold('#cl', -1); hold('#cr', 1);
  const kd = e => { if (e.key === 'ArrowLeft') tx = clamp(tx - 14, 0, 144); if (e.key === 'ArrowRight') tx = clamp(tx + 14, 0, 144); };
  document.addEventListener('keydown', kd); onCleanup(() => document.removeEventListener('keydown', kd));
  const spawn = () => {
    const bad = RNG.next() < .28, prop = pick(bad ? C.bad : C.good), x = 6 + RNG.next() * 140;
    const el = spriteEl(prop, x, -14, { w: bad ? 15 : 13, cls: bad ? 'catch-bad' : 'catch-good' }); el.style.transitionDuration = '0s'; lay.appendChild(el);
    items.push({ x, y: -14, vy: .55 + RNG.next() * .35 + got * .02, bad, el, wob: RNG.next() * 6 });
  };
  const upd = () => { $('#cnt', ctx.stage).textContent = `${got}/${goal}`; $('#cm', ctx.stage).style.width = Math.min(100, got / goal * 100) + '%'; };
  const loop = setInterval(() => {
    if (done) return; tick++;
    px += (tx - px) * .25; place(); hero.classList.toggle('flip', tx < px - .5);
    if (tick % 18 === 0) spawn();
    for (const it of items) {
      it.y += it.vy; const xx = it.bad ? it.x + Math.sin((tick + it.wob * 10) / 8) * 6 : it.x;
      it.el.style.top = pct(it.y, SH); it.el.style.left = pct(xx, SW);
      if (!it.gone && it.y > 44 && it.y < 60 && Math.abs(xx - px) < 13) {
        it.gone = true; it.el.classList.add(it.bad ? 'gone' : 'poof'); setTimeout(() => it.el.remove(), 350);
        if (it.bad) { got = Math.max(0, got - 1); combo = 0; ctx.mistake(); Audio8.sfx('soft'); hero.classList.add('shake'); setTimeout(() => hero.classList.remove('shake'), 400); floatText(sc, it.el._name === 'mosquito' ? 'Ai! Mosquito!' : 'Ei! Fumacinha!', xx / SW * 100, 40); }
        else { got++; combo++; Audio8.sfx(combo >= 3 ? 'medal' : 'found'); floatText(sc, combo >= 3 ? `Combo x${combo}!` : '+1', xx / SW * 100, 40); ctx.nextTurn(); if (got >= goal) finish(); }
        upd();
      }
      if (!it.gone && it.y > 92) { it.gone = true; it.el.remove(); if (!it.bad) combo = 0; }
    }
    items = items.filter(i => !i.gone || document.body.contains(i.el));
  }, 40);
  onCleanup(() => clearInterval(loop));
  const finish = () => {
    done = true; clearInterval(loop); Audio8.sfx('win'); confetti(40);
    items.forEach(i => i.el.remove());
    setHead(ctx, `<b>${C.end}</b>`); mgSay(say, C.end);
    if (S.autoRead) Voice.speak(C.end);
    ctx.complete();
  };
  place(); upd(); setTimeout(() => demoTap(ct, 0), 600);
  return {
    speak: () => C.say.replace(/<[^>]+>/g, ''),
    hint() { ctx.usedHint(); mgSay(say, 'Arraste o dedo para os lados e pegue o que cai!', 'info'); },
    autoStep() { const t = items.filter(i => !i.gone && !i.bad).sort((a, b) => b.y - a.y)[0]; if (t) tx = clamp(t.x, 0, 144); }
  };
};

/* ============================================================
   JOGAR ONLINE — cada um na sua casa, na mesma partida
   Conexão direta entre os aparelhos (WebRTC via PeerJS).
   O anfitrião decide as telas; os toques de todo mundo
   são espelhados nos outros aparelhos.
   ============================================================ */


const NET = { on: false, role: null, peer: null, conns: [], host: null, me: 0, code: '', started: false, applying: false, players: [], screen: '' };
const ROOM_ALPHA = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const ROOM_PREFIX = 'cidade-esqueceu-v1-';

function peerOptions() {
  const q = new URLSearchParams(location.search).get('peer');
  if (q) { const [host, port] = q.split(':'); return { host, port: +port, path: '/', secure: false, config: { iceServers: [] } }; }
  return { config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' },
    /* reserva para redes de celular (4G) que bloqueiam conexão direta */
    { urls: ['turn:openrelay.metered.ca:80', 'turn:openrelay.metered.ca:443', 'turn:openrelay.metered.ca:443?transport=tcp'], username: 'openrelayproject', credential: 'openrelayproject' }] } };
}
function netSend(msg, except) {
  if (!NET.on) return;
  const data = JSON.stringify(msg);
  if (NET.role === 'host') NET.conns.forEach(c => { if (c !== except && c.open) c.send(data); });
  else if (NET.host && NET.host.open) NET.host.send(data);
}
function netReset() {
  try { NET.conns.forEach(c => c.close()); if (NET.host) NET.host.close(); if (NET.peer) NET.peer.destroy(); } catch (e) {}
  Object.assign(NET, { on: false, role: null, peer: null, conns: [], host: null, me: 0, code: '', started: false, applying: false, players: [], screen: '' });
}

/* ---------- espelhar toques ---------- */
function screenSig() { const st = $('#stage'); return NET.screen + '|' + (st && st.dataset.phase || ''); }
function pathOf(el, root) { const p = []; while (el && el !== root) { p.unshift([...el.parentNode.children].indexOf(el)); el = el.parentNode; } return p; }
function fromPath(root, p) { let el = root; for (const i of p) { if (!el) return null; el = el.children[i]; } return el; }
function rootOf(el) { const a = el.closest('#app'), f = el.closest('#foot'); return a ? ['app', a] : f ? ['foot', f] : [null, null]; }
const MIRROR_SEL = 'button, .hot, .cell, .scene.shift, .scene:has(.hot), .lc, .mem, [data-c], .chip, .opt';
document.addEventListener('click', e => {
  if (!NET.on || !NET.started || !e.isTrusted || NET.applying) return;
  const el = e.target.closest(MIRROR_SEL); if (!el || el.closest('#modal') || el.closest('[data-local]')) return;
  const [rname, root] = rootOf(el); if (!root) return;
  const r = el.getBoundingClientRect();
  netSend({ t: 'click', root: rname, path: pathOf(el, root), tag: el.tagName, sig: screenSig(), rx: (e.clientX - r.left) / (r.width || 1), ry: (e.clientY - r.top) / (r.height || 1) });
}, true);
['pointerdown', 'pointerup'].forEach(type => document.addEventListener(type, e => {
  if (!NET.on || !NET.started || !e.isTrusted || NET.applying) return;
  const el = e.target.closest('.dp[data-d]'); if (!el) return;
  const [rname, root] = rootOf(el); if (!root) return;
  netSend({ t: 'ptr', type, root: rname, path: pathOf(el, root), sig: screenSig() });
}, true));
['keydown', 'keyup'].forEach(type => document.addEventListener(type, e => {
  if (!NET.on || !NET.started || !e.isTrusted || NET.applying || e.repeat) return;
  if (!/^(Arrow(Up|Down|Left|Right)|w|a|s|d)$/.test(e.key) || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  netSend({ t: 'key', type, key: e.key, sig: screenSig() });
}, true));
document.addEventListener('input', e => {
  if (!NET.on || !NET.started || !e.isTrusted || NET.applying) return;
  const el = e.target; const [rname, root] = rootOf(el); if (!root || el.closest('#modal')) return;
  netSend({ t: 'input', root: rname, path: pathOf(el, root), value: el.value, sig: screenSig() });
}, true);

function applyRemote(msg) {
  if (msg.sig !== undefined && msg.sig !== screenSig()) return;
  NET.applying = true;
  try {
    if (msg.t === 'key') { document.dispatchEvent(new KeyboardEvent(msg.type, { key: msg.key, bubbles: true })); return; }
    const root = msg.root === 'foot' ? $('#foot') : app(); if (!root) return;
    const el = fromPath(root, msg.path); if (!el) return;
    if (msg.t === 'input') { el.value = msg.value; el.dispatchEvent(new Event('input', { bubbles: true })); return; }
    if (msg.tag && el.tagName !== msg.tag) return;
    if (msg.t === 'ptr') { el.dispatchEvent(new PointerEvent(msg.type, { bubbles: true, cancelable: true })); return; }
    const r = el.getBoundingClientRect();
    el.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, clientX: r.left + msg.rx * r.width, clientY: r.top + msg.ry * r.height }));
  } finally { NET.applying = false; }
}

/* ---------- mensagens ---------- */
function onData(raw, conn) {
  let msg; try { msg = JSON.parse(raw); } catch (e) { return; }
  if (NET.role === 'host') {
    if (msg.t === 'hello') {
      if (NET.started) { conn.send(JSON.stringify({ t: 'full' })); return; }
      if (NET.players.length >= 4) { conn.send(JSON.stringify({ t: 'full' })); return; }
      conn._idx = NET.players.length;
      NET.players.push({ name: String(msg.name || 'Amigo').slice(0, 18), color: PLAYER_COLORS[NET.players.length], avatar: msg.avatar || randomAvatar() });
      conn.send(JSON.stringify({ t: 'welcome', me: conn._idx }));
      netSend({ t: 'lobby', players: NET.players }); Audio8.sfx('found'); renderLobby();
      return;
    }
    if (['click', 'ptr', 'key', 'input'].includes(msg.t)) { applyRemote(msg); netSend(msg, conn); }
    return;
  }
  /* convidado */
  if (msg.t === 'welcome') { NET.me = msg.me; return; }
  if (msg.t === 'full') { toast('Essa sala já começou ou está cheia.', 'nevoa'); netReset(); go(screenOnline); return; }
  if (msg.t === 'lobby') { NET.players = msg.players; renderLobby(); return; }
  if (msg.t === 'start') { NET.started = true; return; }
  if (msg.t === 'go') {
    G = msg.G; applySettings();
    const fn = window[msg.fn]; if (typeof fn !== 'function') return;
    if (msg.fn === 'screenFinale' || msg.args[0] === '_finale') buildFinale();
    NET.applying = true; RNG.seed(msg.seed);
    try { go(fn, ...msg.args); } finally { NET.applying = false; }
    return;
  }
  if (['click', 'ptr', 'key', 'input'].includes(msg.t)) applyRemote(msg);
}

/* ============================================================
   VISITAR A CIDADE DE UM AMIGO — sem servidor e sem cadastro.
   O progresso vira um código curto (e um link). Quem recebe vê a
   cidade do amigo, o álbum dele e compara com o seu.
   ============================================================ */


const B32 = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
const CHAR_IDS = () => Object.keys(CHARACTERS);
const MEDAL_IDS = ['colaboracao', 'curiosidade', 'criatividade', 'gentileza'];
const AV_BITS = [['skin', 2], ['hair', 3], ['hairColor', 3], ['shirt', 3], ['bottom', 1], ['bottomColor', 3], ['extra', 2]];

/* versão(2) + álbum(n) + estrelas(2n) + medalhas(4) + final(1) + visual(17) + verificador(5) */
const codeLen = () => Math.ceil((29 + 3 * CHAR_IDS().length) / 5);
function packCity(album, stars, earned, finished, av) {
  const ids = CHAR_IDS(); let v = 0n;
  const put = (val, n) => { v = (v << BigInt(n)) | BigInt(val & ((1 << n) - 1)); };
  put(1, 2);
  ids.forEach(id => put(album.includes(id) ? 1 : 0, 1));
  ids.forEach(id => put(Math.min(3, stars[id] || 0), 2));
  MEDAL_IDS.forEach(m => put(earned[m] ? 1 : 0, 1));
  put(finished ? 1 : 0, 1);
  AV_BITS.forEach(([k, n]) => put(Math.max(0, AVATAR_OPTS[k].indexOf((av || {})[k])), n));
  return v;
}
const chk32 = v => { let s = 7; for (let x = v; x > 0n; x >>= 5n) s = (s * 3 + Number(x & 31n)) % 32; return s; };
function cityCode() {
  if (!G) return null;
  const data = packCity(G.album, G.stars, G.earned, G.finished, G.players[0] && G.players[0].avatar);
  let v = (data << 5n) | BigInt(chk32(data)), s = '';
  for (let i = 0; i < codeLen(); i++) { s = B32[Number(v & 31n)] + s; v >>= 5n; }
  return s;
}
function cityName() {
  if (!G) return '';
  return G.players.map(p => p.name).filter(Boolean).join(' e ').slice(0, 28) || 'Amigo';
}
function cityLink() {
  const code = cityCode(); if (!code) return '';
  const base = shareBase();
  const nm = encodeURIComponent(cityName());
  return `${base}?visita=${code}&nome=${nm}`;
}
function readCityCode(raw) {
  const code = String(raw || '').toUpperCase().replace(/[^0-9A-Z]/g, '').replace(/O/g, '0').replace(/[IL]/g, '1');
  if (code.length !== codeLen()) return null;
  let v = 0n;
  for (const ch of code) { const i = B32.indexOf(ch); if (i < 0) return null; v = (v << 5n) | BigInt(i); }
  const sum = Number(v & 31n), data = v >> 5n;
  if (chk32(data) !== sum) return null;
  let w = data; const take = n => { const r = Number(w & BigInt((1 << n) - 1)); w >>= BigInt(n); return r; };
  const avatar = {}; AV_BITS.slice().reverse().forEach(([k, n]) => { avatar[k] = AVATAR_OPTS[k][take(n)] || AVATAR_OPTS[k][0]; });
  const finished = !!take(1);
  const earned = {}; MEDAL_IDS.slice().reverse().forEach(m => { if (take(1)) earned[m] = true; });
  const ids = CHAR_IDS(), stars = {}; ids.slice().reverse().forEach(id => { stars[id] = take(2); });
  const album = []; ids.slice().reverse().forEach(id => { if (take(1)) album.unshift(id); });
  if (take(2) !== 1) return null;
  return { album, stars, earned, finished, avatar };
}

/* celular: pedir para girar e, no Android, tela cheia na horizontal */
(function () {

  try { if (sessionStorage.getItem('rotOk')) document.documentElement.classList.add('rotok'); } catch (e) {}
  const el = document.createElement('div'); el.id = 'rotate';
  el.innerHTML = `<div class="in"><div class="phone" aria-hidden="true"></div><h2>Gire o celular!</h2><p>Deitado, a cidade fica maior e os botões ficam pertinho do seu dedo.</p><button class="skip" id="rotskip">Jogar em pé mesmo</button></div>`;
  document.body.appendChild(el);
  el.querySelector('#rotskip').onclick = () => { document.documentElement.classList.add('rotok'); try { sessionStorage.setItem('rotOk', '1'); } catch (e) {} };
  /* primeiro toque: tela cheia + travar na horizontal quando o navegador deixa (Android) */
  /* tela cheia só quando o celular já está deitado (não gira a tela sozinho) */
  document.addEventListener('pointerup', () => {
    const d = document.documentElement;
    if (!matchMedia('(orientation: landscape)').matches || document.fullscreenElement || !d.requestFullscreen) return;
    d.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
  }, { capture: true });
})();
</script>
</body>
</html>
